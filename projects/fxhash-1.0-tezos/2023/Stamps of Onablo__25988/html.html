								frameUpdate(-1);
								break;
							}
							
						}
					}
					
					let subLayerI = 0;
					if(variation.layers.length>0){
						for(let subLayer of variation.layers) {
							let frameNo = 0;
							let lastTime = 0;
							// console.log('variation is made up of sublayers',subLayer);
							const subLayerEl = document.createElement('div');
							const subcLayerEl = document.createElement('div');
							subLayerEl.classList.add('layer');
							subcLayerEl.classList.add('layer');
							if(subLayer.blendMode){
								subLayerEl.classList.add('blend-'+subLayer.blendMode);
							}
							subLayerEl.setAttribute('data-sublayer',subLayerI);
							subcLayerEl.setAttribute('data-sublayer',subLayerI);
							layerEl.appendChild(subLayerEl);
							const fps = variation?.fps ?? 10;
							// console.log('variation fps',fps);
							let subFrameCnt = subLayer.frames.length
							
							subLayerEl.setAttribute('data-fps',fps);
							subLayerEl.setAttribute('data-frames',subFrameCnt);
							
							
							for(let fno=0; fno<subFrameCnt; fno++){
								const _clayerEl = subcLayerEl.cloneNode(true)
								_clayerEl.setAttribute('data-frame',fno);
								clayerEl.append(_clayerEl)
							}
							
							let frameTime = fps===0 ? 1 : (Math.round(100/fps)*10)
							const frameUpdate = (t) => {
								if(((t-lastTime) >= frameTime) || t < 0){
									lastTime = t;
									if(subLayer.frames[frameNo%subLayer.frames.length]?.delay){
										frameTime =  subLayer.frames[frameNo%subLayer.frames.length]?.delay;
									}else {
										frameTime = fps===0 ? 1 : (Math.round(100/fps)*10)
									}
									lastTime = t;
									subLayerEl.setAttribute('data-frame',frameNo%subFrameCnt);
									frameNo++;
								}
							}
							updateFns.push(frameUpdate)
							frameUpdate(-1);
							
							subLayerI++;
						}
					}
				}
