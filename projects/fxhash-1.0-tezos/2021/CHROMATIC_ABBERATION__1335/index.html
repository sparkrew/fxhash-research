    <script id="fxhash-snippet">
      let alphabet = "123456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ"
      var fxhash = new URLSearchParams(window.location.search).get('fxhash')
      let b58dec = (str) => str.split('').reduce((p,c,i) => p + alphabet.indexOf(c) * (Math.pow(alphabet.length, str.length-i-1)), 0)
      let fxhashTrunc = fxhash.slice(2)
      let regex = new RegExp(".{" + ((fxhashTrunc.length/4)|0) + "}", 'g')
      let hashes = fxhashTrunc.match(regex).map(h => b58dec(h))
      let sfc32 = (a, b, c, d) => {
        return () => {
          a |= 0; b |= 0; c |= 0; d |= 0
          var t = (a + b | 0) + d | 0
          d = d + 1 | 0
          a = b ^ b >>> 9
          b = c + (c << 3) | 0
          c = c << 21 | c >>> 11
          c = c + t | 0
          return (t >>> 0) / 4294967296
        }
      }
      var fxrand = sfc32(...hashes)
      // used to get features during token mint
      window.addEventListener("message", (event) => {
        if (event.data === "fxhash_getFeatures") {
          parent.postMessage({
            id: "fxhash_getFeatures",
            data: window.$fxhashFeatures
          }, "*")
        }
      })
</script>

<script id="fragment-shader" type="no-js">
    #ifdef GL_ES
    precision mediump float;
    #endif
    
    uniform float time;
    uniform vec2 resolution;
    
    #define ANTIALIAS
    
    #define PI 3.14159265
    #define iTime time
    #define iResolution vec3(resolution, 1.0)
    #define saturate(a) (clamp((a),0.,1.))
    #define linearstep(a,b,t) (saturate(((t)-(a))/((b)-(a))))
    #define BEAT (time*170.0/60.0)
    float seed;
    
    const float CHROMATIC_ABBERATION = .02;
const float ITERATIONS = 20.;
const float INITIAL_LUMA = .5;

mat2 rotate2d(float _angle){
    return mat2(cos(_angle),-sin(_angle),
                sin(_angle),cos(_angle));
}


float getColorComponent(in vec2 st, in float modScale, in float blur, in float shapeSize) {
    vec2 modSt = mod(st, 1. / modScale) * modScale * 2. - 1.;
    float dist = length(modSt);
    float angle = atan(modSt.x, modSt.y);
    float shapeMap = smoothstep(shapeSize + blur, shapeSize - blur, dist);
    return shapeMap;
}

void mainImage(out vec4 fragColor, in vec2 fragCoord) {
    vec2 st =
        (2.* fragCoord - iResolution.xy)
        / min(iResolution.x, iResolution.y);
    st *= rotate2d(sin(iTime * .6 + st.x + st.y) * .3);
    st *= (sin(iTime * .3) + 2.) * .3;

    st *= log(length(sin(st * 5.18)) * (sin(iTime) + 2.) * 3.);
    float modScale = 1.;

    vec3 color = vec3(0);
    float luma = INITIAL_LUMA;
    float blur = .2;
    float shapeSize = .2 + (sin(iTime * .7) + 1.) * .2;
    for (float i = 0.; i < ITERATIONS; i++) {
        vec2 center = st + vec2(sin(iTime * .5), cos(iTime * .3));
        //center += pow(length(center), 1.);
        vec3 shapeColor = vec3(
            getColorComponent(center - st * CHROMATIC_ABBERATION, modScale, blur, shapeSize),
            getColorComponent(center, modScale, blur, shapeSize),
            getColorComponent(center + st * CHROMATIC_ABBERATION, modScale, blur, shapeSize)        
        ) * luma;
        st *= 1.1;
        st *= rotate2d(sin(iTime  * .05) * .3);
        color += shapeColor;
        color = clamp(color, 0., 1.);
        if (color == vec3(1)) break;
        luma *= .8;
        blur *= .63;
    }
    fragColor = vec4(color, 1.0);
}
    
    void main() {
      mainImage(gl_FragColor, gl_FragCoord.xy);
    }
    </script>
