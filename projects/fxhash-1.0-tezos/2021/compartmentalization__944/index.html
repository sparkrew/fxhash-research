<!DOCTYPE html>
<html>
<script id="fxhash-snippet">
      let alphabet = "123456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ"
      var fxhash = new URLSearchParams(window.location.search).get('fxhash')
      let b58dec = (str) => str.split('').reduce((p,c,i) => p + alphabet.indexOf(c) * (Math.pow(alphabet.length, str.length-i-1)), 0)
      let fxhashTrunc = fxhash.slice(2)
      let regex = new RegExp(".{" + ((fxhashTrunc.length/4)|0) + "}", 'g')
      let hashes = fxhashTrunc.match(regex).map(h => b58dec(h))
      let sfc32 = (a, b, c, d) => {
        return () => {
          a |= 0; b |= 0; c |= 0; d |= 0
          var t = (a + b | 0) + d | 0
          d = d + 1 | 0
          a = b ^ b >>> 9
          b = c + (c << 3) | 0
          c = c << 21 | c >>> 11
          c = c + t | 0
          return (t >>> 0) / 4294967296
        }
      }
      var fxrand = sfc32(...hashes)
      // used to get features during token mint
      window.addEventListener("message", (event) => {
        if (event.data === "fxhash_getFeatures") {
          parent.postMessage({
            id: "fxhash_getFeatures",
            data: window.$fxhashFeatures
          }, "*")
        }
      })
</script>
  <head>
    <style>
      body, html{
        margin: 0;
        width: 100%;
        height: 100vh;
        overflow: hidden;
        background: #000;
      }
      #c{
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
    </style>
  </head>
  <body>
    <canvas id=c></canvas>
<script>
c=document.querySelector('#c')
x=c.getContext('2d')
S=Math.sin
C=Math.cos
t=0
rsz=window.onresize=()=>{
  setTimeout(()=>{
    if(document.body.clientWidth > document.body.clientHeight){
      c.style.height = '100vh'
      setTimeout(()=>c.style.width = c.clientHeight+'px',0)
    }else{
      c.style.width = '100vw'
      setTimeout(()=>c.style.height = c.clientWidth + 'px',0)
    }
    c.style
    c.width=1000
    c.height=1000
    t=0
  },0)
}
rsz()
Draw=()=>{
  if(!t){
    bg=new Image()
    go = false
    bg.addEventListener('load',()=>{
      go=true
    })
    grav=0
    bg.src = '2gyRdR.jpg'
    cx=c.width/2,cy=c.height/2
    P=[],B=Array(6).fill().map((v,i)=>[cx,cy,S(i)*20,C(i)*20])
    I=(A,B,M,D,E,F,G,H)=>(K=((G-E)*(B-F)-(H-F)*(A-E))/(J=(H-F)*(M-A)-(G-E)*(D-B)))>=0&&K<=1&&(L=((M-A)*(B-F)-(D-B)*(A-E))/J)>=0&&L<=1?[A+K*(M-A),B+K*(D-B)]:0
    sd=5
  }
  if(go){
    x.globalAlpha=.3
    x.drawImage(bg,0,0,c.width,c.height)
    x.globalAlpha=1
    x.fillStyle='#0001'
  } else {
    x.fillStyle='#0004'
  }
  x.fillRect(0,0,w=c.width,h=c.height)
  B.map((v,i)=>{
    v[2]*=(X=v[0]+=v[2])<0||X>w?-1:1
    v[3]*=(Y=v[1]+=v[3])<0||Y>h?-1:1
    for(m=25;m--;)P.push([X,Y,S(p=(i+P.length)**(3+t%3))*4,C(p)*4,0,i*9])
  })
  x.lineJoin=x.lineCap='round'
  cx=c.width/2,cy=c.height/2
  s=cy/2*(1.4+S(t)/2)
  for(i=sd;i--;){
    x.beginPath()
    x.lineTo(x3=cx+S(p=Math.PI*2/sd*i+S(t/3)*4)*s,y3=cy+C(p)*s)
    x.lineTo(x4=cx+S(p=Math.PI*2/sd*(i+1)+S(t/3)*4)*s,y4=cy+C(p)*s)
    x.lineWidth=50
    x.strokeStyle=`hsla(${t*400},99%,50%,.05)`
    x.stroke()
    x.lineWidth/=2
    x.strokeStyle=`hsla(${t*400},99%,80%,.15)`
    x.stroke()
    x.lineWidth/=4
    x.strokeStyle=`hsla(${t*400},99%,90%,.8)`
    x.stroke()
    P.map(q=>{
      x1=q[0],y1=q[1],x2=x1+q[2]*4,y2=y1+q[3]*4
      if(d=I(x1,y1,x2,y2,x3,y3,x4,y4)){
        u=((x1-x3)*(x4-x3)+(y1-y3)*(y4-y3))/(Math.hypot(x3-x4,y3-y4)**2)
        if(u>=-.5&&u<=1.5){
          tx=x3+u*(x4-x3),ty=y3+u*(y4-y3)
          q[2]+=S(p=Math.atan2(x1-tx,y1-ty))*20
          q[3]+=C(p)*20
          d=Math.hypot(q[2],q[3])
          q[2]/=d
          q[3]/=d
          q[2]*=12
          q[3]*=12
        }
      }
    })
    B.map(q=>{
      x1=q[0],y1=q[1],x2=x1+q[2]*4,y2=y1+(q[3]+=grav)*4
      if(d=I(x1,y1,x2,y2,x3,y3,x4,y4)){
        u=((x1-x3)*(x4-x3)+(y1-y3)*(y4-y3))/(Math.hypot(x3-x4,y3-y4)**2)
        if(u>-.5&&u<1.5){
          tx=x3+u*(x4-x3),ty=y3+u*(y4-y3)
          q[2]+=S(p=Math.atan2(x1-tx,y1-ty))*20
          q[3]+=C(p)*20
          d=Math.hypot(q[2],q[3])
          q[2]/=d
          q[3]/=d
          q[2]*=12
          q[3]*=12
        }
      }
    })
  }
  P.map(v=>{
    x.fillStyle=`hsla(${(v[4]+20)/3**3+i-t*1000+v[5]*9},99%,${100-v[4]**1.5/8}%,.1`
    v[4]+=2
    s=(99-v[4])/9
    x.fillRect((v[0]+=v[2])-s/2,(v[1]+=v[3])-s/2,s,s)
  })
  P=P.filter(v=>v[4]<99)
  t+=1/60
  requestAnimationFrame(Draw)
}
Draw()
</script>
  </body>
</html>
