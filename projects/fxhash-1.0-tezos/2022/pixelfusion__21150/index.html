<!doctype html><html lang="en"><head><title>pixelfusion</title><meta charset="UTF-8"><style>@font-face {
        font-family: 'PETSCII';
        src: url('./petscii.woff') format('woff');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        -webkit-overflow-scrolling: touch;
        background: black;
        color: white;
        font-family: monospace;
      }
      
      .loader {
        display: block;
        position: absolute;
        color: white;
        font-family: 'Courier New', Courier, monospace;
        font-size: 12pt;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 999;
      }

      .loader:after {
        content: attr(data-progress);
        margin-left: 1em;
      }

      .loaded .loader {
        display: none;
      }

      .loaded canvas {
        opacity: 1;
      }

      text {
        font-family: 'PETSCII', monospace;
        font-weight: 400;
      }

      svg { 
        text-anchor: middle;
      }

      * {
        -webkit-box-sizing: border-box;
        box-sizing: border-box;
        -moz-osx-font-smoothing: grayscale;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }</style><script id="fxhash-snippet">
      let alphabet = "123456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ"
      var fxhash = new URLSearchParams(window.location.search).get('fxhash')
      let b58dec = str=>[...str].reduce((p,c)=>p*alphabet.length+alphabet.indexOf(c)|0, 0)
      let fxhashTrunc = fxhash.slice(2)
      let regex = new RegExp(".{" + ((fxhashTrunc.length/4)|0) + "}", 'g')
      let hashes = fxhashTrunc.match(regex).map(h => b58dec(h))
      let sfc32 = (a, b, c, d) => {
        return () => {
          a |= 0; b |= 0; c |= 0; d |= 0
          var t = (a + b | 0) + d | 0
          d = d + 1 | 0
          a = b ^ b >>> 9
          b = c + (c << 3) | 0
          c = c << 21 | c >>> 11
          c = c + t | 0
          return (t >>> 0) / 4294967296
        }
      }
      var fxrand = sfc32(...hashes)
      // used to get features during token mint
      window.addEventListener("message", (event) => {
        if (event.data === "fxhash_getFeatures") {
          parent.postMessage({
            id: "fxhash_getFeatures",
            data: window.$fxhashFeatures
          }, "*")
        }
      })
      var isFxpreview = new URLSearchParams(window.location.search).get('preview') === "1"
      function fxpreview() {
        window.dispatchEvent(new Event("fxhash-preview"))
        setTimeout(() => fxpreview(), 500)
      }
</script></head><body><div class="loader">loading model...</div><div class="svgCanvas" id="svgCanvas"><svg id="svg" class="svg-canvas" width="800px" height="800px" preserveAspectRatio="xMidYMid meet" x="0" y="0" viewBox="0 0 800 800"></svg></div><script defer="defer" src="./bundle.js"></script></body></html>
