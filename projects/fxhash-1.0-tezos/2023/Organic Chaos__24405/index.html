<!DOCTYPE html>
<html lang="en-US">
  <head>
    <title>Organic Chaos</title>
    <script id="fxhash-snippet">
      let alphabet = "123456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ"
      var fxhash = new URLSearchParams(window.location.search).get('fxhash')
      let b58dec = str=>[...str].reduce((p,c)=>p*alphabet.length+alphabet.indexOf(c)|0, 0)
      let fxhashTrunc = fxhash.slice(2)
      let regex = new RegExp(".{" + ((fxhashTrunc.length/4)|0) + "}", 'g')
      let hashes = fxhashTrunc.match(regex).map(h => b58dec(h))
      let sfc32 = (a, b, c, d) => {
        return () => {
          a |= 0; b |= 0; c |= 0; d |= 0
          var t = (a + b | 0) + d | 0
          d = d + 1 | 0
          a = b ^ b >>> 9
          b = c + (c << 3) | 0
          c = c << 21 | c >>> 11
          c = c + t | 0
          return (t >>> 0) / 4294967296
        }
      }
      var fxrand = sfc32(...hashes)
      // used to get features during token mint
      window.addEventListener("message", (event) => {
        if (event.data === "fxhash_getFeatures") {
          parent.postMessage({
            id: "fxhash_getFeatures",
            data: window.$fxhashFeatures
          }, "*")
        }
      })
      var isFxpreview = new URLSearchParams(window.location.search).get('preview') === "1"
      function fxpreview() {
        window.dispatchEvent(new Event("fxhash-preview"))
        setTimeout(() => fxpreview(), 500)
      }
</script>

    <style>
body, html {
  margin: 0;
}

canvas {
  display: block;
}      
    </style>

    
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <script>
/*
  Johan Karlsson, 2023
  https://twitter.com/DonKarlssonSan
*/

class Mover {
  constructor() {
    const m = Math.min(w, h);
    const margin = m * 0.1;
    this.x = random(-margin, w+margin);
    this.y = random(-margin, h+margin);
    this.offset = fxrand();
    this.size = random(m * 0.03, m * 0.16) * sizeFactor;
    this.sizeRatio = random(0.02, 0.4);
    this.r = random(m * 0.1,  m * 0.4) * rFactor;
    const dir1 = fxrand() > 0.5 ? -1 : 1;
    this.ownAxisRotSpeed = dir1 * random(0.005, 0.04);
    const dir2 = fxrand() > 0.5 ? -1 : 1;
    this.rotSpeed = dir2 * random(0.001, 0.008);
    this.ownAxisAngle = 0;
    this.angle = random(Math.PI * 2);
    this.color = getRandomColor();
    this.sine = random(1) > 0.75;
    this.f = randomInt(2, 8);
  }

  move() {
    this.ownAxisAngle += this.ownAxisRotSpeed;
    this.angle += this.rotSpeed;
  }
  
  draw(context) {
    let r;
    if(this.sine) {
      r = (Math.sin(this.angle*this.f) * 0.2 + 1) * this.r;
    } else {
      r = this.r;
    }
    const x = this.x + Math.cos(this.angle) * r;
    const y = this.y + Math.sin(this.angle) * r;
    context.save();
    context.fillStyle = this.color;
    context.translate(x, y);
    context.rotate(this.ownAxisAngle);
    context.fillRect(-this.size / 30, -this.size*this.offset, this.size/15, this.size);
    context.restore();
  }
}

let canvas;
let ctx;
let w, h;
let redrawTimeoutId;
let movers;
let baseHue;
let sizeFactor;
let rFactor;
let colorOffsets;
let darkness;
let feebleness;

function getRandomColor() {
  const s = randomInt(20, 70) * feebleness;
  const l = randomInt(10, 90) * darkness;
  const r = randomInt(1, colorOffsets + 1);
  const comp = 360 / (colorOffsets + 1) * r;
  const extra = randomInt(10);
  const rare = fxrand() > 0.9 ? 0 : 18;
  return `hsla(${baseHue + comp + extra + rare}, ${s}%, ${l}%, 0.03)`;
}

function random(min, max) {
  if(max === undefined) {
    max = min;
    min = 0;
  }
  return fxrand() * (max - min) + min;
}

function randomInt(min, max) {
  return Math.round(random(min, max));
}

function setup() {
  canvas = document.querySelector("#canvas");
  ctx = canvas.getContext("2d");
  resize();
  window.addEventListener("resize", redraw);
}

function redraw() {
  clearTimeout(redrawTimeoutId);
  redrawTimeoutId = setTimeout(redrawForReal, 200);
}

function redrawForReal() {
  resize();
  draw(ctx);
}

function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
  console.log("resize()", w, h);
}

function resetMovers() {
  movers = [];
  const nrOfMovers = w * h * 0.0001 + 100 / (sizeFactor * rFactor);
  console.log({nrOfMovers});
  for(let i = 0; i < nrOfMovers; i++) {
    const mover = new Mover();
    movers.push(mover);
  }
}

function reset() {
  colorOffsets = randomInt(1, 4);
  sizeFactor = random(0.25, 1.6);
  rFactor = random(0.3, 1.5);
  baseHue = Math.floor(fxrand() * 360);
  darkness = random(0.6, 1);
  feebleness = random(0.5, 1);
  console.log({colorOffsets});
  console.log({sizeFactor});
  console.log({rFactor});
  console.log({baseHue});
  console.log({darkness});
}

function draw() {
  console.log("draw()");
  reset();

  ctx.fillStyle = "white";
  ctx.fillRect(0, 0, w, h);

  resetMovers();
  let nrOfIterations = 2000 + 2000 / (sizeFactor * rFactor);
  console.log({nrOfIterations});
  const extra = isFxpreview ? 1000 : 0;
  nrOfIterations += extra;
  console.log({nrOfIterations});
  for(let i = 0; i < nrOfIterations; i++) {
    movers.forEach(m => {
      m.move();
      m.draw(ctx);
    });
  }
}

setup();
draw();

    </script>
  </body>
</html>
