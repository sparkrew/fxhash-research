<html>
      <head>
            <script id="fxhash-snippet">
      let alphabet = "123456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ"
      var fxhash = new URLSearchParams(window.location.search).get('fxhash')
      let b58dec = str=>[...str].reduce((p,c)=>p*alphabet.length+alphabet.indexOf(c)|0, 0)
      let fxhashTrunc = fxhash.slice(2)
      let regex = new RegExp(".{" + ((fxhashTrunc.length/4)|0) + "}", 'g')
      let hashes = fxhashTrunc.match(regex).map(h => b58dec(h))
      let sfc32 = (a, b, c, d) => {
        return () => {
          a |= 0; b |= 0; c |= 0; d |= 0
          var t = (a + b | 0) + d | 0
          d = d + 1 | 0
          a = b ^ b >>> 9
          b = c + (c << 3) | 0
          c = c << 21 | c >>> 11
          c = c + t | 0
          return (t >>> 0) / 4294967296
        }
      }
      var fxrand = sfc32(...hashes)
      // used to get features during token mint
      window.addEventListener("message", (event) => {
        if (event.data === "fxhash_getFeatures") {
          parent.postMessage({
            id: "fxhash_getFeatures",
            data: window.$fxhashFeatures
          }, "*")
        }
      })
      var isFxpreview = new URLSearchParams(window.location.search).get('preview') === "1"
      function fxpreview() {
        window.dispatchEvent(new Event("fxhash-preview"))
        setTimeout(() => fxpreview(), 500)
      }
</script>      
      </head>          
<script src="./p5.min.js"></script>
<script>
let canv
let shapes, landCounter=0, lands=[], tickness, back, landCount
let lw=50, lh=20, lx=50, ly=50
let xpos='l' // r:right, l:left, m:middle
let ypos='m' //b:bottom, m:middle, u:up
let sidepos='b' //b:bottom, r:right, l:left, u:up
let fcolor=0, _lh, _lw, ww, wh

      function getLandCount(value) {
            if (value < .16) return 40
            else if (value < .33) return 45
            else if (value < .5) return 50
            else if (value < .66) return 55
            else if (value < .83) return 60
            else return 65
            }
      function getLw(value) {
            if (value < .16) return 60
            else if (value < .33) return 65
            else if (value < .5) return 70
            else if (value < .66) return 75
            else if (value < .83) return 80
            else return 85
            }
      function getLh(value) {
            if (value < .16) return 60
            else if (value < .33) return 70
            else if (value < .5) return 80
            else if (value < .66) return 90
            else if (value < .83) return 100
            else return 110
            }
      function getTickness(value) {
            if (value < .25) return 50
            else if (value < .5) return 70
            else if (value < .75) return 90
            else return 110
            }
      function getBack(value) {
            if (value < .25) return 0
            else if (value < .5) return 1
            else if (value < .75) return 2
            else return 3
            }
      function getInitSide(value) {
            if (value < .5) return 'b'
            else return 'r'
            }
      function getInitPos(value) {
            if (value < .33) return 0
            else if (value < .66) return 1
            else return 2
            }

      window.$fxhashFeatures = {
            "landCount": getLandCount(fxrand()),
            "tickness": getTickness(fxrand()),
            "back": getBack(fxrand()),
            "initSide": getInitSide(fxrand()),
            "initPos": getInitPos(fxrand()),
            "lw": getLw(fxrand()),
            "lh": getLh(fxrand()),
      }

function setup() {
      noLoop()
      ww=min(800,windowWidth)
      wh=min(800,windowHeight)
      canv = createCanvas(ww, wh)
      colorMode(HSB)
      frameRate(3)
      //blendMode(DARKEST)
      landCount=window.$fxhashFeatures.landCount
      tickness=window.$fxhashFeatures.tickness
      back=window.$fxhashFeatures.back
      _lw=window.$fxhashFeatures.lw
      _lh=window.$fxhashFeatures.lh
      let sidepos=window.$fxhashFeatures.initSide
      let initPos=window.$fxhashFeatures.initPos
      if (sidepos == 'b'){
            if (initPos == 0) xpos='r'
            else if (initPos == 1) xpos='m'
            else if (initPos == 2) xpos='l'
      }
      else if (sidepos == 'r'){
            if (initPos == 0) ypos='u'
            else if (initPos == 1) ypos='m'
            else if (initPos == 2) ypos='d'
            
      }
      for (landCounter=0;landCounter<landCount;landCounter++)
            lands[landCounter] = new lines(landCounter)
      lw=min(ww/5, _lw)
      lh=min(wh/8, _lh)
}

function draw(){
      background(255)

      //translate(-windowWidth/2,-windowHeight/3)
      strokeWeight(1)
      for (let l in lands){
            lands[l].drawLand()
      }
      refill()
      }
function refill(){
      let c, c2, c3
      for(let i=50; i<=ww; i+=50){
            for(let j=50; j<=wh; j+=50){
                  c=0
                  c2=0
                  c3=0
                  for (let i2=-50; i2<=50; i2+=50)
                        for (let j2=-50; j2<=50; j2+=50){
                              c += get(i+i2, j+j2)[0]
                        }
                  for (let i2=-50; i2<=50; i2+=50)
                        for (let j2=-50; j2<=100; j2+=50){
                              c2 += get(i+i2, j+j2)[0]
                        }
                  for (let i2=-50; i2<=100; i2+=50)
                        for (let j2=-50; j2<=100; j2+=50){
                              c3 += get(i+i2, j+j2)[0]
                        }
                  fill(0)
                  if (c2 == 12*255){
                        rect(i-10, j-10, 20, 180)
                        rect(i-50, j+100, 170, 80)
                  }
                  if (c3 == 12*255){
                        rect(i-10, j-10, 150, 20)
                  }
                  if (c == 9* 255){
                        if ((i+j) % 3 == 0){
                              circle(i, j, 100)
                        }
                        else{
                              rect(i-40, j-40, 100, 100, 20)
                              if ((i+j) % 3 == 0){
                                    push()
                                    fill(255)
                                    rect(i-30, j-30, 60, 60)
                                    pop()
                              }
                              else if ((i+j) % 5 == 0){
                                    push()
                                    fill(255)
                                    circle(i+10, j+10, 80)
                                    pop()
                              }
                        }
                  }
            }
      }
}
class lines{
      constructor(no){
            this.no=no
      }
      drawLand(){
            noStroke()
            if (this.no % 7 == 0){
                  fill(255)
                  rect(lx, ly, lw+10, lh)
            }
            else{
                  fill(fcolor, 0 ,0)
                  rect(lx, ly, lw, lh)
            }
            push()
            if (this.no % 7 == 0){
                  fill(fcolor)
                  if ((lw/lh)>.7 && (lw/lh)<1.4)
                        ellipse(lx+lw/2, ly+lh/2, 2*lw/3, 2*lh/3)
                  else
                        rect(lx+lw/6, ly+lh/6, 2*lw/3, 2*lh/3)
            }
            else if (this.no % 3 == 0 && (lw/lh)>.9 && (lw/lh)<1.2){
                  fill(255)
                  rect(lx+lw/6, ly+lh/6, 2*lw/3, 2*lh/3)
            }
            else if (this.no % 5 == 0 && sidepos!='u' && sidepos!='r' && (lw/lh)>.9 && (lw/lh)<1.2){
                  fill(255)
                  ellipse(lx+lw/2, ly+lh/2, 2*lw/3, 2*lh/3)
            }
            pop()
            // go up
            if ((ly+lh+wh/6)>=wh){
                  lx = 3*ww/5
                  ly = 50
                  lw = map(this.no,0,80,ww/8,ww/5)
                  lh = map(this.no, 0, 100, wh/15, wh/10)
                  sidepos = 'r'
                  ypos = 'm'
                  fcolor=0
            }
            // /////
            if (sidepos == 'b'){
                  if (xpos == 'r'){
                        lx=lx+lw
                        ly=ly+lh
                        lw = map(this.no, 0,65, 100, 200) 
                        lh = map(this.no, 0,65, 90, 180)
                        lx=lx-lw
                        ly=ly-lh
                        ypos='d'
                        sidepos='l'
                  }
                  else if (xpos == 'l'){
                        lx=lx
                        ly=ly+lh
                        lw = 60 
                        lh = 120
                        ypos='r'
                        sidepos='u'
                  }
                  else if (xpos == 'm'){
                        lx=lx+lw/2
                        ly=ly+lh
                        lw = map(this.no, 0,65, 100, 190) 
                        lh = map(this.no, 0,65, 50, 60) 
                        ypos='m'
                        sidepos='l'
                  }
            }
            else if (sidepos == 'l'){
                  if (ypos == 'd'){
                        lx=lx-lw
                        ly=ly+lh
                        lw = map(this.no, 0,65, 50, 60) 
                        lh = map(this.no, 0,65, 100, 150)
                        xpos='l'
                        sidepos='b'
                  }
                  else if (ypos == 'u'){
                        lx=lx-lw
                        ly=ly
                        lw = map(this.no, 0,65, 150, 220) 
                        lh = 50 
                        ypos='m'
                        sidepos='u'
                  }
                  else if (ypos == 'm'){
                        lx=lx+lw/2
                        ly=ly+lh/2
                        lw = map(this.no, 0,65, 190, 255) 
                        lh = map(this.no, 0,65, 30, 40) 
                        ypos='m'
                        sidepos='r'
                  }
            }
            else if (sidepos == 'r'){
                  if (ypos == 'd'){
                        lx=lx-lw
                        ly=ly+lh
                        lw = map(this.no, 0,65, 150, 220) 
                        lh = map(this.no, 0,65, 50, 60) 
                        ypos='r'
                        sidepos='u'
                  }
                  else if (ypos == 'u'){
                        lx=lx-lw
                        ly=ly
                        lw = map(this.no, 0,65, 170, 290) 
                        lh = map(this.no, 0,65, 30, 50) 
                        ypos='m'
                        sidepos='b'
                  }
                  else if (ypos == 'm'){
                        lx=lx+lw/2
                        ly=ly+lh/2
                        lw = map(this.no, 0,65, 190, 260) 
                        lh = map(this.no, 0,65, 30, 50) 
                        xpos='m'
                        sidepos='u'
                  }
            }
            else if (sidepos == 'u'){
                  if (xpos == 'r'){
                        lx=lx+lw
                        ly=ly-lh
                        lw = map(this.no, 0,65, 80, 100) 
                        lh = map(this.no, 0,65, 70, 110) 
                        xpos='d'
                        sidepos='r'
                  }
                  else if (xpos == 'l'){
                        lx=lx
                        ly=ly-lh
                        lw = map(this.no, 0,65, 50, 80) 
                        lh = map(this.no, 0,65, 40, 90) 
                        xpos='m'
                        sidepos='b'
                  }
                  else if (xpos == 'm'){
                        lx=lx+lw/2
                        ly=ly-lh
                        lw = map(this.no, 0,65, 40, 50) 
                        lh = map(this.no, 0,65, 100, 150) 
                        xpos='r'
                        sidepos='b'
                  }
            }
      }
}
</script>
</html>
