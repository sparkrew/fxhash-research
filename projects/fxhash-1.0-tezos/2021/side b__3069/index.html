  <script id="fxhash-snippet">
      let alphabet = "123456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ"
      var fxhash = new URLSearchParams(window.location.search).get('fxhash')
      let b58dec = (str) => str.split('').reduce((p,c,i) => p + alphabet.indexOf(c) * (Math.pow(alphabet.length, str.length-i-1)), 0)
      let fxhashTrunc = fxhash.slice(2)
      let regex = new RegExp(".{" + ((fxhashTrunc.length/4)|0) + "}", 'g')
      let hashes = fxhashTrunc.match(regex).map(h => b58dec(h))
      let sfc32 = (a, b, c, d) => {
        return () => {
          a |= 0; b |= 0; c |= 0; d |= 0
          var t = (a + b | 0) + d | 0
          d = d + 1 | 0
          a = b ^ b >>> 9
          b = c + (c << 3) | 0
          c = c << 21 | c >>> 11
          c = c + t | 0
          return (t >>> 0) / 4294967296
        }
      }
      var fxrand = sfc32(...hashes)
      // used to get features during token mint
      window.addEventListener("message", (event) => {
        if (event.data === "fxhash_getFeatures") {
          parent.postMessage({
            id: "fxhash_getFeatures",
            data: window.$fxhashFeatures
          }, "*")
        }
      })
</script>

<script id="fragmentShader" type="x-shader/x-fragment">
  #ifdef GL_ES
  precision mediump float;
  #endif

  #extension GL_OES_standard_derivatives : enable

  uniform float time;
  uniform vec2 mouse;
  uniform vec2 resolution;

  float map(vec2 p, float z) {
    return length(p) - 1.3;
  }

  vec2 rotate(vec2 v, float a) {
    float s = sin(a);
    float c = cos(a);
    mat2 m = mat2(c, -s, s, c);
    return m * v;
  }

  float nsin(float value) {
    return sin(value * 21.2831853072) * 0.5 + 0.5;
  }

  void main( void ) {
    
    float dist;
    vec2 uv, p = (gl_FragCoord.xy * 1.4 - resolution.xy) / min(resolution.x, resolution.y);


    float d = dot(uv,uv);
    float a = atan(uv.y,uv.x);
    
    
    float l=length(p);
    float z = time; 
    float angle = 4.2831853072 * nsin(z*0.002) * 20.0;
    vec3 color = vec3(0.7);

    
    for (int j = 1; j < 3; j++) {
      for ( int i = 1; i < 12; i++){
        
        z+=0.4;

        uv.x = map(p,z);
        uv.y = map(p,z);
        

        uv.x -= (
          sin(float(i)*0.3)*0.3
        );
        uv.y += (
         cos(float(j)*0.7)*0.6
        );

        uv = rotate(uv, angle);


        uv += p / l * abs(sin(l * 9.0 - z*0.05));

        color[j] +=  0.2 /  fract(uv.y*uv.x+cos(z*0.01))*1.0 -  0.01 /  abs(uv.y*uv.x)*4.0;                ;
        color[j] += 0.2;
        color[j] = clamp(color[j], 0.3, 1.4);
        
        
      }              
    }

    color[0] += 0.2;
    color[1] -= 0.3;
    color[2] -= 0.9;
    gl_FragColor = vec4(color, 2.5);

  }
</script>
