<!DOCTYPE html>
<html>
<script id="fxhash-snippet">
      let alphabet = "123456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ"
      var fxhash = new URLSearchParams(window.location.search).get('fxhash')
      let b58dec = (str) => str.split('').reduce((p,c,i) => p + alphabet.indexOf(c) * (Math.pow(alphabet.length, str.length-i-1)), 0)
      let fxhashTrunc = fxhash.slice(2)
      let regex = new RegExp(".{" + ((fxhashTrunc.length/4)|0) + "}", 'g')
      let hashes = fxhashTrunc.match(regex).map(h => b58dec(h))
      let sfc32 = (a, b, c, d) => {
        return () => {
          a |= 0; b |= 0; c |= 0; d |= 0
          var t = (a + b | 0) + d | 0
          d = d + 1 | 0
          a = b ^ b >>> 9
          b = c + (c << 3) | 0
          c = c << 21 | c >>> 11
          c = c + t | 0
          return (t >>> 0) / 4294967296
        }
      }
      var fxrand = sfc32(...hashes)
      // used to get features during token mint
      window.addEventListener("message", (event) => {
        if (event.data === "fxhash_getFeatures") {
          parent.postMessage({
            id: "fxhash_getFeatures",
            data: window.$fxhashFeatures
          }, "*")
        }
      })
</script>
  <head>
    <style>
      body, html{
        margin: 0;
        width: 100%;
        height: 100vh;
        overflow: hidden;
        background: #000;
      }
      #c{
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: url(26RElH.jpg);
      }
    </style>
  </head>
  <body>
    <canvas id=c></canvas>
    <script>
      c=document.querySelector('#c')
      x=c.getContext('2d')
      S=Math.sin
      C=Math.cos
      t=0
      rsz=window.onresize=()=>{
        setTimeout(()=>{
          if(document.body.clientWidth > document.body.clientHeight*1.77777778){
            c.style.height = '100vh'
            setTimeout(()=>c.style.width = c.clientHeight*1.77777778+'px',0)
          }else{
            c.style.width = '100vw'
            setTimeout(()=>c.style.height = c.clientWidth/1.77777778 + 'px',0)
          }
          c.width=1920
          c.height=c.width/1.777777778
          t=0
        },0)
      }
      rsz()
      Draw=()=>{
  if(!t){
    R=(Rl,Pt,Yw,o)=>{
      X=S(p=(A=(M=Math).atan2)(X,Y)+Rl)*(d=(H=M.hypot)(X,Y)),Y=C(p)*d,Y=S(p=A(Y,Z)+Pt)*(d=H(Y,Z)),Z=C(p)*d,X=S(p=A(X,Z)+Yw)*(d=H(X,Z)),Z=C(p)*d
      if(o)X+=oX,Y+=oY,Z+=oZ
    }
    Q=q=>[c.width/2+X/Z*700,c.height/2+Y/Z*700]
    Rn=fxrand
    iSTc=1e3,iSTv=1,stG=60
    starChoice=Rn()*9|0
    ST=Array(iSTc).fill().map((v,i)=>{
      X=(Rn()-.5)*stG
      Y=(Rn()-.5)*stG
      Z=(Rn()-.5)*stG
      return [X,Y,Z, starChoice]
    })
    go=false
    stars=Array(9).fill().map((v,i)=>{
      imgobj = {img: new Image(), loaded: false}
      imgobj.onload=()=>{go=!stars.filter(v=>!v.loaded).length}
      imgobj.img.src = 'star' + (i+1) + '.png'
      return imgobj
    })
    x.lineJoin=x.lineCap='butt'
    cl=14,rw=cl/1.25|0,Gp=0
    iSr=.5,iBc=3,G=0,iBv=0,iPc=1
    P=Array(iPc).fill().map(v=>{
      X=(Rn()-.5)*Gp
      Y=(Rn()-.5)*Gp
      Z=(Rn()-.5)*Gp
      return [X,Y,Z]
    })
    B=Array(iBc).fill().map((v,i)=>{
      switch(i){
        case 0:
          rl=0
          pt=0
          yw=0
        break
        case 1:
          rl=0
          pt=Math.PI/2
          yw=0
        break
        case 2:
          rl=Math.PI/2
          pt=Math.PI/2
          yw=0
        break
      }
      X=(Rn()-.5)*G
      Y=(Rn()-.5)*G
      Z=(Rn()-.5)*G
      p=Math.PI*2*Rn()
      q=Math.PI*Rn()
      vx=S(p)*S(q)*iBv
      vy=C(q)*iBv
      vz=C(p)*S(q)*iBv
      return [X,Y,Z,vx,vy,vz,rl,pt,yw]
    })
    bg = new Image
    usebg = false
    bg.onload=()=>{usebg=true}
    bg.src='1I9CZB.jpg'
  }
  iSTv=.5+S(t)*.25
  if(usebg){
    x.globalAlpha=.4
    x.drawImage(bg,0,0,c.width,c.height)
    x.globalAlpha=1
    x.fillStyle='#0004',x.fillRect(0,0,c.width,c.height)
  }else{
    x.fillStyle='#0008',x.fillRect(0,0,c.width,c.height)
  }
  Rl=C(t/6)*4,Pt=-t/2,Yw=S(t/3)*6
  oX=oY=0,oZ=3+S(t)*3
 
 ST.map(v=>{
    X=v[0]
    Y=v[1]
    Z=v[2]
    if(X < -stG/2)v[0]+=stG
    if(X > stG/2) v[0]-=stG
    if(Y < -stG/2)v[1]+=stG
    if(Y > stG/2) v[1]-=stG
    if(Z < -stG/2)v[2]+=stG
    if(Z > stG/2) v[2]-=stG
    R(Rl,Pt,Yw,1)
    if(Z>0){
      let img = stars[v[3]].img
      s = Math.min(1e3, H(img.width, img.height) * 28 / (Z**1.4))
      l = Q()
      x.globalAlpha=1 * Math.min(1,(Z/7)**2)/(1+H(...v)**4/250000)
      x.drawImage(img,l[0]-s/2,l [1], s,s)
    }
    X=0,Y=0,Z=iSTv
    R(Rl,Pt,Yw)
    v[0]+=X,v[1]+=Y,v[2]+=Z
  })
  x.globalAlpha = 1
  x.lineCap=x.lineJoin='butt'
  P.map(m=>{
    px=m[0]
    py=m[1]
    pz=m[2]
    Sphere=Array(rw*(cl+2)).fill().map((v,i)=>{
      p=(i%cl)/cl*Math.PI*2
      q=(i/cl|0)/rw*Math.PI
      iSr=.5+(3+(3+S(Math.abs(q-Math.PI/2)*(4+S(t*2)*3.5)+t)*3)/2)**3/120
      X=S(p)*S(q)*iSr
      Y=C(q)*iSr
      Z=C(p)*S(q)*iSr
      return [X,Y,Z]
    })
  B.map(v=>{
    tx=v[0]+=v[3]
    ty=v[1]+=v[4]
    tz=v[2]+=v[5]
    if(tx>G/2 || tx < -G/2) v[3]*=-1
    if(ty>G/2 || ty < -G/2) v[4]*=-1
    if(tz>G/2 || tz < -G/2) v[5]*=-1
    rl=v[6]//+=.001
    pt=v[7]//+=.002
    yw=v[8]//+=.003
    Sphere.map((q,j)=>{
      if(j<Sphere.length-cl*2+6){
        k=(j+1)%cl ? j+1 : j-cl+1
        l=j+cl
        x.beginPath()
        X=Sphere[l][0]
        Y=Sphere[l][1]
        Z=Sphere[l][2]
        R(rl,pt,yw)
        X+=tx,Y+=ty,Z+=tz
        X+=px,Y+=py,Z+=pz
        R(Rl,Pt,Yw,1)
        if(Z>0)x.lineTo(...Q())
        X=Sphere[j][0]
        Y=Sphere[j][1]
        Z=Sphere[j][2]
        R(rl,pt,yw)
        X+=tx,Y+=ty,Z+=tz
        X+=px,Y+=py,Z+=pz
        R(Rl,Pt,Yw,1)
        if(Z>0)x.lineTo(...Q())
        X=Sphere[k][0]
        Y=Sphere[k][1]
        Z=Sphere[k][2]
        R(rl,pt,yw)
        X+=tx,Y+=ty,Z+=tz
        X+=px,Y+=py,Z+=pz
        R(Rl,Pt,Yw,1)
        if(Z>0)x.lineTo(...Q())
        x.lineWidth=Math.min(100,200/(Z**1.5))
        x.strokeStyle=`hsla(${360/8*starChoice-40},99%,${starChoice?50:100}%,.08`
        x.stroke()
        x.lineWidth/=12
        x.strokeStyle='#fffb'
        x.stroke()
      }
    })
  })
  })
  t+=1/60
  requestAnimationFrame(Draw)
}
    Draw()
    </script>
  </body>
</html>
