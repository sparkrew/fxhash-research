<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>p5.asciify-vite-template-js</title>

  <style>

    body {
      margin: 0;
      padding: 0;
      background-color: #000;
    }

    canvas {
      display: block;
    }
    
    #loading-overlay {
      position: fixed;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      background-color: #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      transition: opacity 0.5s ease-in-out;
      font-family: 'monospaced', monospace;
      padding: 20px;
      box-sizing: border-box;
    }
    
    #loading-text {
      color: #fff;
      font-size: clamp(16px, 5vw, 24px);
      margin-bottom: 15px;
      letter-spacing: 1px;
      text-align: center;
    }
    
    #ascii-spinner {
      color: #fff;
      font-size: clamp(24px, 8vw, 40px);
      font-family: 'monospaced', monospace;
      animation: blink 1s infinite;
      margin: 15px 0;
    }
  
    
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    
    .hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>

  <script src="./fxhash.min.js"></script>
  <script src="./p5.min.js"></script>
  <script src="./p5.asciify.umd.js"></script>
  <script src="./rampensau.umd.js"></script>
  
  <script>
    // ASCII animation control
    document.addEventListener('DOMContentLoaded', function() {
      const spinnerChars = ['-', '\\', '|', '/'];
      const spinnerEl = document.getElementById('ascii-spinner');
      let index = 0;
      
      setInterval(() => {
        spinnerEl.textContent = spinnerChars[index];
        index = (index + 1) % spinnerChars.length;
      }, 250);
    });
  </script>
  <script type="module" crossorigin src="./assets/index-CdncdVIl.js"></script>
</head>

<body>
  <div id="loading-overlay">
    
    <div id="loading-text">INITIALIZING SYSTEM</div>
    <div id="ascii-spinner">-</div>
    
    
  </div>

</body>

</html>
