<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <meta charset="utf-8" />
    <script src="./p5.js"></script>
    <script src="./fxhash.min.js"></script>
    <style>
        :root {
    --bg-color: #101010;
    --panel-bg-color: rgba(26,26,26,0.82);
    --primary-text-color: #f3f3f3;
    --secondary-text-color: #9a9a9a;
    --border-color: rgba(255,255,255,0.08);

    --accent-color: #4f8cff;
    --accent-color-hover: #74a7ff;

    --glass-highlight: rgba(255,255,255,0.04);
}

/* BODY */

body {
    margin: 0;
    padding: 0;
    background:
        radial-gradient(circle at top left,#1b1b1b 0%,#101010 40%),
        #101010;

    color: var(--primary-text-color);

    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        'Segoe UI',
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;

    min-height: 100vh;
    overflow: hidden;
}

/* MAIN LAYOUT */

main#app-container {
    display: flex;
    flex-direction: row;
    width: 100%;
    height: 100%;
    justify-content: center;
    align-items: center;
    gap: 24px;
    padding: 20px;
    box-sizing: border-box;
}

#canvas-container {
    flex-shrink: 0;
}

/* CANVAS */

canvas {
    border: 1px solid rgba(255,255,255,0.06);

    border-radius: 18px;

    box-shadow:
        0 20px 60px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.03);

    display: block;
}

/* CONTROLS PANEL */

#controls {
    background:
        linear-gradient(
            180deg,
            rgba(40,40,40,0.6),
            rgba(20,20,20,0.85)
        );

    backdrop-filter: blur(18px);

    border:
        1px solid rgba(255,255,255,0.08);

    border-radius: 24px;

    padding: 18px;

    width: 340px;
    height: 602px;

    box-sizing: border-box;

    overflow-y: auto;

    display: flex;
    flex-direction: column;

    gap: 14px;

    box-shadow:
        0 20px 60px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.04);
}

/* SCROLLBAR */

#controls::-webkit-scrollbar {
    width: 8px;
}

#controls::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.12);
    border-radius: 10px;
}

#controls::-webkit-scrollbar-track {
    background: transparent;
}

/* HEADER */

#controls h2 {
    margin: 0;
    font-size: 1.2em;
    font-weight: 700;
    letter-spacing: 0.5px;

    color: white;

    padding-bottom: 12px;

    border-bottom:
        1px solid rgba(255,255,255,0.08);
}

/* ACCORDIONS */

details {
    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,0.025),
            rgba(255,255,255,0.01)
        );

    border:
        1px solid rgba(255,255,255,0.06);

    border-radius: 18px;

    padding: 10px 14px;

    transition:
        border-color 0.25s ease,
        background 0.25s ease,
        transform 0.2s ease;
}

details:hover {
    border-color:
        rgba(255,255,255,0.14);
}

summary {
    cursor: pointer;

    font-weight: 650;

    padding: 8px 0;

    outline: none;

    list-style: none;

    font-size: 0.98rem;

    display: flex;
    align-items: center;

    color: white;

    user-select: none;
}

summary::-webkit-details-marker {
    display: none;
}

summary::before {
    content: '›';

    font-size: 1.2rem;

    margin-right: 10px;

    transition:
        transform 0.25s ease;

    color: var(--accent-color);
}

details[open] > summary::before {
    transform: rotate(90deg);
}

/* CONTROL GROUPS */

.control-group {
    margin-top: 10px;

    padding: 14px;

    border-radius: 16px;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,0.025),
            rgba(255,255,255,0.01)
        );

    border:
        1px solid rgba(255,255,255,0.05);

    display: flex;
    flex-direction: column;

    gap: 12px;
}

/* LABELS */

.label-value-pair {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
}

.control-group label {
    font-size: 0.92rem;
    color: #d5d5d5;
    font-weight: 500;
}

/* VALUE BADGES */

.value-display {
    min-width: 46px;

    text-align: center;

    font-size: 0.82rem;

    font-weight: 600;

    color: white;

    background:
        linear-gradient(
            180deg,
            rgba(79,140,255,0.28),
            rgba(79,140,255,0.15)
        );

    border:
        1px solid rgba(79,140,255,0.3);

    padding: 4px 8px;

    border-radius: 999px;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.06);
}

/* TEXTAREA */

textarea {
    width: 100%;
    box-sizing: border-box;

    min-height: 110px;

    background:
        rgba(255,255,255,0.04);

    color: white;

    border:
        1px solid rgba(255,255,255,0.08);

    border-radius: 14px;

    padding: 14px;

    resize: vertical;

    font-size: 0.92rem;

    outline: none;

    transition:
        border-color 0.25s ease,
        background 0.25s ease;
}

textarea:focus {
    border-color:
        rgba(79,140,255,0.6);

    background:
        rgba(255,255,255,0.06);
}

/* BUTTON */

button {
    background:
        linear-gradient(
            180deg,
            var(--accent-color),
            #296dff
        );

    color: white;

    border: none;

    border-radius: 14px;

    padding: 12px 16px;

    cursor: pointer;

    font-weight: 600;

    font-size: 0.92rem;

    transition:
        transform 0.18s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;

    box-shadow:
        0 8px 24px rgba(41,121,255,0.22);
}

button:hover {
    background:
        linear-gradient(
            180deg,
            var(--accent-color-hover),
            #3f82ff
        );

    transform: translateY(-1px);
}

/* COLOR GROUP */

.color-group {
    display: flex;
    align-items: center;
    gap: 14px;
}

input[type="color"] {
    -webkit-appearance: none;
    appearance: none;

    width: 52px;
    height: 38px;

    border:
        1px solid rgba(255,255,255,0.08);

    border-radius: 12px;

    padding: 0;

    background: transparent;

    cursor: pointer;

    overflow: hidden;
}

input[type="color"]::-webkit-color-swatch {
    border: none;
}

/* BEAUTIFUL SLIDERS */

input[type="range"] {
    -webkit-appearance: none;
    appearance: none;

    width: 100%;

    height: 10px;

    border-radius: 999px;

    background:
        linear-gradient(
            90deg,
            rgba(79,140,255,0.55),
            rgba(79,140,255,0.15)
        );

    outline: none;

    border:
        1px solid rgba(255,255,255,0.05);

    overflow: hidden;
}

/* THUMB */

input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;

    width: 22px;
    height: 22px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 30% 30%,
            #ffffff,
            #d8e6ff 55%,
            #5f96ff 100%
        );

    border:
        2px solid rgba(255,255,255,0.9);

    cursor: pointer;

    box-shadow:
        0 0 0 6px rgba(79,140,255,0.12),
        0 4px 14px rgba(0,0,0,0.35);

    transition:
        transform 0.15s ease,
        box-shadow 0.2s ease;
}

input[type="range"]::-webkit-slider-thumb:hover {
    transform: scale(1.12);

    box-shadow:
        0 0 0 8px rgba(79,140,255,0.18),
        0 6px 20px rgba(0,0,0,0.45);
}

input[type="range"]::-moz-range-thumb {
    width: 22px;
    height: 22px;

    border-radius: 50%;

    background: #7ea8ff;

    border: none;
}

/* MOBILE UI */

@media (max-width: 1024px) {

    body {
        height: auto;
        overflow-y: auto;
    }

    main#app-container {
        flex-direction: column;

        height: auto;

        padding: 10px;

        gap: 18px;
    }

    canvas {
        width: 100% !important;
        height: auto !important;
        max-width: 100vw;
    }

    #controls {
        width: 100%;
        max-width: 100%;

        height: auto;
        max-height: unset;

        border-radius: 24px;

        padding: 16px;
    }

    .control-group {
        padding: 12px;
    }

    input[type="range"] {
        height: 12px;
    }

    input[type="range"]::-webkit-slider-thumb {
        width: 28px;
        height: 28px;
    }

    button {
        padding: 14px 18px;
    }

    textarea {
        min-height: 140px;
    }
}
    </style>
</head>
<body>
    <main id="app-container">
        <div id="canvas-container"></div>
        <div id="controls-container"></div>
    </main>

<script src="./index.js"></script>
</body>
</html>
