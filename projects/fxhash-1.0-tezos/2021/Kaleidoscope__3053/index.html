<!DOCTYPE html>
<html lang="en">

<head>
    <title>Kaleidoscope</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1">
    <meta itemprop="name" content="Kaleidoscope">
    <script id="fxhash-snippet">
      let alphabet = "123456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ"
      var fxhash = new URLSearchParams(window.location.search).get('fxhash')
      let b58dec = (str) => str.split('').reduce((p,c,i) => p + alphabet.indexOf(c) * (Math.pow(alphabet.length, str.length-i-1)), 0)
      let fxhashTrunc = fxhash.slice(2)
      let regex = new RegExp(".{" + ((fxhashTrunc.length/4)|0) + "}", 'g')
      let hashes = fxhashTrunc.match(regex).map(h => b58dec(h))
      let sfc32 = (a, b, c, d) => {
        return () => {
          a |= 0; b |= 0; c |= 0; d |= 0
          var t = (a + b | 0) + d | 0
          d = d + 1 | 0
          a = b ^ b >>> 9
          b = c + (c << 3) | 0
          c = c << 21 | c >>> 11
          c = c + t | 0
          return (t >>> 0) / 4294967296
        }
      }
      var fxrand = sfc32(...hashes)
      // used to get features during token mint
      window.addEventListener("message", (event) => {
        if (event.data === "fxhash_getFeatures") {
          parent.postMessage({
            id: "fxhash_getFeatures",
            data: window.$fxhashFeatures
          }, "*")
        }
      })
</script>
    <style>
        body {
            margin: 0;
            background-color: #000;
            color: #fff;
            font-family: Helvetica, Arial, sans-serif;
            overflow: hidden; /* disable scrolling / rubberband effect on mobile */
        }

        canvas {
            display: block;
            position: absolute;
            outline:0;
        }

        * {
            /* disable on touch highlights of html elements, especially on mobile! */
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        footer {
            position: absolute;
            bottom: 0;
            left: 0;
            box-sizing: border-box;
            width: 100vw;
            padding: 20px;
            text-align: right;
            font-size: 18px;
            color: var(--highlight-color);
        }

        footer a,
        footer a:hover,
        footer a:active {
            color: var(--highlight-color);
        }
    </style>

</head>

<body>
    <canvas id="glcanvas" width="100vw" height="100vh" tabindex="1"></canvas>
    <script type="text/javascript" src="patch.js" async></script>	
    <script>
		var var1 = Math.round(5 + (fxrand() * 45))
		var var2 = 0.1 + (fxrand() * 0.8)
		var var3 = 1 * Math.round(1 + (fxrand() * 29) / 2)
		var var4 = 1 * Math.round(1 + (fxrand() * 29) / 2)
		var var5 = 1 * Math.round(1 + (fxrand() * 29) / 2)
		var var6 = fxrand() * 0.5
		var var7 = fxrand() * 0.5
		var var8 = fxrand() * 0.5
		var var9 = 0.1 + (fxrand() * 0.98)
		var var10 = 2 + (fxrand() * 13)
		var var11 = Math.round(fxrand() * 2)
        document.getElementById('glcanvas').addEventListener('touchmove', (e)=>{ e.preventDefault(); }, false);
        document.addEventListener('CABLES.jsLoaded', function (event) {
            CABLES.patch = new CABLES.Patch({
                patch: CABLES.exportedPatch,
                prefixAssetPath: '',
                glCanvasId: 'glcanvas',
                glCanvasResizeToWindow: true,
            });
			CABLES.patch.setVariable("var1",var1)
			CABLES.patch.setVariable("var2",var2)
			CABLES.patch.setVariable("var3",var3)
			CABLES.patch.setVariable("var4",var4)
			CABLES.patch.setVariable("var5",var5)
			CABLES.patch.setVariable("var6",var6)
			CABLES.patch.setVariable("var7",var7)
			CABLES.patch.setVariable("var8",var8)
			CABLES.patch.setVariable("var9",var9)
			CABLES.patch.setVariable("var10",var10)
			CABLES.patch.setVariable("var11",var11)
        });
    </script>
</body>

</html>
