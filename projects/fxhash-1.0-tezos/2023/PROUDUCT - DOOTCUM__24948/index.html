<!DOCTYPE html>
<html lang="en">
<head>
  <title>SEED MAYORS</title>
  <script id="fxhash-snippet">
      let alphabet = "123456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ"
      var fxhash = new URLSearchParams(window.location.search).get('fxhash')
      let b58dec = str=>[...str].reduce((p,c)=>p*alphabet.length+alphabet.indexOf(c)|0, 0)
      let fxhashTrunc = fxhash.slice(2)
      let regex = new RegExp(".{" + ((fxhashTrunc.length/4)|0) + "}", 'g')
      let hashes = fxhashTrunc.match(regex).map(h => b58dec(h))
      let sfc32 = (a, b, c, d) => {
        return () => {
          a |= 0; b |= 0; c |= 0; d |= 0
          var t = (a + b | 0) + d | 0
          d = d + 1 | 0
          a = b ^ b >>> 9
          b = c + (c << 3) | 0
          c = c << 21 | c >>> 11
          c = c + t | 0
          return (t >>> 0) / 4294967296
        }
      }
      var fxrand = sfc32(...hashes)
      // used to get features during token mint
      window.addEventListener("message", (event) => {
        if (event.data === "fxhash_getFeatures") {
          parent.postMessage({
            id: "fxhash_getFeatures",
            data: window.$fxhashFeatures
          }, "*")
        }
      })
      var isFxpreview = new URLSearchParams(window.location.search).get('preview') === "1"
      function fxpreview() {
        window.dispatchEvent(new Event("fxhash-preview"))
        setTimeout(() => fxpreview(), 500)
      }
</script>

</head>
    <body style="background-color: white;">
        <script>
                    var canvas = document.createElement('canvas');
                    var width = canvas.width = window.innerWidth / 1.5
                    var height = canvas.height = window.innerHeight / 1.5
                    canvas.style = "background-color: white ; position: absolute; top: 0px; left: 0px; right: 0px; bottom: 0px; margin: auto; border:20px solid blue";
                    document.body.appendChild(canvas);
                    var ctx = canvas.getContext('2d');
                    ctx.translate(canvas.width / 2, canvas.height / 2);
                    ctx.scale(1, -1);
                    ctx.fillStyle = '#000';
                    ctx.fillRect(-canvas.width / 2, -canvas.height / 2, canvas.width, canvas.height);
                    var spheres = [];
                    for (var i = 0; i < 100; i++) {
                    spheres.push({
                        x: fxrand() * canvas.width - canvas.width / 2,
                        y: fxrand() * canvas.height - canvas.height / 2,
                        z: fxrand() * canvas.width - canvas.width / 2,
                        r: fxrand() * 10 + 10,
                        c: '#' + Math.floor(fxrand() * 16777215).toString(16)
                    });
                    }
                    function draw() {
                        ctx.fillRect(-canvas.width / 2, -canvas.height / 2, canvas.width, canvas.height);
                        for (var i = 0; i < spheres.length; i++) {
                            var sphere = spheres[i];
                            var scale = canvas.width / (canvas.width + sphere.z);
                            ctx.fillStyle = sphere.c;
                            ctx.beginPath();
                            ctx.arc(sphere.x * scale, sphere.y * scale, sphere.r * scale, 0, 2 * Math.PI);
                            ctx.fill();
                            sphere.z -= 3;
                            if (sphere.z < -canvas.width) {
                            sphere.z = canvas.width;
                            }
                        }
                        requestAnimationFrame(draw);
                    }
                    draw();

        </script>
    </body>
</html>
