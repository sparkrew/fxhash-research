    <script id="fxhash-snippet">
      let alphabet = "123456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ"
      var fxhash = new URLSearchParams(window.location.search).get('fxhash')
      let b58dec = str=>[...str].reduce((p,c)=>p*alphabet.length+alphabet.indexOf(c)|0, 0)
      let fxhashTrunc = fxhash.slice(2)
      let regex = new RegExp(".{" + ((fxhashTrunc.length/4)|0) + "}", 'g')
      let hashes = fxhashTrunc.match(regex).map(h => b58dec(h))
      let sfc32 = (a, b, c, d) => {
        return () => {
          a |= 0; b |= 0; c |= 0; d |= 0
          var t = (a + b | 0) + d | 0
          d = d + 1 | 0
          a = b ^ b >>> 9
          b = c + (c << 3) | 0
          c = c << 21 | c >>> 11
          c = c + t | 0
          return (t >>> 0) / 4294967296
        }
      }
      var fxrand = sfc32(...hashes)
      // used to get features during token mint
      window.addEventListener("message", (event) => {
        if (event.data === "fxhash_getFeatures") {
          parent.postMessage({
            id: "fxhash_getFeatures",
            data: window.$fxhashFeatures
          }, "*")
        }
      })
      var isFxpreview = new URLSearchParams(window.location.search).get('preview') === "1"
      function fxpreview() {
        window.dispatchEvent(new Event("fxhash-preview"))
        setTimeout(() => fxpreview(), 500)
      }
</script>

    <script type="text/javascript">
      
      function loadScript(src) {
          var s = document.createElement('script');
          s.src = src + "?" + new Date().getTime();
          s.type = "text/javascript";
          s.async = false;
          document.getElementsByTagName('head')[0].appendChild(s);
      }

      const HSLToRGB = (h, s, l, alph = 1) => {
        s /= 100;
        l /= 100;
        const k = n => (n + h / 30) % 12;
        const a = s * Math.min(l, 1 - l);
        const f = n =>
          l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
        return color(255 * f(0), 255 * f(8), 255 * f(4), alph * 255);
      };

      const RGBToHSL = (col) => {
        var r = red(col);
        var g = green(col);
        var b = blue(col);
        r /= 255, g /= 255, b /= 255;
        var max = Math.max(r, g, b), min = Math.min(r, g, b);
        var h, s, l = (max + min) / 2;

        if (max == min) {
          h = s = 0; // achromatic
        } else {
          var d = max - min;
          s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
          switch (max) {
            case r: h = (g - b) / d + (g < b ? 6 : 0); break;
            case g: h = (b - r) / d + 2; break;
            case b: h = (r - g) / d + 4; break;
          }
          h /= 6;
        }

        var res = [];
        res["h"] = h;
        res["s"] = s;
        res["l"] = l;

        return res;
      };

  
  window.addEventListener('load', (event) => {
    
      fetchWeb();
          setDefaultVars();
          randomizeParameters();

           let usedColors = getUsedColors();
          var featuresArray = {
            "Colors" : usedColors,
            "Color-Change" : (fadeColors) ? "Fading" : "Blinking",
            "Merge Iterations" : mergeIterations,
            "Illumination" : getIllumination()
          }


          window.$fxhashFeatures = featuresArray; 
         
      });

      function getIllumination()
      {
        let l = Math.round(map(godRayWeight,0.001,0.021,0,1)*4);
        if(l == 0)
        {
          return "Very Low";
        }

        if(l == 1)
        {
          return "Low";
        }
        if(l == 2)
        {
          return "Medium";
        }

        if(l == 3)
        {
          return "High";
        }

        if(l == 4)
        {
          return "Very High";
        }
        return "High";
      }

      function getIllumination_()
      {
        var inverted = 1-lightThreshold;
        if(inverted < 0.2)
        {
          return "Very Low";
        }

        if(inverted >= 0.2 && inverted < 0.4)
        {
          return "Low";
        }
        if(inverted >= 0.4 && inverted < 0.6)
        {
          return "Medium";
        }

        if(inverted >= 0.6 && inverted < 0.8)
        {
          return "High";
        }

        if(inverted >= 0.8)
        {
          return "Very High";
        }
      }

      function getInitialCellSize()
      {
        var sqr = verticalCellCount+horizontalCellCount;
        var maxSqr = 10*10;

        var sizes = [
          "Small",
          "Medium",
          "Large"
        ];

        var l = Math.round(map(sqr,0,maxSqr,0,3));
        return sizes[l];

      }
      function getCornerRadiusSize()
      {
        switch(cornerRadius/10){
          case 0:
            return "None";
          case 1:
            return "Small"
          case 2:
            return "Large";
        }

        return "Large";
      }

      function getWeightedPalette() {
        var chances = [
              2,
              10,
              25,
              13,
              10,
              3,
              15,
              12,
              7,
              2,
              1
        ]
        
        var cols = [];
        var index = 0;
        for(var i = 0;i <= 10;i++)
        {
          for(var o = 0;o < chances[i];o++)
          {
            cols.push(i); 
          }
        }

        var rndIndex = Math.floor(fxrand()*cols.length);
        return cols[rndIndex];
      }


      function setDefaultVars()
      {
      
        wD = windowWidth;
        hD = windowHeight;

        squareSize = Math.min(wD,hD);        

        if(plottableView)
        {
          wD = squareSize;
          hD = squareSize;
        }
        
        screenRatioW = 1 / 800 * wD;
        screenRatioH = 1 / 800 * hD;
        screenRatioAdjustment = 1/800*squareSize;

        paddingLeft = Math.max(0,(wD-squareSize)/2);
        paddingTop = Math.max(0,(hD-squareSize)/2);

        glowSize = squareSize/20;

        XPOS = wD/2;
        YPOS = hD/2;
      }

      function randomizeParameters()
      {
        bgColor = color(20);
        currentSeed = fxhash;
        noiseSeed(currentSeed);
        let randMerge = fxrand();
        if(randMerge < 0.05)
        {
          mergeIterations = 0;
        } else if(randMerge > 0.9){
          mergeIterations = 3+Math.floor(fxrand()*3);
        } else {
          mergeIterations = 1+Math.floor(fxrand()*2);
        }
        //mergeIterations = 3;
        minCount = 2;
        maxCount = 24;

        horizontalCellCount = minCount+Math.floor(fxrand()*(maxCount-minCount));
        if(horizontalCellCount%2==1) horizontalCellCount++;
        
        verticalCellCount = horizontalCellCount+1;
        
        outterPadding = 0//(hD/((verticalCellCount-1)*0.875))/3
      

        verticalSpeed = 0.5+fxrand()//500+Math.round(fxrand()*4)*500;
        horizontalSpeed = 0.5+fxrand()//500+Math.round(fxrand()*4)*500;

        fadeColors = fxrand() < 0.7 ? true : false;
        lightThreshold = 0.5+fxrand()*0.5;
        godRayWeight = 0.001+0.02*fxrand();
        strokeWidth = map(horizontalCellCount,minCount,maxCount,3,0.5,true);

        setupColors();
      }


    </script>
