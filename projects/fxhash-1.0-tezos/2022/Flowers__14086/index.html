<html>

            <script id="fxhash-snippet">
      let alphabet = "123456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ"
      var fxhash = new URLSearchParams(window.location.search).get('fxhash')
      let b58dec = str=>[...str].reduce((p,c)=>p*alphabet.length+alphabet.indexOf(c)|0, 0)
      let fxhashTrunc = fxhash.slice(2)
      let regex = new RegExp(".{" + ((fxhashTrunc.length/4)|0) + "}", 'g')
      let hashes = fxhashTrunc.match(regex).map(h => b58dec(h))
      let sfc32 = (a, b, c, d) => {
        return () => {
          a |= 0; b |= 0; c |= 0; d |= 0
          var t = (a + b | 0) + d | 0
          d = d + 1 | 0
          a = b ^ b >>> 9
          b = c + (c << 3) | 0
          c = c << 21 | c >>> 11
          c = c + t | 0
          return (t >>> 0) / 4294967296
        }
      }
      var fxrand = sfc32(...hashes)
      // used to get features during token mint
      window.addEventListener("message", (event) => {
        if (event.data === "fxhash_getFeatures") {
          parent.postMessage({
            id: "fxhash_getFeatures",
            data: window.$fxhashFeatures
          }, "*")
        }
      })
      var isFxpreview = new URLSearchParams(window.location.search).get('preview') === "1"
      function fxpreview() {
        window.dispatchEvent(new Event("fxhash-preview"))
        setTimeout(() => fxpreview(), 500)
      }
</script>

<script src="./p5.min.js"></script>

<script>
let pallet=[[[355,100,62], [45,99,80], [38,99,62], [64,80,30], [198,80,52], [302,77,49]],
            [[45,44,55], [19,81,76], [357,100,50], [259,62,62], [221,88,52], [50,88,77]],
            [[322,100,59], [1,80,70], [328,92,33], [246,62,39], [207,100,18], [357,100,24]],
            [[22,73,20], [41,76,63], [311,71,52], [358,82,34], [69,68,39], [316,74,38]],
            [[211,79,59], [210,100,40], [210,80,54], [165,88,44], [43,94,53], [36,86,51]],
            [[15,82,71], [313,100,83], [185,87,38], [182,46,40], [28,100,55], [175,50,35]],
            [[225,45,70], [139,59,58], [213,78,56], [124,55,61], [225,82,46], [125,44,62]],
            [[30,41,68], [92,11,56], [83,58,85], [111,42,46], [45,67,69], [18,75,80]],
            [[323,84,37], [349,99,60], [11,100,100], [41,100,79], [193,83,36], [215,96,45]]]
      
      function getPallet(value) {
            if      (value < .11) return 0
            else if (value < .22) return 1
            else if (value < .33) return 2
            else if (value < .44) return 3
            else if (value < .55) return 4
            else if (value < .66) return 5
            else if (value < .77) return 6
            else if (value < .88) return 7
            else return 8
            }  
      function getSeed(value) {
            if (value < .16) return 7
            else if (value < .32) return 15
            else if (value < .48) return 17
            else if (value < .64) return 29
            else if (value < .8) return 33
            else  return 43
            }
      function getOctaves(value) {
            if      (value < .08) return 5
            else if (value < .16) return 10
            else if (value < .24) return 15
            else if (value < .32) return 20
            else if (value < .4) return 30
            else if (value < .48) return 40
            else if (value < .56) return 50
            else if (value < .64) return 60
            else if (value < .72) return 70
            else return 100
            }              
      function getStrength(value) {
            if (value < .16) return .1
            else if (value < .32) return .32
            else if (value < .48) return .4
            else if (value < .64) return .54
            else if (value < .8) return .75
            else  return .9
            }
      function getThickness(value) {
            if (value < .25) return 150
            else if (value < .5) return 170
            else if (value < .75) return 210
            else  return 250
            }
      function getMode(value) {
            if (value < .5) return 1
            else  return 2
            }
      window.$fxhashFeatures = {
            "_thickness": getThickness(fxrand()),
            "_pallet_ind": getPallet(fxrand()),
            "_octaves": getOctaves(fxrand()),
            "_strength": getStrength(fxrand()),
            "_mode": getMode(fxrand()),
            "_seed": getSeed(fxrand())
      }
let canv, _seed, _strength, _octaves, _tw=50, _th=70, _thickness, _mode, flowerCount, mf
let objs=[], cols,rows,scl=20, w, h, _pallet_ind, flying = 0, _yOff=.005, _flying=.005
let rainbow=0, rainbowd=1, pgs=[], maxRing=900, diam=[], matrix=[], dmin, dmax, places=[]

function setup() {
      _thickness=window.$fxhashFeatures._thickness
      _pallet_ind=window.$fxhashFeatures._pallet_ind
      _strength=window.$fxhashFeatures._strength
      _octaves=window.$fxhashFeatures._octaves
      _seed=window.$fxhashFeatures._seed
      _mode=window.$fxhashFeatures._mode
      ww=800
      wh=800
      dmin=_thickness
      dmax=dmin+150
      canv = createCanvas(ww, wh)
      colorMode(HSB)
      frameRate(60)
      blendMode(HARD_LIGHT)
      let z=0
      noiseSeed(_seed);
      noiseDetail(_octaves, _strength);
      angleMode(DEGREES)
      smooth()
      let cx, cy, px, py, minv1=2*ww, maxv1=0, minv2=2*ww, maxv2=0, pl=0
      for (let i=0; i<maxRing; i++){
            minv1 = min(minv1, 100 * noise(i, i))
            maxv1 = max(maxv1, 100 * noise(i, i))
            minv2 = min(minv2, 100 * noise(i))
            maxv2 = max(maxv2, 100 * noise(i))
      }
      // fill matrix empty
      for (let i=0; i<2*ww; i++){
            matrix[i] = []
            for (let j=0; j<2*ww; j++){
                  matrix[i][j] = 0
            }
      }
      let i=0, dcnt = 0
      for (i=0; i<ww; i+=40)
            for (j=i; j<ww; j+=30){
                  if (dcnt % 3 == 0)
                        diam[dcnt] = round(map(200 * noise(i, j, 2*dcnt),minv2, maxv2, dmin, dmax*1.8))
                  else if (dcnt % 2 == 0)
                        diam[dcnt] = round(map(200 * noise(dcnt, 3*i, j),minv2, maxv2, dmin*2, dmax*2.2))
                  else
                        diam[dcnt] = round(map(200 * noise(j, i, dcnt),minv2, maxv2, dmin*1.5, dmax*3))
                  
                  i += diam[dcnt]
                  dcnt++
            }

            dcnt = 0 , d = diam[dcnt]
      // fill matrix + find diameters
      let sc=100
      stroke(sc)
      let iw = 0, ih = 0
            while (iw<ww){
                  if ((ww-iw) < diam[dcnt])
                        diam[dcnt] = ww - iw
                  for (let i=iw; i<iw+diam[dcnt]; i++){
                        for (let j=ih; j<ih+diam[dcnt]; j++){
                              matrix[i][j] = 1
                              //point(i, j)
                        }
                  }
                  fill(255)
                  if (diam[dcnt]>20){
                        places[pl] = [iw+diam[dcnt]/2, ih+diam[dcnt]/2, diam[dcnt]-10]
                        pl++
                        // rect(iw+diam[dcnt]/2, ih+diam[dcnt]/2, diam[dcnt]-10)
                  }
                  iw += diam[dcnt]
                  dcnt+=2
            }
      
      for(let jj=dmin; jj<ww; jj+=30){
            for(let i=0; i<ww; i++){
                  if (matrix[i][jj] == 0){
                        //check if its empty to dmax
                        let isEmpty=0, emptySize=0
                        for (let k=i; k<i+dmax/round(map(abs(jj-i/2), 0, 3*ww/2, 1, 6)); k++){
                              isEmpty += matrix[k][jj]
                              if (isEmpty == 0)
                                    emptySize++
                        }
                        if (isEmpty == 0){// fill empty space form pre defined diametter size
                              if ((ww-jj) < diam[dcnt])
                                    diam[dcnt] = ww - jj
                              if ((ww-i) < diam[dcnt])
                                    diam[dcnt] = ww - i
                              for (let k=i; k<i+diam[dcnt]; k++){
                                    for (let j=jj; j<jj+diam[dcnt]; j++){
                                          matrix[k][j] = 1
                                          sc=360-sc
                                          stroke(color(dcnt*5,100,100))
                                          //point(k, j)
                                    }
                              }
                              if (diam[dcnt]>20){
                                    places[pl] = [i+diam[dcnt]/2, jj+diam[dcnt]/2, diam[dcnt]-10]
                                    pl++
                                    // rect(i+diam[dcnt]/2, jj+diam[dcnt]/2, diam[dcnt]-10)
                              }
                              dcnt++
                        }
                        else{// fill empty space to fit
                              if ((ww-jj) < emptySize)
                                    emptySize = ww - jj
                              if ((ww-i) < emptySize)
                                    emptySize = ww - i
                              for (let k=i; k<i+emptySize; k++){
                                    for (let j=jj; j<jj+emptySize; j++){
                                          matrix[k][j] = 1
                                          sc=255-sc
                                          stroke(color(round((k+j+dcnt*9)%360),100,100))
                                          //point(k, j)
                                    }
                              }
                              if (emptySize>20){
                                    places[pl] = [i+emptySize/2, jj+emptySize/2, emptySize-10]
                                    pl++
                                    // rect(i+emptySize/2, jj+emptySize/2, emptySize-10)
                              }
                        }
                  }
            }
      }
      // ///////////
      flowerCount=0
      for (let i=0; i<pl; i++){
            if (places[i][2]>120 || places[i][2]>90)
                  flowerCount++
      }
      for (let i=0; i<pl; i++){
            if (places[i][2]>120){
                  objs[i] = new objsC(i, places[i][0], places[i][1], places[i][2]+10)
            }
            else if (places[i][2]>90){
                  objs[i] = new objsC(i, places[i][0], places[i][1], places[i][2]+50)
            }
      }
      mf = new objsC(200,ww/2, ww/2, ww/2)
      background(20)
      if (_mode == 1)
            background(255)
}

function draw(){
      for(let c in objs){
            push()
            objs[c].draw()
            pop()
      }
      if (flowerCount == 4)
            mf.draw()
}
class objsC{
      constructor(i, cx, cy, r){
            this.no = i
            this.cx = cx
            if (cy>ww/2 && cy<(ww-80) && flowerCount==4)
                  this.cy = cy+2*(ww-cy)/5
            else
                  this.cy = cy

            this.r = r
            this.r0=10
            this.arcw = r
            this.rotation =  this.no % 2
            this.clr=floor(_pallet_ind)
            this.clr2=floor(abs(this.no)%5)
            this.transp=0.05
            this.direction=1
      }
      draw(){
            let y
            if (this.r0<this.r){
                  fill(color(40+pallet[this.clr][this.clr2][0], pallet[this.clr][this.clr2][1]+map(this.r0,0,this.r,0,10), pallet[this.clr][this.clr2][2]+map(this.r0,0,this.r,0,10), .03))
                  if (_mode == 1)
                        fill(color(40+pallet[this.clr][this.clr2][0], pallet[this.clr][this.clr2][1]+map(this.r0,0,this.r,0,10), pallet[this.clr][this.clr2][2]+map(this.r0,0,this.r,0,10), .02))
                  this.r0+=2
            }
            noStroke()
            // circle(this.cx, this.cy,this.r/2)
            let cnt=0
            let scale=floor(map(_thickness,100,250, 30,60))
            strokeWeight(0)
            let x1,y1
            let x0=this.r0*cos(-this.r0+this.cx)/3
            let y0=this.r0*sin(-this.r0+this.cx)/3
            if (this.r0<4*this.r/5){
                  beginShape()
                  curveVertex(x0+this.cx-20, y0+this.cy)
                  // curveVertex(x0+this.cx, y0+this.cy)
                  for (let x=0; x<this.r0-10; x+=30){
                        cnt++
                        stroke(255)
                        if (_mode == 1)
                              stroke(0)
                        //y = sqrt(pow(this.r/4, 2) - pow(x-this.cx, 2)) + this.cy 
                        x1 = .8*this.r0*cos(x)/3 + 30*noise(cnt)
                        y1 = .8*this.r0*sin(x)/3 + 30*noise(cnt, cnt)
                        curveVertex(x1+this.cx-20, y1+this.cy)
                        //line(x0+ this.cx, y0 + this.cy, x1+ this.cx, y1 + this.cy)
                        x0=x1
                        y0=y1
                  }
                  curveVertex(x0+this.cx-20, y0+this.cy)
                  endShape()
            }
            if(this.r0<20){
                  noFill()
                  cnt=0

                  if (this.direction == 1){
                        this.direction = 2
                        for (let x=-this.r+this.cx; x<this.r+this.cx; x+=scale){
                              cnt++
                              stroke(color(pallet[this.clr][this.clr2][0], pallet[this.clr][this.clr2][1]-10, pallet[this.clr][this.clr2][2]-30, 1))
                              x1 = this.r*cos(x)/3 + this.cx
                              y1 = this.r*sin(x)/3 + this.cy
                              strokeWeight(.5)
                              if (cnt % 2 == 0)
                                    strokeWeight(2.5)
                              noFill()
                              if (cnt % 3 == 0){
                                    if (_mode == 1)
                                          fill(color(pallet[this.clr][this.clr2][0], pallet[this.clr][this.clr2][1], pallet[this.clr][this.clr2][2]-map(cnt,0,50,0,30), .1))
                                    else
                                          fill(color(pallet[this.clr][this.clr2][0], pallet[this.clr][this.clr2][1], pallet[this.clr][this.clr2][2]-map(cnt,0,50,0,30), .9))
                                    noStroke()
                              }
                              if (this.no == 200)
                                    fill(color(pallet[this.clr][cnt%5][0], pallet[this.clr][cnt%5][1], pallet[this.clr][cnt%5][2]+map(cnt,0,50,0,30), .4))
                              beginShape()
                              curveVertex(this.cx, this.cy)
                              curveVertex(this.cx, this.cy)
                              if (y1-this.cy<-50){
                                    y1 += map(30*noise(cnt), 0, 50, -50, 40)
                                    curveVertex(x1-this.r/9, y1)
                                    curveVertex(x1, y1-map(cnt,0,50,30,50))
                                    curveVertex(x1+this.r/11, y1)
                              }
                              else if (y1-this.cy>50){
                                    y1 += map(30*noise(cnt), 0, 50, -40, 30)
                                    curveVertex(x1-this.r/9, y1-30)
                                    curveVertex(x1, y1+10)
                                    curveVertex(x1+this.r/11, y1-30)
                              }
                              else if (x1<this.cx){
                                    curveVertex(x1, y1-20)
                                    curveVertex(x1-50, y1)
                                    curveVertex(x1, y1+20)
                              }
                              else if (x1>this.cx){
                                    curveVertex(x1, y1-20)
                                    curveVertex(x1+50, y1)
                                    curveVertex(x1, y1+20)
                              }
                              curveVertex(this.cx, this.cy)
                              curveVertex(this.cx, this.cy)
                              endShape()
                              point(x1, y1)
                              strokeWeight(.5)
                              point(x1+10*noise(cnt), y1-16*noise(cnt,cnt))
                              if (cnt%3==0){
                                    push()
                                    strokeWeight(2.5)
                                    point(x1-8*noise(cnt,cnt), y1-21*noise(cnt))
                                    pop()
                              }

                              if (cnt % 3 == 0){
                                    noFill()
                                    stroke(255)
                                    if (_mode == 1)
                                          stroke(0)
                                    if (this.no == 200)
                                          stroke(color(pallet[this.clr][cnt%5][0], pallet[this.clr][cnt%5][1], pallet[this.clr][cnt%5][2]-map(cnt,0,50,0,30), 1))
                                    beginShape()
                                    curveVertex(this.cx, this.cy)
                                    curveVertex(this.cx, this.cy)
                                    if (y1-this.cy<-50){
                                          y1 += map(30*noise(cnt), 0, 50, -50, 40)
                                          curveVertex(x1-this.r/9, y1)
                                          curveVertex(x1, y1-map(cnt,0,50,30,60))
                                          curveVertex(x1+this.r/11, y1)
                                    }
                                    else if (y1-this.cy>50){
                                          y1 += map(30*noise(cnt), 0, 50, -60, 50)
                                          curveVertex(x1-this.r/9, y1-30)
                                          curveVertex(x1, y1+10)
                                          curveVertex(x1+this.r/11, y1-30)
                                    }
                                    else if (x1<this.cx){
                                          x1 += map(30*noise(cnt), 0, 50, -40, 50)
                                          curveVertex(x1, y1-20)
                                          curveVertex(x1-50, y1)
                                          curveVertex(x1, y1+20)
                                    }
                                    else if (x1>this.cx){
                                          x1 += map(30*noise(cnt), 0, 50, -20, 30)
                                          curveVertex(x1, y1-20)
                                          curveVertex(x1+50, y1)
                                          curveVertex(x1, y1+20)
                                    }
                                    curveVertex(this.cx, this.cy)
                                    curveVertex(this.cx, this.cy)
                                    endShape()
                              }
                        }
                  }
                  else{
                        this.direction = 1
                        for (let x=this.r+this.cx; x>-this.r+this.cx; x-=scale){
                              cnt++
                              stroke(255)
                              if (_mode == 1)
                                    stroke(0)
                              x1 = this.r*cos(x)/3 + this.cx
                              y1 = this.r*sin(x)/3 + this.cy
                              point(x1, y1)
                              strokeWeight(.5)
                              if (cnt % 2 == 0)
                                    strokeWeight(2.5)
                              noFill()
                              if (cnt % 3 == 0){
                                    if (_mode == 1)
                                          fill(color(pallet[this.clr][this.clr2][0], pallet[this.clr][this.clr2][1], pallet[this.clr][this.clr2][2], .1))
                                    else
                                          fill(color(pallet[this.clr][this.clr2][0], pallet[this.clr][this.clr2][1], pallet[this.clr][this.clr2][2], .9))
                                    noStroke()
                              }
                              if (this.no == 200)
                                    fill(color(pallet[this.clr][cnt%5][0], pallet[this.clr][cnt%5][1], pallet[this.clr][cnt%5][2]+map(cnt,0,50,0,30), .4))
                              beginShape()
                              curveVertex(this.cx, this.cy)
                              curveVertex(this.cx, this.cy)
                              if (y1-this.cy<-50){
                                    y1 += map(30*noise(cnt), 0, 50, -50, 50)
                                    curveVertex(x1-this.r/9, y1)
                                    curveVertex(x1, y1-map(cnt,0,50,40,90))
                                    curveVertex(x1+this.r/11, y1)
                              }
                              else if (y1-this.cy>50){
                                    y1 += map(30*noise(cnt), 0, 50, -40, 30)
                                    curveVertex(x1-this.r/9, y1-30)
                                    curveVertex(x1, y1+10)
                                    curveVertex(x1+this.r/11, y1-30)
                              }
                              else if (x1<this.cx){
                                    curveVertex(x1, y1-20)
                                    curveVertex(x1-50, y1)
                                    curveVertex(x1, y1+20)
                              }
                              else if (x1>this.cx){
                                    curveVertex(x1, y1-20)
                                    curveVertex(x1+50, y1)
                                    curveVertex(x1, y1+20)
                              }
                              curveVertex(this.cx, this.cy)
                              curveVertex(this.cx, this.cy)
                              endShape()
                              if (cnt % 3 == 0){
                                    noFill()
                                    stroke(255)
                                    if (_mode == 1)
                                          stroke(0)
                                    if (this.no == 200)
                                          stroke(color(pallet[this.clr][cnt%5][0], pallet[this.clr][cnt%5][1], pallet[this.clr][cnt%5][2]-map(cnt,0,50,0,30), 1))
                                          
                                    beginShape()
                                    curveVertex(this.cx, this.cy)
                                    curveVertex(this.cx, this.cy)
                                    if (y1-this.cy<-50){
                                          y1 += map(30*noise(cnt), 0, 50, -30, 35)
                                          curveVertex(x1-this.r/9, y1)
                                          curveVertex(x1, y1-map(cnt,0,50,50,110))
                                          curveVertex(x1+this.r/11, y1)
                                    }
                                    else if (y1-this.cy>50){
                                          y1 += map(30*noise(cnt), 0, 50, -40, 30)
                                          curveVertex(x1-this.r/9, y1-30)
                                          curveVertex(x1, y1+10)
                                          curveVertex(x1+this.r/11, y1-30)
                                    }
                                    else if (x1<this.cx){
                                          x1 += map(30*noise(cnt), 0, 50, -30, 50)
                                          curveVertex(x1, y1-20)
                                          curveVertex(x1-50, y1)
                                          curveVertex(x1, y1+20)
                                    }
                                    else if (x1>this.cx){
                                          x1 += map(30*noise(cnt), 0, 50, -20, 50)
                                          curveVertex(x1, y1-20)
                                          curveVertex(x1+50, y1)
                                          curveVertex(x1, y1+20)
                                    }
                                    curveVertex(this.cx, this.cy)
                                    curveVertex(this.cx, this.cy)
                                    endShape()
                                    //filter(OPAQUE)
                              }
                        }
                  }

            }
      }
