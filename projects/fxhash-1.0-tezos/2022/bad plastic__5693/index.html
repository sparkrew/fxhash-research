<html manifest="game.manifest">                                           
<head>
  <script id="fxhash-snippet">
      let alphabet = "123456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ"
      var fxhash = new URLSearchParams(window.location.search).get('fxhash')
      let b58dec = str=>[...str].reduce((p,c)=>p*alphabet.length+alphabet.indexOf(c)|0, 0)
      let fxhashTrunc = fxhash.slice(2)
      let regex = new RegExp(".{" + ((fxhashTrunc.length/4)|0) + "}", 'g')
      let hashes = fxhashTrunc.match(regex).map(h => b58dec(h))
      let sfc32 = (a, b, c, d) => {
        return () => {
          a |= 0; b |= 0; c |= 0; d |= 0
          var t = (a + b | 0) + d | 0
          d = d + 1 | 0
          a = b ^ b >>> 9
          b = c + (c << 3) | 0
          c = c << 21 | c >>> 11
          c = c + t | 0
          return (t >>> 0) / 4294967296
        }
      }
      var fxrand = sfc32(...hashes)
      // used to get features during token mint
      window.addEventListener("message", (event) => {
        if (event.data === "fxhash_getFeatures") {
          parent.postMessage({
            id: "fxhash_getFeatures",
            data: window.$fxhashFeatures
          }, "*")
        }
      })
      function fxpreview() {
        window.dispatchEvent(new Event("fxhash-preview"))
        setTimeout(() => fxpreview(), 500)
      }
</script>

<div>
  <script type="text/javascript">

    //thanks @Yazid for these two helper functions
    function random_num(a, b) {
        return a+(b-a)*fxrand()
      }
    function random_int(a, b) {
      return Math.floor(random_num(a, b+1))
    }

    let rng=""

    let srand = random_num(1,4096)
    rng=rng.concat("",srand)

    let palettes = {
      1: "bad fire",
      2: "bad arctic blue",
      3: "bad matrix green",
      4: "bad magma",
      5: "bad winter moss",
      6: "bad october",
      7: "bad office",
      8: "bad thermal",
      9: "bad jawbreaker",
      10: "bad sulfur"
    }

    let palette = random_int(1,10)
    rng=rng.concat(",",palette)

    let palette_offset = random_int(0,7)
    rng=rng.concat(",",palette_offset)

    let osc_offset_1 = random_num(0,7)
    rng=rng.concat(",",osc_offset_1)

    let osc_offset_2 = random_num(0,7)
    rng=rng.concat(",",osc_offset_2)

    let center_shape = random_int(0,8)
    rng=rng.concat(",",center_shape)

    rng=rng.concat("",",")
    console.log(rng)

    window.$fxhashFeatures = {
      "palette": palettes[palette],
      "palette offset": palette_offset,
      "oscillator offset 1": osc_offset_1,
      "oscillator offset 2": osc_offset_2,
      "center shape": center_shape
    }


    // ------ SETUP USED FOR PICO8 CART ------
    var
      canvas = document.getElementById("canvas"),
      Module = {canvas: canvas, arguments: ["-gif_len", "16", "-p", rng]};
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    evt = evt || window.event;

};
