<script id="fxhash-snippet">
      let alphabet = "123456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ"
      var fxhash = new URLSearchParams(window.location.search).get('fxhash')
      let b58dec = str=>[...str].reduce((p,c)=>p*alphabet.length+alphabet.indexOf(c)|0, 0)
      let fxhashTrunc = fxhash.slice(2)
      let regex = new RegExp(".{" + ((fxhashTrunc.length/4)|0) + "}", 'g')
      let hashes = fxhashTrunc.match(regex).map(h => b58dec(h))
      let sfc32 = (a, b, c, d) => {
        return () => {
          a |= 0; b |= 0; c |= 0; d |= 0
          var t = (a + b | 0) + d | 0
          d = d + 1 | 0
          a = b ^ b >>> 9
          b = c + (c << 3) | 0
          c = c << 21 | c >>> 11
          c = c + t | 0
          return (t >>> 0) / 4294967296
        }
      }
      var fxrand = sfc32(...hashes)
      // used to get features during token mint
      window.addEventListener("message", (event) => {
        if (event.data === "fxhash_getFeatures") {
          parent.postMessage({
            id: "fxhash_getFeatures",
            data: window.$fxhashFeatures
          }, "*")
        }
      })
      var isFxpreview = new URLSearchParams(window.location.search).get('preview') === "1"
      function fxpreview() {
        window.dispatchEvent(new Event("fxhash-preview"))
        setTimeout(() => fxpreview(), 500)
      }
</script>

function fx_7b_init(imw,imh)
{
	loop=0;

	bmy=new Array(blokes);
	fx_7b_reset(imw,imh);
}

function fx_7b_reset(imw,imh)
{
	
	
	for (var i=0;i< blokes ;i++ )
	{
		bcr[i]=  1;
		bcg[i]=bcr[i];
		bcb[i]=bcr[i];
		 
		if( my_random(colchance)==0) //colors
		{
			
			var gg=my_random(b_pal);
			bcr[i]= b_r[gg];// +1;
			bcg[i]= b_g[gg];// +1;
			bcb[i]= b_b[gg];// +1;
		}

		
		
		
	}

	for (var i=0;i<blokes ;i++ )
	{
		bx1[i]=my_random(imw);
		by1[i]=my_random(imh);
		bx2[i]=bx1[i]+ ((my_random(imw)/blokew)<<0)+1;
		by2[i]=by1[i]+ ((my_random(imh)/blokew)<<0)+1;
		
		if (my_random(2)==0)
		{
			bx2[i]=bx1[i]+ ((my_random(imw)/(blokew*2))<<0)+1;
			by2[i]=by1[i]+ ((my_random(imh)/(blokew*2))<<0)+1;			
		}
		
		if (my_random(2)==0)
		{
			bmx[i]=0;
			bmy[i]=my_random_half_minus(blokespeed);	//speed	
		}
		else
		{
			bmx[i]=my_random_half_minus(blokespeed); //speed	
			bmy[i]=0;						
		}

		if (bmx[i]==0 && bmy[i]==0)
		{	
			if (my_random(2)==0){bmx[i]=1;}
			else{bmy[i]=1;}
		}
	}
}

function fx_7b(imw,imh,px_r,px_g,px_b)
{
	
	for (var i=0;i<blokes ;i++ )
	{
		
		if(my_random(100)==0 && bmx[i] > 0)
		{
			bmx[i]++;			
			if(bmx[i]<1){bmx[i]=1;}
		}
		if(my_random(100)==0 && bmx[i]<0)
		{
			bmx[i]--;			
			if(bmx[i]>-1){bmx[i]=-1;}
		}
		if(my_random(100)==0 && bmy[i]>0)
		{
			bmy[i]++;			
			if(bmy[i]<1){bmy[i]=1;}
		}

			bmy[i]--;			
			if(bmy[i]>-1){bmy[i]=-1;}
		}

		bx1[i]=bx1[i]+bmx[i];
		by1[i]=by1[i]+bmy[i];
		bx2[i]=bx2[i]+bmx[i];
		by2[i]=by2[i]+bmy[i];
		
		if (bx1[i]>(imw-1) && bx2[i]>(imw-1))	{bmx[i]=-bmx[i];}
		if (bx1[i]<1 && bx2[i]<1)				{bmx[i]=-bmx[i];}
		if (by1[i]>(imh-1) && by2[i]>(imh-1))	{bmy[i]=-bmy[i];}

function drawbloke_sub(x1,y1, x2, y2, w, h, r, g, b, px_r,px_g,px_b)
{
	var a1=0,a2=0,b1=0,b2=0,posi=0,rr=0,gg=0,bb=0;

	if (x1<0){x1=0;}
	if (x2<0){x2=0;}
	if (x1>(w-1)){x1=w-1;}
	if (x2>(w-1)){x2=w-1;}

	if (y1<0){y1=0;}
	if (y2<0){y2=0;}
	if (y1>(h-1)){y1=h-1;}
	if (y2>(h-1)){y2=h-1;}
		
	if (x1>=x2){a1=x2; a2=x1;}
	else {a1=x1; a2=x2;}

	if (y1>y2){b1=y2; b2=y1;}
	else {b1=y1; b2=y2;}

	//g_drawline_min_01(a1,b1, a2, b1, 	w,h, r,g,b, 	px_r, px_g, px_b, true);
	//g_drawline_min_01(a1,b2-1, a2, b2-1,w,h, r,g,b, 	px_r, px_g, px_b, true);
	//g_drawline_min_01(a1,b1, a1, b2,	w,h, r,g,b, 	px_r, px_g, px_b, true);
	//g_drawline_min_01(a2-1,b1, a2-1, b2,w,h, r,g,b, 	px_r, px_g, px_b, true);
	

	for (var j=b1;j<b2 ;j++)

function fastfader_white_02(start,size,ii_w,ii_h,buf_r,buf_g,buf_b,step)
{
	var done=false;
	
	var end=start+size;
	if( end > ii_h-1){end=ii_h-1; done=true;}
		
	for(var j=start; j<end;j++)
	{	
		var p0= j*ii_w;
		for(var i=0;i<ii_w;i++)
		{	
			var p=p0+i
			buf_r[p]+=step; 
			buf_g[p]+=step;  
			buf_b[p]+=step; 
		}
	}
	return(done);
}

// now top to bottom // you can make all kinds of variations ofcourse!
function toscreen_render()
{	
	if(renderstepper==0)
	{
		var stepr_x =(im_w / pix_screen_w);  
		var stepr_y =(im_h / pix_screen_h);
	
		//sampling org texture
		x_step = new Array(pix_screen_w*pix_screen_h);
		y_step = new Array(pix_screen_w*pix_screen_h);
			
		for (var j = 0; j < pix_screen_h; j++)  
		{
			for (var i = 0; i <pix_screen_w; i++) 
			{
				var p1=(j*pix_screen_w)+i;

				var ii =(i*stepr_x)<<0;
				var ii2=((i+1)*stepr_x)<<0;

				var jj=(j*stepr_y)<<0;
				var jj2=((j+1)*stepr_y)<<0;
				
				x_step[p1] = ii2-ii;
				y_step[p1] = jj2-jj;	
			}
		}
		renderstepper=1;
	}	
	if(renderstepper==1)
	{	
			
		var stepr_x =(im_w/pix_screen_w);
		var stepr_y =(im_h/pix_screen_h);
			
		//yline_pos=0;
		var newy=yline_pos+4; // render now in steps of 8
		var lastlines=false;
		if( newy > pix_screen_h-1)
		{
			newy = pix_screen_h;
			lastlines=true;
		}
			
		for (var j = yline_pos; j < newy; j++) // 
		{
			for (var i = 0; i < pix_screen_w; i++) 
			{

					var p0=(j*pix_screen_w)+i; // step buff			
					//var p1=(j*pix_screen_w)+i;
				
					var ii=(i*stepr_x)<<0;
					var jj=(j*stepr_y)<<0;
					var p2=(jj*im_w)+ii;
				
					var r1=pix_r[p2];
					var g1=pix_g[p2];
					var b1=pix_b[p2];
					var dc=1;

					for (var cj = 0; cj < (y_step[p0]); cj++) 
					{				
						for (var ci = 0; ci < (x_step[p0]); ci++) 
						{
							var tpos=(p2+ci) +ytable_im_w[cj]; 
							r1 += pix_r[tpos];
							g1 += pix_g[tpos];
							b1 += pix_b[tpos];
							dc++;
						}
					}
				
					pix_screen_r[p0]= (r1/dc)<<0;
					pix_screen_g[p0]= (g1/dc)<<0;
					pix_screen_b[p0]= (b1/dc)<<0;

			}
		} 
		if(lastlines==true)	
		{		
				yline_pos=0;
				c_timesrendered++;
				
				//test=c_timesrendered;
				
				if(allrendered==1)
				{
					if(logita==0)
					{
						console.log("Iteration "+iteration+ " drawn");
						iteration++;
						logita=1;
					} 
					waittimer++;
				}
				if(allrendered==1 && waittimer==3) // !!!! 55
				{
					if(doonce==0){fxpreview();doonce=1;} 
				}
				if(allrendered==1 && waittimer>7) // !!!! res e t
				{ 
					my_nimz=0;
					c_timesrendered=0;
					allrendered=0;
					waittimer=0;
					logita=0;
				} // reset drawing
				
				
				
		}
		else{yline_pos=newy;}			
			
	}
}

		b_g[0] = mycol_x3[1];
		b_b[0] = mycol_x3[2];
		
		b_r[1] = mycol_x3[3];
		b_g[1] = mycol_x3[4];
		b_b[1] = mycol_x3[5];
		
		b_r[2] = mycol_x3[6];
		b_g[2] = mycol_x3[7];
		b_b[2] = mycol_x3[8];
	}
	
		
	if(doonce==1 && my_random(6)==0) // random palette
	{
		pal_num= 9; //9
		b_pal=3; //2 3 random palettes
		for (var i = 0; i < b_pal; i++)
		{	
			blokecol=2  + my_random(3);
			b_r[i] = my_random(blokecol); 
			b_g[i] = my_random(blokecol); 
			b_b[i] = my_random(blokecol); 
			
			while(b_r[i]==b_g[i] && b_r[i]==b_b[i])
			{
				blokecol=2  + my_random(3);
				b_r[i] = my_random(blokecol); 
				b_g[i] = my_random(blokecol); 
				b_b[i] = my_random(blokecol); 				
			}
			
		}
		var gg=my_random(4);
		if(gg==1)
		{
			b_r[1] = b_g[0]; 
			b_g[1] = b_r[0]; 
			b_b[1] = b_b[0]; 
		}
		else if(gg==2)
		{
			b_r[1] = b_r[0]; 
			b_g[1] = b_b[0]; 
			b_b[1] = b_g[0]; 
		}
		else if(gg==3)
		{
			b_r[1] = b_b[0]; 
			b_g[1] = b_g[0]; 
			b_b[1] = b_r[0]; 
		}
		if(b_r[0]==0 && b_g[0]==0 & b_b[0]==0)
		{
			b_r[0]=1;
			b_g[0]=0;
			b_b[0]=1;			
		}
		if(b_r[1]==0 && b_g[1]==0 & b_b[1]==0)
		{
			b_r[1]=0;
			b_g[1]=1;
			b_b[1]=1;			
		}
		if(b_r[2]==0 && b_g[2]==0 & b_b[2]==0)
		{
			b_r[2]=1;
			b_g[2]=1;
			b_b[2]=0;			
		}
	}		 
		
		
		fx_7b_init(i_w,i_h);
		ybigstepper=0;
		
		/*
		if(pal_num==6)
		{
		test="<br><br> "+b_r[0]+", "+b_g[0]+", "+b_b[0]+", <nbsp>  <nbsp>  "
						+b_r[1]+", "+b_g[1]+", "+b_b[1]+", <nbsp>  <nbsp>  //<br><br>";
							
		}
		else if(pal_num==9)
		{
		test="<br><br> "+b_r[0]+", "+b_g[0]+", "+b_b[0]+", <nbsp>  <nbsp>  "
						+b_r[1]+", "+b_g[1]+", "+b_b[1]+", <nbsp>  <nbsp>  " 
						+b_r[2]+", "+b_g[2]+", "+b_b[2]+", <nbsp>   // <nbsp> <br><br>";
			
		}*/
	
		allrendered=0;

	}
	
	else if(my_nimz==1)

	 	my_nimz=2;

	else if(my_nimz==2)
	{
			
		// fastfader_white_01(i_w,i_h,pixi_r,pixi_g,pixi_b, 1);
	
		var ff=fastfader_white_02(fade_loop,64,i_w,i_h,pixi_r,pixi_g,pixi_b, 1);

		//my_nimz=3;
	}
	
	
	else if(my_nimz==3)
	{
		fx_7b(i_w,i_h,pixi_r,pixi_g,pixi_b);

		x_times++;
		if(x_times>better_times)
		{
			x_times=0;
			my_nimz=4;			
		}		
	}
	
	else if(my_nimz==4)
	{ 

		// draw bigger
		
		var ybigstep=ybigstepper+64;
		if (ybigstep>i_h-1){ ybigstep=i_h-1; }
		
		for (var j=ybigstepper; j < ybigstep ; j++ )
		{
			var jj=((j*i_deel)*im_w)<<0;//j*im_w;//
			for (var i=0; i< i_w-1 ; i++ )
			{		
				var p1= ((i_w*j)+i)<<0;
				var p2= (jj +  (i*i_deel))<<0; //(j*im_w)
				for (var y=0; y < i_deel ; y++ )
				{
					for (var x=0; x < i_deel ; x++ )
					{
						var p3= (p2 + (y*im_w))<<0; 
						pix_r[p3+x] = pixi_r[p1];
						pix_g[p3+x] = pixi_g[p1];
						pix_b[p3+x] = pixi_b[p1];				
					}
				}
			}
		}
		ybigstepper+=64;
		
		if (ybigstep==i_h-1 || ybigstepper>(i_h-1))
		{
			ybigstepper=0;
			my_nimz=2;	
			draw_loop++;
			if(draw_loop>15)
			{
				draw_loop=0;
				my_nimz=5;	
			}			
		}

		
	}
		 
	else if(my_nimz==5)
	{
		allrendered=1;
	}

}
 
function g_drawline3(x1, y1, x2, y2, r,g,b, imw, imh, p_r, p_g, p_b)
{
	var dx = Math.abs(x2 - x1);
	var dy = Math.abs(y2 - y1);
	var sx = (x1 < x2) ? 1 : -1; 
	var	sy = (y1 < y2) ? 1 : -1; 
	var er = (dx>dy ? dx : -dy)/2;
	while (true)
	{
		var p=x1+(y1* imw);
		
		//if(pix_zcheck[p]==1)
		//{
			graph_drawpoint3(x1,y1, imw, imh, r,g,b, p_r, p_g, p_b);
		//}
 
		if (x1 === x2 && y1 === y2) break;
		var e2 = er;
		if (e2 > -dx){er -= dy; x1 += sx;}
		if (e2 < dy){er += dx; y1 += sy;}
	}
}

function graph_drawpoint3(x,y, w, h, r,g,b, buf_r, buf_g, buf_b)
{
	if(x>-1 && y>-1 && x<w && y<h)
	{
			buf_r[(y*w)+x]=r;
			buf_g[(y*w)+x]=g;
			buf_b[(y*w)+x]=b;
	}	
}
