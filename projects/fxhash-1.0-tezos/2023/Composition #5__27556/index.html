	<script id="fxhash-snippet">
      //---- do not edit the following code (you can indent as you wish)
      let search = new URLSearchParams(window.location.search)
      let alphabet = "123456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ"
      let b58dec = str=>[...str].reduce((p,c)=>p*alphabet.length+alphabet.indexOf(c)|0, 0)
      // make fxrand from hash
      var fxhash = search.get('fxhash') || "oo" + Array(49).fill(0).map(_=>alphabet[(Math.random()*alphabet.length)|0]).join('')
      let fxhashTrunc = fxhash.slice(2)
      let regex = new RegExp(".{" + ((fxhash.length/4)|0) + "}", 'g')
      let hashes = fxhashTrunc.match(regex).map(h => b58dec(h))
      let sfc32 = (a, b, c, d) => {
        return () => {
          a |= 0; b |= 0; c |= 0; d |= 0
          var t = (a + b | 0) + d | 0
          d = d + 1 | 0
          a = b ^ b >>> 9
          b = c + (c << 3) | 0
          c = c << 21 | c >>> 11
          c = c + t | 0
          return (t >>> 0) / 4294967296
        }
      }
      var fxrand = sfc32(...hashes)
      // make fxrandminter from minter address
      var fxminter = search.get('fxminter') || "tz1" + Array(33).fill(0).map(_=>alphabet[(Math.random()*alphabet.length)|0]).join('')
      let fxminterTrunc = fxminter.slice(3)
      regex = new RegExp(".{" + ((fxminterTrunc.length/4)|0) + "}", 'g')
      hashes = fxminterTrunc.match(regex).map(h => b58dec(h))
      var fxrandminter = sfc32(...hashes)

      // true if preview mode active, false otherwise
      // you can append preview=1 to the URL to simulate preview active
      var isFxpreview = search.get('preview') === "1"
      // call this method to trigger the preview
      function fxpreview() {
        window.dispatchEvent(new Event("fxhash-preview"))
        setTimeout(() => fxpreview(), 500)
      }
      //
      // NEW: v2 of the fxhash SDK lol
      //
      // get the byte params from the URL
      let fxparams = search.get('fxparams')
      fxparams = fxparams ? fxparams.replace("0x", "") : fxparams

      // the parameter processor, used to parse fxparams
      const processors = {
        number: {
          deserialize: (input) => {
            const view = new DataView(new ArrayBuffer(8))
            for (let i = 0; i < 8; i++) {
              view.setUint8(i, parseInt(input.substring(i * 2, i * 2 + 2), 16))
            }
            return view.getFloat64(0)
          },
          bytesLength: () => 8,
          constrain: (value, definition) =>  {
            let min = Number.MIN_SAFE_INTEGER
            if (typeof definition.options?.min !== "undefined")
              min = Number(definition.options.min)
            let max = Number.MAX_SAFE_INTEGER
            if (typeof definition.options?.max !== "undefined")
              max = Number(definition.options.max)
            max = Math.min(max, Number.MAX_SAFE_INTEGER)
            min = Math.max(min, Number.MIN_SAFE_INTEGER)
            const v = Math.min(Math.max(value, min), max)
            return v;
          },
          random: (definition) => {
            let min = Number.MIN_SAFE_INTEGER
            if (typeof definition.options?.min !== "undefined")
              min = Number(definition.options.min)
            let max = Number.MAX_SAFE_INTEGER
            if (typeof definition.options?.max !== "undefined")
              max = Number(definition.options.max)
            max = Math.min(max, Number.MAX_SAFE_INTEGER)
            min = Math.max(min, Number.MIN_SAFE_INTEGER)
            const v = Math.random() * (max - min) + min
            if (definition?.options?.step) {
              const t = 1.0 / definition?.options?.step
              return Math.round(v * t) / t
            }
            return v; 
          },
        },
        bigint: {
          deserialize: (input) => {
            const view = new DataView(new ArrayBuffer(8))
            for (let i = 0; i < 8; i++) {
              view.setUint8(i, parseInt(input.substring(i * 2, i * 2 + 2), 16))
            }
            return view.getBigInt64(0)
          },
          bytesLength: () => 8,
          random: (definition) => {
            const MIN_SAFE_INT64 = -9223372036854775808n
            const MAX_SAFE_INT64 = 9223372036854775807n
            let min = MIN_SAFE_INT64
            let max = MAX_SAFE_INT64
            if (typeof definition.options?.min !== "undefined")
              min = BigInt(definition.options.min)
            if (typeof definition.options?.max !== "undefined")
              max = BigInt(definition.options.max)
            const range = max - min
            const bits = range.toString(2).length
            let random
            do {
              random = BigInt(
                "0b" +
                  Array.from(
                    crypto.getRandomValues(new Uint8Array(Math.ceil(bits / 8)))
                  )
                    .map((b) => b.toString(2).padStart(8, "0"))
                    .join("")
              )
            } while (random > range)
            return random + min
          },
        },
        boolean: {
          // if value is "00" -> 0 -> false, otherwise we consider it's 1
          deserialize: (input) => {
            return input === "00" ? false : true
          },
          bytesLength: () => 1,
          random: () => Math.random() < 0.5,
        },
        color: {
          deserialize: (input) => input,
          bytesLength: () => 4,
          transform: (input) => {
            const r = parseInt(input.slice(0,2), 16)
            const g = parseInt(input.slice(2,4), 16)
            const b = parseInt(input.slice(4,6), 16)
            const a = parseInt(input.slice(6,8), 16)
            return {
              hex: {
                rgb: '#' + input.slice(0,6),
                rgba: '#' + input,
              },
              obj: {
                rgb: { r, g, b},
                rgba: { r, g, b, a},
              },
              arr: {
                rgb: [r,g,b],
                rgba: [r,g,b,a],
              }
            }
          },
          constrain: (value, definition) => {
            const hex = value.replace("#", "")
            return hex.slice(0, 8).padEnd(8, "f")
          },
          random: () =>
            `${[...Array(8)]
              .map(() => Math.floor(Math.random() * 16).toString(16))
              .join("")}`,
          },
        string: {
          deserialize: (input) => {
            const hx = input.match(/.{1,4}/g) || []
            let rtn = ""
            for (let i = 0; i < hx.length; i++) {
              const int = parseInt(hx[i], 16)
              if (int === 0) break
              rtn += String.fromCharCode(int)
            }
            return rtn
          },
          bytesLength: (options) => {
            if (typeof options?.maxLength !== "undefined")
                return Number(options.maxLength) * 2
            return 64 * 2
          },
          constrain: (value, definition) => {
            let min = 0
            if (typeof definition.options?.minLength !== "undefined")
              min = definition.options.minLength
            let max = 64
            if (typeof definition.options?.maxLength !== "undefined")
              max = definition.options.maxLength
            let v = value.slice(0, max);
            if (v.length < min) {
              return v.padEnd(min)
            }
            return v;
          },
          random: (definition) => {
            let min = 0
            if (typeof definition.options?.minLength !== "undefined")
              min = definition.options.minLength
            let max = 64
            if (typeof definition.options?.maxLength !== "undefined")
              max = definition.options.maxLength
            const length = Math.round(Math.random() * (max - min) + min)
            return [...Array(length)]
              .map((i) => (~~(Math.random() * 36)).toString(36))
              .join("")
          },
        },
        select: {
          deserialize: (input, definition) => {
            return definition.options.options[parseInt(input, 16)] || definition.default
          },
          bytesLength: () => 1,
          constrain: (value, definition) => {
            if(definition.options.options.includes(value)) {
              return value;
            }
            return definition.options.options[0]
          },
          random: (definition) => {
            const index = Math.round(
              Math.random() * (definition?.options?.options?.length - 1) + 0
            )
            return definition?.options?.options[index]
          },
        }
      }

      // takes the parameters as bytes and outputs an object with the
      // deserialized parameters, identified by their id in an object
      const deserializeParams = (bytes, definition) => {
        const params = {}
        for (const def of definition) {
          const processor = processors[def.type]
          // if we don't have any parameters defined in the URL, set the 
          // default value and move on
          if (!bytes) {
            let v
            if (typeof def.default === "undefined") v = processor.random(def)
            else v = def.default
            params[def.id] = processor.constrain?.(v, def) || v;
            continue
          }
          // extract the length from the bytes & shift the initial bytes string
          const valueBytes = bytes.substring(0, processor.bytesLength(def?.options) * 2)
          bytes = bytes.substring(processor.bytesLength(def?.options) * 2)
          // deserialize the bytes into the params
          const value =  processor.deserialize(valueBytes, def)
          params[def.id] = processor.constrain?.(value, def) || value;
        }
        return params
      }

      const transformParamValues = (values, definitions) => {
        const paramValues = {}
        for (const def of definitions) {
          const processor = processors[def.type]
          const value = values[def.id]
          // deserialize the bytes into the params
          paramValues[def.id] = processor.transform ? processor.transform(value) : value;
        }
        return paramValues; 
      }

      window.$fx = {
        _version: "3.0.1",
        _processors: processors,
        // where params def & features will be stored
        _params: undefined,
        _features: undefined,
        // where the parameter values are stored
        _paramValues: {},

        hash: fxhash,
        rand: fxrand,

        minter: fxminter,
        randminter: fxrandminter,

        preview: fxpreview,
        isPreview: isFxpreview,
        params: function(definition) {
          this._params = definition
          this._rawValues = deserializeParams(fxparams, definition)
          this._paramValues = transformParamValues(this._rawValues, definition)
        },
        features: function(features) {
          this._features = features
        },
        getFeature: function(id) {
          return this._features[id]
        },
        getFeatures: function() {
          return this._features
        },
        getParam: function(id) {
          return this._paramValues[id]
        },
        getParams: function() {
          return this._paramValues
        },
        getRawParam: function(id) {
          return this._rawValues[id]
        },
        getRawParams: function() {
          return this._rawValues
        },
        getDefinitions: function() {
          return this._params;
        },
        stringifyParams: function(params) {
          return JSON.stringify(
            params,
            (key, value) => {
              if (typeof value === "bigint") return value.toString()
              return value
            }, 
            2,
          )
        }
        
      }
      window.addEventListener("message", (event) => {
        if (event.data === "fxhash_getInfo") {
          parent.postMessage({
            id: "fxhash_getInfo",
            data: { 
              version: window.$fx._version,
              hash: window.$fx.hash,
              features: window.$fx.getFeatures(),
              params: {
                definitions: window.$fx.getDefinitions(),
                values: window.$fx.getRawParams(),
              },
            },
          }, "*")
        }
      })
      // END NEW

      //---- /do not edit the following code
</script>

<script type="text/javascript">
	
  function init() {
        
    var clock = new THREE.Clock();
    window.addEventListener('resize', onWindowResize, false);

    var scene = new THREE.Scene();         
        
    var webGLRenderer = new THREE.WebGL1Renderer( { antialias: true } );
    webGLRenderer.setSize(window.innerWidth, window.innerHeight);
        
    const limits = 60;

    // create a camera
    var camera = new THREE.PerspectiveCamera(10, window.innerWidth / window.innerHeight, 0.5, 10000);
    camera.position.x = limits * 2;
    camera.position.y = limits * 2;
    camera.position.z = -limits * 2;
		
	var orbitControls = new THREE.OrbitControls(camera);
    orbitControls.autoRotate = true;
    orbitControls.autoRotateSpeed = 0.4;
    orbitControls.enabled = true;

    const iterations = 60;

    var dir = 0; 
    var deltaX = 0;
    var deltaY = 0;
    var deltaZ = 0;
    var deltaXmin = 0;
    var deltaYmin = 0;
    var deltaZmin = 0;
    var deltaXmax = 0;
    var deltaYmax = 0;
    var deltaZmax = 0;
    var sph;
    const beatingIncrement = 0.008;
    let scaleThreshold = false;
    dbPos = [];
        
    // background, matcap structure, matcap cages, matcap spheres
    let palette1 = [0x7d865d, 164, 146, 161];   // autumn
    let palette2 = [0x091b24, 8, 133, 101];    // jungle
    let palette3 = [0x918666, 100, 146, 92];    // desert
    let palette4 = [0xe7b78b, 148, 165, 77];   // pop
    let palette5 = [0x382d45, 129, 108, 121];   // prune
    let palette6 = [0xdcd8d0, 2, 33, 143];      // graphic
    let palette7 = [0x43634c, 55, 111, 59];     // nature
    let palette8 = [0x000000, 155, 146, 143];   // graphic neg
    let palette9 = [0x244c48, 58, 48, 68];      // water green acid
    let palette10 = [0x01273f, 37, 12, 117];    // waterfall
    let palette11 = [0x5c0d0b, 143, 152, 161];   // bloody red
    let palette12 = [0x282314, 107, 102, 101];  // tree
		
    let palName = [palette1, palette2, palette3, palette4, palette5, palette6, palette7, palette8, palette9, palette10, palette11, palette12];
	var pal = getRandomInt(12);
    var chosenPal = palName[pal]; 
        
    scene.background = new THREE.Color(new THREE.Color(chosenPal[0]));

	const loader = new THREE.TextureLoader();
        
    var texture1 = loader.load("./textures/mc" + chosenPal[1] + ".png"); 
    var texture2 = loader.load("./textures/mc" + chosenPal[2] + ".png");
	var texture3 = loader.load("./textures/mc" + chosenPal[3] + ".png");
		
	const material1 = new THREE.MeshMatcapMaterial({ side: THREE.DoubleSide, matcap: texture1 });
    const material2 = new THREE.MeshMatcapMaterial({ side: THREE.DoubleSide, matcap: texture2, transparent: true, opacity: .5 });
	const sphMaterial =  new THREE.MeshMatcapMaterial({ side: THREE.DoubleSide, matcap: texture3 });

    for (var i = 0; i < iterations; i++ ) {
        var curPos = new THREE.Vector3( deltaX, deltaY, deltaZ );
        var dir = getRandomInt(6) + 1; // 1 = +x | 2 = -x | 3 = +y | 4 = -y | 5 = +z | 6 = -z
        var dist = 5.2;

        if (Math.abs(deltaX) < limits/2 && Math.abs(deltaY) < limits/2 && Math.abs(deltaZ) < limits/2) {
            if (dir == 1) {
                deltaX += dist;
                if (deltaX > deltaXmax) deltaXmax = deltaX;
            }
            if (dir == 2) {
                deltaX -= dist;    
                if (deltaX < deltaXmin) deltaXmin = deltaX;
            }                    
            if (dir == 3) {
                deltaY += dist;
                if (deltaY > deltaYmax) deltaYmax = deltaY;
            }
            if (dir == 4) {
                deltaY -= dist;    
                if (deltaY < deltaYmin) deltaYmin = deltaY;
            }             
            if (dir == 5) {
                deltaZ += dist;
                if (deltaZ > deltaZmax) deltaZmax = deltaZ;
            }
            if (dir == 6) {
                deltaZ -= dist;    
                if (deltaZ < deltaZmin) deltaZmin = deltaZ;
            }        
        
            var newPos = new THREE.Vector3( deltaX, deltaY, deltaZ );
            var chk = verifyPos(newPos.toArray());

            if (chk == -1) {
                dbPos.push(newPos.toArray());
                var sphProb = getRandomInt(7);                
                const geomSph = new THREE.SphereGeometry( 1.5, 60, 60 ); 
                const innerSphere = new THREE.Mesh( geomSph, sphMaterial );
                innerSphere.position.set(deltaX, deltaY, deltaZ);
                innerSphere.name = "inner" + i;
                if (sphProb == 0) { scene.add( innerSphere ); }
          
                var cuboid = createCube(sphProb);
                
                cuboid.position.set(deltaX, deltaY, deltaZ);
                scene.add(cuboid);
                
            } 
        } else {
            deltaX = 0;
            deltaY = 0;
            deltaZ = 0;
        }
    }

    const tgtx = (deltaXmin + deltaXmax) / 2;
    const tgty = (deltaYmin + deltaYmax) / 2;
    const tgtz = (deltaZmin + deltaZmax) / 2;

    var cameraTarget = new THREE.Mesh( new THREE.BoxGeometry(0,0,0));
    cameraTarget.position.set(tgtx, tgty, tgtz); 

    // add the output of the renderer to the html element
    document.getElementById("WebGL-output").appendChild(webGLRenderer.domElement);

    render();

    function render() {      
        var delta = clock.getDelta(); 
        orbitControls.update(delta); 

        camera.lookAt( cameraTarget.position );

        scene.traverse(function (e) {        
            if (e instanceof THREE.Mesh && e.name.charAt(0) == "i") {
                if (e.scale.x < 1.4 && !scaleThreshold) {
                    e.scale.x += beatingIncrement * 2;
                    e.scale.y += beatingIncrement * 2;
                    e.scale.z += beatingIncrement * 2;
                    if (e.scale.x >= 1.4) {
                        scaleThreshold = true;
                        sleep(50);
                    }
                }
                else if (scaleThreshold) {
                    e.scale.x -= beatingIncrement;
                    e.scale.y -= beatingIncrement;
                    e.scale.z -= beatingIncrement;
                    if (e.scale.x <= 1) {
                        scaleThreshold = false;
                        sleep(50);
                    }
                }           
            }          
        });

      // render using requestAnimationFrame
      requestAnimationFrame(render);      
      webGLRenderer.render(scene, camera);
    }
        
    function verifyPos(pos) {
        var i, j, current;      
        for(i = 0; i < dbPos.length; ++i){
            current = dbPos[i];
            for(j = 0; j < pos.length && Math.trunc(pos[j]) === Math.trunc(current[j]); ++j) {
                if(j === pos.length-1) { 
                    return i; 
                }
            }
        }
        return -1;
    } 

    function sleep(milliseconds) {
        const date = Date.now();
        let currentDate = null;
        do {
            currentDate = Date.now();
        } while (currentDate - date < milliseconds);
    }

    function createCube(sphProb) {
        var cubeGroup  = new THREE.Group();
                
        var wallFront1 = createWall1(sphProb);
        rotateObject(wallFront1, degreeX=0, degreeY=90, degreeZ=180);
        wallFront1.position.set(2.3, 2.5, -2.5);
        cubeGroup.add(wallFront1);

        var wallFront2 = createWall2(sphProb);
        rotateObject(wallFront2, degreeX=180, degreeY=-90, degreeZ=0);
        wallFront2.position.set(-2.5, 2.5, 2.5);
        cubeGroup.add(wallFront2);

        var wallSide1 = createWall3(sphProb);
        rotateObject(wallSide1, degreeX=0, degreeY=0, degreeZ=180);
        wallSide1.position.set(2.4, 2.5, 2.4);                        
        cubeGroup.add(wallSide1);

        var wallSide2 = createWall4(sphProb);
        rotateObject(wallSide2, degreeX=180, degreeY=0, degreeZ=0);
        wallSide2.position.set(-2.6, 2.5, -2.4);                        
        cubeGroup.add(wallSide2);
                                
        var wallTop = createWall5(sphProb);
        rotateObject(wallTop, degreeX=-90, degreeY=0, degreeZ=0);
        wallTop.position.set(-2.6, 2.4, 2.5);                        
        cubeGroup.add(wallTop);
                                
        var wallBottom = createWall6(sphProb);
        rotateObject(wallBottom, degreeX=-90, degreeY=0, degreeZ=0);
        wallBottom.position.set(-2.6, -2.5, 2.5);                        
        cubeGroup.add(wallBottom);

        rotateObject(cubeGroup, getRandomInt(4)*90, getRandomInt(4)*90, getRandomInt(4)*90);
        return cubeGroup;
    }

    function createWall1(sphProb) {
          const shape = new THREE.Shape();
          shape.moveTo(2.85, 0);
          shape.lineTo(2.94, 0);
          shape.lineTo(2.94, 0.65);
          shape.lineTo(2.82, 1.34);
          shape.lineTo(4.6, 0.5);
          shape.lineTo(5, 0.5);
          shape.lineTo(5, 0.77);
          shape.lineTo(4.5, 0.77);
          shape.lineTo(2.81, 1.53); 
          shape.lineTo(2.66, 3.25);
          shape.lineTo(3.91, 3.34);
          shape.lineTo(5, 3.34);
          shape.lineTo(5, 3.65);
          shape.lineTo(4.17, 3.65);
          shape.lineTo(2.64, 3.43);
          shape.lineTo(2.5, 4.25);
          shape.lineTo(2.5, 5);
          shape.lineTo(1.5, 5);
          shape.lineTo(1.5, 4.5);
          shape.lineTo(1.92, 3.41);
          shape.lineTo(0.49, 3.27);
          shape.lineTo(0, 3.27);
          shape.lineTo(0, 3.15);
          shape.lineTo(0.76, 3.15);
          shape.lineTo(1.96, 3.23); 
          shape.lineTo(2.4, 1.68);
          shape.lineTo(0.26, 2.33);
          shape.lineTo(0, 2.33);
          shape.lineTo(0, 2);
          shape.lineTo(0.85, 2);
          shape.lineTo(2.45, 1.49);
          shape.lineTo(2.85, 0.45);
          shape.lineTo(2.85, 0);  
          
          const extrudeSettings = {
              bevelEnabled: false,
              depth: 0.1
          }
          
          const wf1Geom = new THREE.ExtrudeGeometry( shape, extrudeSettings );
          if (sphProb > 0) { var wf1 = new THREE.Mesh( wf1Geom, material1 ); }
          else { var wf1 = new THREE.Mesh( wf1Geom, material2 ); }

          return wf1;
      }

    function createWall2(sphProb) {
          const shape = new THREE.Shape();
          shape.moveTo(1, 0);
          shape.lineTo(1.09, 0);
          shape.lineTo(1.09, 0.38);
          shape.lineTo(2.26, 3.05);
          shape.lineTo(4.19, 2);
          shape.lineTo(5, 2);
          shape.lineTo(5, 3);
          shape.lineTo(4.57, 3);
          shape.lineTo(2.43, 3.51);
          shape.lineTo(3, 4.5);
          shape.lineTo(3, 5);
          shape.lineTo(2, 5);
          shape.lineTo(2, 4.78);
          shape.lineTo(1.73, 3.65);
          shape.lineTo(0.32, 4);
          shape.lineTo(0, 4);
          shape.lineTo(0, 3.89);
          shape.lineTo(0.33, 3.89);
          shape.lineTo(1.65, 3.28);
          shape.lineTo(1, 1.5);
          shape.lineTo(1, 0);

          const extrudeSettings = {
              bevelEnabled: false, 
              depth: 0.1
          }

          const wf2Geom = new THREE.ExtrudeGeometry( shape, extrudeSettings );
          if (sphProb > 0) { var wf2 = new THREE.Mesh( wf2Geom, material1 ); }
          else { var wf2 = new THREE.Mesh( wf2Geom, material2 ); }

          return wf2;
      }

    function createWall3(sphProb) {
          const shape = new THREE.Shape();
          shape.moveTo(2.8, 0);
          shape.lineTo(3.5, 0);
          shape.lineTo(3.5, 0.65);
          shape.lineTo(2.17, 1.98);
          shape.lineTo(3.38, 2.84);
          shape.lineTo(4, 0.42);
          shape.lineTo(4, 0);
          shape.lineTo(4.33, 0);
          shape.lineTo(4.33, 0.66);
          shape.lineTo(3.6, 3);
          shape.lineTo(4.61, 3.89);
          shape.lineTo(4.9, 3.89);
          shape.lineTo(4.9, 4);
          shape.lineTo(4.56, 4);
          shape.lineTo(3.5, 3.29);
          shape.lineTo(3, 4.67);
          shape.lineTo(3, 5);
          shape.lineTo(2.84, 5);
          shape.lineTo(2.84, 4.73);
