<!DOCTYPE html>
<html>
  <head>
    <title>Space Clock</title>
    <script id="fxhash-snippet">
      let alphabet = "123456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ"
      var fxhash = new URLSearchParams(window.location.search).get('fxhash')
      let b58dec = (str) => str.split('').reduce((p,c,i) => p + alphabet.indexOf(c) * (Math.pow(alphabet.length, str.length-i-1)), 0)
      let fxhashTrunc = fxhash.slice(2)
      let regex = new RegExp(".{" + ((fxhashTrunc.length/4)|0) + "}", 'g')
      let hashes = fxhashTrunc.match(regex).map(h => b58dec(h))
      let sfc32 = (a, b, c, d) => {
        return () => {
          a |= 0; b |= 0; c |= 0; d |= 0
          var t = (a + b | 0) + d | 0
          d = d + 1 | 0
          a = b ^ b >>> 9
          b = c + (c << 3) | 0
          c = c << 21 | c >>> 11
          c = c + t | 0
          return (t >>> 0) / 4294967296
        }
      }
      var fxrand = sfc32(...hashes)
      // used to get features during token mint
      window.addEventListener("message", (event) => {
        if (event.data === "fxhash_getFeatures") {
          parent.postMessage({
            id: "fxhash_getFeatures",
            data: window.$fxhashFeatures
          }, "*")
        }
      })
</script>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body style="background-color: #fff;" onload="clock();" onunload="stop();"> 

    <div class="clockbg">
      <span id="clock"></span>
      <img src="./clockbg.png">
    </div>

    <script type="text/javascript">
      var tick;
      function stop() {
      clearTimeout(tick);
      }
      function clock() {
      var ut=new Date();
      var h,m,s;
      var time="        ";
      h=ut.getHours();
      m=ut.getMinutes();
      s=ut.getSeconds();
      if(s<=9) s="0"+s;
      if(m<=9) m="0"+m;
      if(h<=9) h="0"+h;
      time+=h+":"+m+":"+s;
      document.getElementById('clock').innerHTML=time;
      tick=setTimeout("clock()",1000); 
      }

      const setBg = () => {
        const randomColor = Math.floor(fxrand()*16777215).toString(16);
        document.getElementById("clock").style.color = "#" + randomColor;
      }
      setBg();
    </script>
  </body></html>
