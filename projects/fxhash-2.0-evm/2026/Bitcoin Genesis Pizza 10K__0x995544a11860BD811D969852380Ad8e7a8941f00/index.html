<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Bitcoin Genesis Pizza 10K</title>

<!-- fxhash required: features extracted via $fx.features() -->
<script id="fxhash-snippet" src="./fxhash.js"></script>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%; height: 100%;
  background: #0a0805;
  overflow: hidden;
  font-family: 'Courier New', 'Lucida Console', monospace;
}

canvas {
  position: fixed;
  top: 0; left: 0;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

/* CRT scanlines overlay */
.scanlines {
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,0.22) 2px,
    rgba(0,0,0,0.22) 4px
  );
  pointer-events: none;
  z-index: 10;
  mix-blend-mode: multiply;
}

/* CRT vignette + curve */
.crt-curve {
  position: fixed;
  inset: 0;
  background: radial-gradient(
    ellipse at center,
    transparent 50%,
    rgba(0,0,0,0.55) 88%,
    rgba(0,0,0,0.85) 100%
  );
  pointer-events: none;
  z-index: 11;
}

/* Paper grain (catalog feel) */
.paper {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 9;
  opacity: 0.06;
  mix-blend-mode: overlay;
  background-image:
    radial-gradient(circle at 23% 47%, rgba(120,80,40,0.7) 0%, transparent 40%),
    radial-gradient(circle at 67% 23%, rgba(180,140,80,0.5) 0%, transparent 35%),
    radial-gradient(circle at 13% 87%, rgba(80,50,20,0.6) 0%, transparent 30%),
    radial-gradient(circle at 89% 73%, rgba(160,110,60,0.4) 0%, transparent 30%);
}

/* Glitch line */
.glitch-line {
  position: fixed;
  left: 0; width: 100%;
  height: 2px;
  background: rgba(255,80,80,0.5);
  mix-blend-mode: screen;
  pointer-events: none;
  z-index: 12;
  opacity: 0;
}

/* HUD overlay */
.hud {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 8;
  padding: clamp(12px, 2.5vw, 28px);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.hud-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 1em; }
.hud-row.bottom { align-items: flex-end; }

/* Title block (top-left) */
.title-block {
  font-family: 'Courier New', monospace;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  line-height: 1.7;
}
.title-block .t1 {
  font-size: clamp(11px, 2.1vw, 18px);
  font-weight: 900;
  letter-spacing: 0.22em;
}
.title-block .t2 {
  font-size: clamp(7px, 1.2vw, 10px);
  letter-spacing: 0.32em;
  margin-top: 0.2em;
}
.title-block .t3 {
  font-size: clamp(6px, 1vw, 9px);
  letter-spacing: 0.4em;
  margin-top: 0.3em;
  opacity: 0.6;
}

/* Stats (top-right) */
.stats-block {
  text-align: right;
  font-size: clamp(7px, 1.1vw, 10px);
  letter-spacing: 0.15em;
  line-height: 1.9;
  font-family: 'Courier New', monospace;
}
.stats-block .stat-row { display: flex; justify-content: flex-end; gap: 0.6em; }
.stats-block .stat-label { opacity: 0.5; }

/* Bottom-left: catalog info */
.catalog-block {
  font-size: clamp(6px, 0.9vw, 9px);
  letter-spacing: 0.22em;
  line-height: 1.9;
  font-family: 'Courier New', monospace;
  opacity: 0.7;
  text-transform: uppercase;
}

/* Bottom-right: credit */
.credit-block {
  text-align: right;
  font-size: clamp(6px, 0.9vw, 9px);
  letter-spacing: 0.25em;
  line-height: 1.9;
  font-family: 'Courier New', monospace;
  opacity: 0.6;
  text-transform: uppercase;
}

.blink { animation: blk 1.1s step-end infinite; }
@keyframes blk { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

/* Catalog corner markers */
.corner {
  position: fixed;
  width: 30px; height: 30px;
  pointer-events: none;
  z-index: 8;
}
.corner.tl { top: 14px; left: 14px; border-top: 1px solid currentColor; border-left: 1px solid currentColor; }
.corner.tr { top: 14px; right: 14px; border-top: 1px solid currentColor; border-right: 1px solid currentColor; }
.corner.bl { bottom: 14px; left: 14px; border-bottom: 1px solid currentColor; border-left: 1px solid currentColor; }
.corner.br { bottom: 14px; right: 14px; border-bottom: 1px solid currentColor; border-right: 1px solid currentColor; }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div class="paper"></div>
<div class="scanlines"></div>
<div class="crt-curve"></div>
<div class="glitch-line" id="glitch"></div>

<div class="corner tl" id="cTL"></div>
<div class="corner tr" id="cTR"></div>
<div class="corner bl" id="cBL"></div>
<div class="corner br" id="cBR"></div>

<div class="hud">
  <div class="hud-row top">
    <div class="title-block" id="titleBlock">
      <div class="t1">BITCOIN GENESIS PIZZA</div>
      <div class="t2">10,000 EDITIONS · TEZOS BLOCKCHAIN</div>
      <div class="t3">MAY · 22 · 2010 <span class="blink">█</span></div>
    </div>
    <div class="stats-block" id="statsBlock">
      <div class="stat-row"><span class="stat-label">BLOCK</span> <span id="vBlock">000000</span></div>
      <div class="stat-row"><span class="stat-label">HASH</span> <span id="vHash">----</span></div>
      <div class="stat-row"><span class="stat-label">TEMP</span> <span id="vTemp">---</span>°F</div>
      <div class="stat-row"><span class="stat-label">SLICES</span> <span id="vSlice">0</span>/8</div>
    </div>
  </div>

  <div class="hud-row bottom">
    <div class="catalog-block" id="catalogBlock">
      <div>FILE_NO ░ <span id="vFile">000000</span></div>
      <div>PALETTE ░ <span id="vPal">----</span></div>
      <div>ERA &nbsp;&nbsp;&nbsp; ░ <span id="vEra">----</span></div>
    </div>
    <div class="credit-block" id="creditBlock">
      <div>YESOKLAB · 2026</div>
      <div>WRISTORY PROJECT</div>
      <div>10,000 BTC = 2 PIZZAS</div>
    </div>
  </div>
</div>

<script>
'use strict';

/* ─────────────────────────────────────────────────────────
   1. fxhash seeded random (deterministic per token)
   ───────────────────────────────────────────────────────── */
const rng = $fx.rand;

function pick(arr) {
  return arr[Math.floor(rng() * arr.length)];
}
function rndRange(min, max) {
  return min + rng() * (max - min);
}
function rndInt(min, max) {
  return Math.floor(rndRange(min, max + 1));
}

/* ─────────────────────────────────────────────────────────
   2. Palette definitions (8 distinct moods)
   ───────────────────────────────────────────────────────── */
const PALETTES = [
  { name: 'GENESIS',   bg: '#0e0700', plate: '#1a0d00', accent: '#ff9900', hot: '#ff5500', cool: '#ffd166', cheese: '#ffeaa0', pepperoni: '#cc2222', text: '#ffaa44', rarity: 'common' },
  { name: 'MIDNIGHT',  bg: '#000810', plate: '#001a22', accent: '#00ffcc', hot: '#ff0066', cool: '#0099ff', cheese: '#88ffee', pepperoni: '#ff3366', text: '#33ddcc', rarity: 'common' },
  { name: 'BLOODMOON', bg: '#0f0202', plate: '#1a0606', accent: '#ff2200', hot: '#ff4400', cool: '#ffaa00', cheese: '#ffcc88', pepperoni: '#880000', text: '#ff5544', rarity: 'rare' },
  { name: 'PHOSPHOR',  bg: '#001000', plate: '#002200', accent: '#00ff44', hot: '#88ff00', cool: '#00ff88', cheese: '#ddff88', pepperoni: '#226600', text: '#33ff66', rarity: 'rare' },
  { name: 'AMBER',     bg: '#0a0500', plate: '#1a0a00', accent: '#ffaa00', hot: '#ff7700', cool: '#ffdd44', cheese: '#fff0aa', pepperoni: '#aa2200', text: '#ffbb33', rarity: 'common' },
  { name: 'CYBERPUNK', bg: '#080014', plate: '#150022', accent: '#ff00ff', hot: '#00ffff', cool: '#ff0099', cheese: '#ffaaff', pepperoni: '#660099', text: '#ff66ff', rarity: 'epic' },
  { name: 'NUCLEAR',   bg: '#020e02', plate: '#062006', accent: '#aaff00', hot: '#ffff00', cool: '#00ff66', cheese: '#ddff66', pepperoni: '#447700', text: '#bbff33', rarity: 'epic' },
  { name: 'ARCHIVE',   bg: '#0a0a0a', plate: '#1a1a1a', accent: '#dddddd', hot: '#ff8844', cool: '#aaaaaa', cheese: '#eeeeee', pepperoni: '#444444', text: '#cccccc', rarity: 'legendary' },
];

/* ─────────────────────────────────────────────────────────
   3. Era options (timeline of crypto)
   ───────────────────────────────────────────────────────── */
const ERAS = [
  'GENESIS·2009',  'PIZZA·2010',  'SILK_RD·2011',  'HALVING_I·2012',
  'MTGOX·2014',    'HALVING_II·2016', 'MOON·2017',  'WINTER·2018',
  'HALVING_III·2020', 'ATH·2021',  'REKT·2022',     'REVIVAL·2023',
  'ETF·2024',      'NOW·2026'
];

/* ─────────────────────────────────────────────────────────
   4. Topping symbols (pixel-art glyphs)
   ───────────────────────────────────────────────────────── */
const TOPPING_SYMBOLS = ['◉', '⬡', '▲', '◈', '✦', '⊛', '⬢', '◆', '★', '⊕'];
const TOPPING_NAMES = {
  '◉': 'PEPPERONI', '⬡': 'OLIVE', '▲': 'BASIL',
  '◈': 'CRYSTAL',   '✦': 'STAR',  '⊛': 'BLOCK',
  '⬢': 'HASH',      '◆': 'GEM',   '★': 'GENESIS', '⊕': 'NODE'
};

/* ─────────────────────────────────────────────────────────
   5. Crust styles
   ───────────────────────────────────────────────────────── */
const CRUST_STYLES = ['CLASSIC', 'STUFFED', 'THIN', 'CHARRED', 'GOLDEN'];

/* ─────────────────────────────────────────────────────────
   6. Pick all features (deterministic from seed)
   ───────────────────────────────────────────────────────── */
const FEATURES = {
  palette: pick(PALETTES),
  era: pick(ERAS),
  sliceCount: rndInt(6, 8),
  crustStyle: pick(CRUST_STYLES),
  crustWidth: rndRange(0.10, 0.18),
  toppingSymbol: pick(TOPPING_SYMBOLS),
  toppingDensity: rndRange(0.5, 1.4),
  rotation: rng() * Math.PI * 2,
  hasGlitch: rng() > 0.4,
  hasPhosphor: rng() > 0.35,
  hasGrain: rng() > 0.2,
  hasHaloRing: rng() > 0.5,
  bitcoinPattern: pick(['SUBTLE', 'BOLD', 'MOSAIC']),
  noiseLevel: rndRange(0.05, 0.35),
  temp: rndInt(450, 950),
  blockNum: rndInt(0, 850000),
  fileNum: rndInt(1, 9999),
  hashHex: Array.from({length: 4}, () => '0123456789ABCDEF'[rndInt(0,15)]).join(''),
  pulseSpeed: rndRange(0.6, 1.8),
  driftAmount: rndRange(0.02, 0.06),
};

/* ─────────────────────────────────────────────────────────
   7. Expose features to fxhash
   ───────────────────────────────────────────────────────── */
$fx.features({
  'Palette':        FEATURES.palette.name,
  'Rarity':         FEATURES.palette.rarity,
  'Era':            FEATURES.era,
  'Slices':         FEATURES.sliceCount,
  'Crust':          FEATURES.crustStyle,
  'Topping':        TOPPING_NAMES[FEATURES.toppingSymbol] || 'CLASSIC',
  'Pattern':        FEATURES.bitcoinPattern,
  'Glitch':         FEATURES.hasGlitch ? 'YES' : 'NO',
  'Phosphor':       FEATURES.hasPhosphor ? 'YES' : 'NO',
  'Halo Ring':      FEATURES.hasHaloRing ? 'YES' : 'NO',
});

/* ─────────────────────────────────────────────────────────
   8. Apply palette to UI (HUD)
   ───────────────────────────────────────────────────────── */
const P = FEATURES.palette;
document.body.style.background = P.bg;
document.getElementById('titleBlock').style.color = P.accent;
document.getElementById('statsBlock').style.color = P.cool;
document.getElementById('catalogBlock').style.color = P.text;
document.getElementById('creditBlock').style.color = P.hot;
['cTL','cTR','cBL','cBR'].forEach(id => {
  document.getElementById(id).style.color = P.accent + 'aa';
});

// Fill HUD values
document.getElementById('vBlock').textContent = FEATURES.blockNum.toString().padStart(6,'0');
document.getElementById('vHash').textContent  = FEATURES.hashHex;
document.getElementById('vTemp').textContent  = FEATURES.temp;
document.getElementById('vSlice').textContent = FEATURES.sliceCount;
document.getElementById('vFile').textContent  = FEATURES.fileNum.toString().padStart(6,'0');
document.getElementById('vPal').textContent   = FEATURES.palette.name;
document.getElementById('vEra').textContent   = FEATURES.era;

/* ─────────────────────────────────────────────────────────
   9. Canvas setup with proper DPR + responsive
   ───────────────────────────────────────────────────────── */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });
let W, H, cx, cy, unit, dpr;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cssW = window.innerWidth;
  const cssH = window.innerHeight;
  canvas.width  = cssW * dpr;
  canvas.height = cssH * dpr;
  canvas.style.width  = cssW + 'px';
  canvas.style.height = cssH + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  W = cssW; H = cssH;
  cx = W / 2; cy = H / 2;
  unit = Math.min(W, H) / 18;
}
resize();
window.addEventListener('resize', resize);

/* ─────────────────────────────────────────────────────────
   10. Helper: deterministic per-element rng
   ───────────────────────────────────────────────────────── */
function elemRng(seed) {
  let s = seed;
  return function() {
    s = (s * 9301 + 49297) % 233280;
    return s / 233280;
  };
}

/* ─────────────────────────────────────────────────────────
   11. Draw atmospheric background
   ───────────────────────────────────────────────────────── */
function drawBackground(t) {
  // Solid base
  ctx.fillStyle = P.bg;
  ctx.fillRect(0, 0, W, H);

  // Radial atmosphere glow
  const glow = ctx.createRadialGradient(cx, cy, unit * 0.5, cx, cy, Math.max(W, H) * 0.7);
  glow.addColorStop(0, P.accent + '20');
  glow.addColorStop(0.4, P.hot + '0a');
  glow.addColorStop(1, '#00000000');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  // Catalog grid (subtle dots)
  ctx.fillStyle = P.accent + '14';
  const step = unit * 1.2;
  for (let x = step; x < W; x += step) {
    for (let y = step; y < H; y += step) {
      ctx.fillRect(x - 0.5, y - 0.5, 1, 1);
    }
  }

  // Concentric rings around pizza (radar feel)
  if (FEATURES.hasHaloRing) {
    for (let r = unit * 5; r < Math.max(W, H); r += unit * 2.5) {
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.strokeStyle = P.accent + '0a';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }
}

/* ─────────────────────────────────────────────────────────
   12. Draw pizza pan/plate (background platter)
   ───────────────────────────────────────────────────────── */
function drawPlate(t) {
  const plateR = Math.min(W, H) * 0.42;

  // Outer plate
  ctx.beginPath();
  ctx.arc(cx, cy, plateR, 0, Math.PI * 2);
  ctx.fillStyle = P.plate;
  ctx.fill();

  // Plate rim (double line)
  ctx.beginPath();
  ctx.arc(cx, cy, plateR, 0, Math.PI * 2);
  ctx.strokeStyle = P.accent + '66';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(cx, cy, plateR - unit * 0.15, 0, Math.PI * 2);
  ctx.strokeStyle = P.accent + '33';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Catalog tick marks around plate
  for (let i = 0; i < 24; i++) {
    const a = (Math.PI * 2 / 24) * i;
    const x1 = cx + Math.cos(a) * (plateR + unit * 0.2);
    const y1 = cy + Math.sin(a) * (plateR + unit * 0.2);
    const x2 = cx + Math.cos(a) * (plateR + unit * 0.4);
    const y2 = cy + Math.sin(a) * (plateR + unit * 0.4);
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = P.accent + (i % 6 === 0 ? '88' : '33');
    ctx.lineWidth = i % 6 === 0 ? 1.5 : 1;
    ctx.stroke();
  }
}

/* ─────────────────────────────────────────────────────────
   13. Draw single pizza slice (the main attraction)
   ───────────────────────────────────────────────────────── */
function drawSlice(idx, t) {
  const pizzaR = Math.min(W, H) * 0.35;
  const anglePer = (Math.PI * 2) / FEATURES.sliceCount;
  const startA = FEATURES.rotation + idx * anglePer;
  const endA = startA + anglePer - 0.025;
  const midA = (startA + endA) / 2;

  // Subtle drift per slice
  const drift = unit * FEATURES.driftAmount * Math.sin(t * 0.6 + idx * 0.7);
  const dx = cx + Math.cos(midA) * drift;
  const dy = cy + Math.sin(midA) * drift;

  ctx.save();
  ctx.translate(dx, dy);

  // ─── Slice base (cheese layer) ───
  const grad = ctx.createRadialGradient(0, 0, pizzaR * 0.2, 0, 0, pizzaR);
  grad.addColorStop(0,    P.cheese + 'ee');
  grad.addColorStop(0.45, P.accent + 'cc');
  grad.addColorStop(0.85, P.hot + 'dd');
  grad.addColorStop(1,    P.hot + 'ff');

  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.arc(0, 0, pizzaR, startA, endA);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  // ─── Slice divider lines ───
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(Math.cos(startA) * pizzaR, Math.sin(startA) * pizzaR);
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = P.bg;
  ctx.stroke();

  // ─── Crust rim with glow ───
  const crustWidth = unit * FEATURES.crustWidth;
  ctx.beginPath();
  ctx.arc(0, 0, pizzaR - crustWidth * 0.3, startA, endA);
  ctx.lineWidth = crustWidth;
  ctx.strokeStyle = P.hot;
  ctx.shadowColor = P.hot;
  ctx.shadowBlur = unit * 0.5;
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Crust highlight (catalog print effect)
  ctx.beginPath();
  ctx.arc(0, 0, pizzaR - crustWidth * 0.3, startA, endA);
  ctx.lineWidth = crustWidth * 0.4;
  ctx.strokeStyle = P.accent + '88';
  ctx.stroke();

  // Crust dotted texture
  const crustDotRng = elemRng((idx + 1) * 9999);
  for (let cd = 0; cd < 12; cd++) {
    const ca = startA + crustDotRng() * (endA - startA);
    const cr = pizzaR - crustWidth * (0.2 + crustDotRng() * 0.6);
    const cx2 = Math.cos(ca) * cr;
    const cy2 = Math.sin(ca) * cr;
    ctx.beginPath();
    ctx.arc(cx2, cy2, unit * 0.04, 0, Math.PI * 2);
    ctx.fillStyle = P.bg + 'aa';
    ctx.fill();
  }

  // ─── Cheese bubbles ───
  const bubbleRng = elemRng((idx + 1) * 1234);
  const bubbleCount = 4 + Math.floor(bubbleRng() * 6);
  for (let b = 0; b < bubbleCount; b++) {
    const br = pizzaR * (0.18 + bubbleRng() * 0.6);
    const ba = startA + bubbleRng() * (endA - startA);
    const bx = Math.cos(ba) * br;
    const by = Math.sin(ba) * br;
    const bsize = unit * (0.06 + bubbleRng() * 0.16);

    // Bubble fill
    ctx.beginPath();
    ctx.arc(bx, by, bsize, 0, Math.PI * 2);
    ctx.fillStyle = P.cheese + 'cc';
    ctx.shadowColor = P.cheese;
    ctx.shadowBlur = unit * 0.3;
    ctx.fill();
    ctx.shadowBlur = 0;

    // Bubble highlight (catalog ink effect)
    ctx.beginPath();
    ctx.arc(bx - bsize * 0.3, by - bsize * 0.3, bsize * 0.3, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff44';
    ctx.fill();
  }

  // ─── Bitcoin ₿ pattern in slice (subtle/bold/mosaic) ───
  const btcRng = elemRng((idx + 1) * 7777);
  if (FEATURES.bitcoinPattern === 'BOLD') {
    // One large ₿ per slice
    const ba = startA + (endA - startA) * 0.5;
    const br = pizzaR * 0.45;
    ctx.save();
    ctx.translate(Math.cos(ba) * br, Math.sin(ba) * br);
    ctx.rotate(ba + Math.PI / 2);
    ctx.font = `bold ${unit * 0.7}px 'Courier New', monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = P.bg + 'cc';
    ctx.fillText('₿', 0, 0);
    ctx.restore();
  } else if (FEATURES.bitcoinPattern === 'MOSAIC') {
    // Multiple small ₿ scattered
    for (let m = 0; m < 5; m++) {
      const ma = startA + btcRng() * (endA - startA);
      const mr = pizzaR * (0.25 + btcRng() * 0.45);
      const mx = Math.cos(ma) * mr;
      const my = Math.sin(ma) * mr;
      ctx.font = `bold ${unit * 0.18}px 'Courier New', monospace`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = P.bg + 'aa';
      ctx.fillText('₿', mx, my);
    }
  } else {
    // SUBTLE — just one tiny watermark
    const ba = startA + (endA - startA) * 0.5;
    const br = pizzaR * 0.55;
    ctx.font = `bold ${unit * 0.25}px 'Courier New', monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = P.bg + '55';
    ctx.fillText('₿', Math.cos(ba) * br, Math.sin(ba) * br);
  }

  // ─── Toppings (pepperoni / olive / etc.) ───
  const topRng = elemRng((idx + 1) * 5555);
  const topCount = Math.floor(2 + topRng() * 3 * FEATURES.toppingDensity);
  for (let tp = 0; tp < topCount; tp++) {
    const tr = pizzaR * (0.22 + topRng() * 0.5);
    const ta = startA + topRng() * (endA - startA);
    const tx = Math.cos(ta) * tr;
    const ty = Math.sin(ta) * tr;
    const ts = unit * (0.18 + topRng() * 0.12);

    // Pepperoni-style filled circle
    if (FEATURES.toppingSymbol === '◉') {
      ctx.beginPath();
      ctx.arc(tx, ty, ts * 0.5, 0, Math.PI * 2);
      ctx.fillStyle = P.pepperoni;
      ctx.shadowColor = P.pepperoni;
      ctx.shadowBlur = unit * 0.2;
      ctx.fill();
      ctx.shadowBlur = 0;

      // Pepperoni rim
      ctx.beginPath();
      ctx.arc(tx, ty, ts * 0.5, 0, Math.PI * 2);
      ctx.strokeStyle = P.bg + 'aa';
      ctx.lineWidth = 1;
      ctx.stroke();
    } else {
      // Symbol-based topping
      ctx.font = `bold ${ts}px 'Courier New', monospace`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = P.pepperoni;
      ctx.shadowColor = P.pepperoni;
      ctx.shadowBlur = unit * 0.25;
      ctx.fillText(FEATURES.toppingSymbol, tx, ty);
      ctx.shadowBlur = 0;
    }
  }

  // ─── Phosphor afterglow ───
  if (FEATURES.hasPhosphor) {
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, pizzaR * 0.6, startA, endA);
    ctx.closePath();
    ctx.fillStyle = P.cool + '0a';
    ctx.fill();
  }

  ctx.restore();
}

/* ─────────────────────────────────────────────────────────
   14. Draw center Bitcoin medallion
   ───────────────────────────────────────────────────────── */
function drawCenter(t) {
  const r = unit * 1.3;

  // Outer disk
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = P.bg;
  ctx.fill();

  // Disk rim
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.lineWidth = unit * 0.12;
  ctx.strokeStyle = P.accent;
  ctx.shadowColor = P.accent;
  ctx.shadowBlur = unit * 0.6;
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Inner ring
  ctx.beginPath();
  ctx.arc(cx, cy, r * 0.85, 0, Math.PI * 2);
  ctx.lineWidth = 1;
  ctx.strokeStyle = P.accent + '88';
  ctx.stroke();

  // ₿ symbol with pulse
  const pulse = 1 + 0.06 * Math.sin(t * FEATURES.pulseSpeed);
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(pulse, pulse);
  ctx.font = `bold ${unit * 1.3}px 'Courier New', monospace`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = P.accent;
  ctx.shadowColor = P.accent;
  ctx.shadowBlur = unit * 1.0;
  ctx.fillText('₿', 0, unit * 0.04);
  ctx.shadowBlur = 0;
  ctx.restore();

  // Orbiting dot (electron feel)
  const orbR = r * 1.45;
  const ox = cx + Math.cos(t * 0.8) * orbR;
  const oy = cy + Math.sin(t * 0.8) * orbR;
  ctx.beginPath();
  ctx.arc(ox, oy, unit * 0.1, 0, Math.PI * 2);
  ctx.fillStyle = P.hot;
  ctx.shadowColor = P.hot;
  ctx.shadowBlur = unit * 0.5;
  ctx.fill();
  ctx.shadowBlur = 0;

  // Orbit path
  ctx.beginPath();
  ctx.arc(cx, cy, orbR, 0, Math.PI * 2);
  ctx.setLineDash([unit * 0.08, unit * 0.12]);
  ctx.lineWidth = 1;
  ctx.strokeStyle = P.accent + '33';
  ctx.stroke();
  ctx.setLineDash([]);
}

/* ─────────────────────────────────────────────────────────
   15. Temperature bar (right edge)
   ───────────────────────────────────────────────────────── */
function drawTempBar() {
  const bw = unit * 0.22;
  const bh = unit * 5;
  const bx = W - unit * 1.5;
  const by = H / 2 - bh / 2;
  const fillRatio = (FEATURES.temp - 400) / 600;

  // Background
  ctx.fillStyle = P.bg;
  ctx.strokeStyle = P.accent + '55';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.rect(bx, by, bw, bh);
  ctx.fill();
  ctx.stroke();

  // Fill (heat)
  const fh = bh * fillRatio;
  const fGrad = ctx.createLinearGradient(0, by + bh - fh, 0, by + bh);
  fGrad.addColorStop(0, P.hot);
  fGrad.addColorStop(1, P.accent);
  ctx.fillStyle = fGrad;
  ctx.fillRect(bx + 1, by + bh - fh + 1, bw - 2, fh - 2);

  // Tick marks
  for (let i = 0; i <= 4; i++) {
    const ty = by + bh * (i / 4);
    ctx.beginPath();
    ctx.moveTo(bx - unit * 0.1, ty);
    ctx.lineTo(bx, ty);
    ctx.strokeStyle = P.accent + '66';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // Label
  ctx.font = `${unit * 0.2}px 'Courier New', monospace`;
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = P.accent + 'aa';
  ctx.fillText('°F', bx - unit * 0.2, by - unit * 0.2);
}

/* ─────────────────────────────────────────────────────────
   16. Catalog data table (left edge)
   ───────────────────────────────────────────────────────── */
function drawDataTable() {
  const tx = unit * 0.5;
  const ty = H / 2 - unit * 2.5;
  const tw = unit * 1.8;

  ctx.font = `${unit * 0.22}px 'Courier New', monospace`;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';

  const rows = [
    ['CRUST', FEATURES.crustStyle.substr(0, 7)],
    ['SLICE', FEATURES.sliceCount + 'X'],
    ['TOPP.', TOPPING_NAMES[FEATURES.toppingSymbol].substr(0, 6)],
    ['BTC', FEATURES.bitcoinPattern.substr(0, 6)],
    ['GLITCH', FEATURES.hasGlitch ? 'ON' : 'OFF'],
  ];

  // Frame
  ctx.strokeStyle = P.accent + '44';
  ctx.lineWidth = 1;
  ctx.strokeRect(tx, ty, tw, rows.length * unit * 0.45 + unit * 0.3);

  rows.forEach((row, i) => {
    const ry = ty + unit * 0.15 + i * unit * 0.45;
    ctx.fillStyle = P.accent + '66';
    ctx.fillText(row[0], tx + unit * 0.1, ry);
    ctx.fillStyle = P.accent + 'cc';
    ctx.fillText(row[1], tx + unit * 0.85, ry);
  });
}

/* ─────────────────────────────────────────────────────────
   17. Glitch effect (random horizontal slice shift)
   ───────────────────────────────────────────────────────── */
let glitchCooldown = 0;
function applyGlitch() {
  if (!FEATURES.hasGlitch) return;
  if (Math.random() > 0.985) glitchCooldown = 6;
  if (glitchCooldown > 0) {
    glitchCooldown--;
    const y = Math.random() * H;
    const h = unit * (0.2 + Math.random() * 0.6);
    const shift = (Math.random() - 0.5) * unit * 0.6;

    try {
      const slice = ctx.getImageData(0, y * dpr, W * dpr, h * dpr);
      ctx.putImageData(slice, shift * dpr, y * dpr);
    } catch(e) { /* ignore */ }

    // Color fringe
    ctx.fillStyle = P.hot + '11';
    ctx.fillRect(0, y, W, h);
  }
}

/* ─────────────────────────────────────────────────────────
   18. Catalog grain overlay
   ───────────────────────────────────────────────────────── */
function applyGrain() {
  if (!FEATURES.hasGrain) return;
  const grainStrength = FEATURES.noiseLevel * 35;
  const imgData = ctx.getImageData(0, 0, W * dpr, H * dpr);
  const d = imgData.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (Math.random() - 0.5) * grainStrength;
    d[i]     = Math.max(0, Math.min(255, d[i] + n));
    d[i + 1] = Math.max(0, Math.min(255, d[i + 1] + n));
    d[i + 2] = Math.max(0, Math.min(255, d[i + 2] + n));
  }
  ctx.putImageData(imgData, 0, 0);
}

/* ─────────────────────────────────────────────────────────
   19. Animation loop
   ───────────────────────────────────────────────────────── */
let t = 0;
let frameCount = 0;
let firstFrameDrawn = false;

function loop() {
  requestAnimationFrame(loop);
  t += 0.016;
  frameCount++;

  // Draw scene
  drawBackground(t);
  drawPlate(t);
  for (let i = 0; i < FEATURES.sliceCount; i++) {
    drawSlice(i, t);
  }
  drawCenter(t);
  drawTempBar();
  drawDataTable();

  // Vignette overlay (final frame composition)
  const vig = ctx.createRadialGradient(cx, cy, Math.min(W, H) * 0.3, cx, cy, Math.max(W, H) * 0.75);
  vig.addColorStop(0, '#00000000');
  vig.addColorStop(1, '#000000aa');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);

  // Apply effects every few frames (perf)
  if (frameCount % 3 === 0) applyGlitch();
  if (frameCount % 8 === 0) applyGrain();

  // Tell fxhash preview is ready (after 2 seconds)
  if (!firstFrameDrawn && t > 2) {
    firstFrameDrawn = true;
    if (typeof $fx !== 'undefined' && $fx.preview) {
      $fx.preview();
    }
  }
}

loop();
</script>
</body>
