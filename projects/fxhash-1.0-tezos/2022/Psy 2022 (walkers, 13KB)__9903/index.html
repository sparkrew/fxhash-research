<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Psy | 2012</title>
    <style> body {padding: 0; margin: 0;} canvas {vertical-align: top;} </style>
    <script id="fxhash-snippet">
      let alphabet = "123456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ"
      var fxhash = new URLSearchParams(window.location.search).get('fxhash')
      let b58dec = str=>[...str].reduce((p,c)=>p*alphabet.length+alphabet.indexOf(c)|0, 0)
      let fxhashTrunc = fxhash.slice(2)
      let regex = new RegExp(".{" + ((fxhashTrunc.length/4)|0) + "}", 'g')
      let hashes = fxhashTrunc.match(regex).map(h => b58dec(h))
      let sfc32 = (a, b, c, d) => {
        return () => {
          a |= 0; b |= 0; c |= 0; d |= 0
          var t = (a + b | 0) + d | 0
          d = d + 1 | 0
          a = b ^ b >>> 9
          b = c + (c << 3) | 0
          c = c << 21 | c >>> 11
          c = c + t | 0
          return (t >>> 0) / 4294967296
        }
      }
      var fxrand = sfc32(...hashes)
      // used to get features during token mint
      window.addEventListener("message", (event) => {
        if (event.data === "fxhash_getFeatures") {
          parent.postMessage({
            id: "fxhash_getFeatures",
            data: window.$fxhashFeatures
          }, "*")
        }
      })
      var isFxpreview = new URLSearchParams(window.location.search).get('preview') === "1"
      function fxpreview() {
        window.dispatchEvent(new Event("fxhash-preview"))
        setTimeout(() => fxpreview(), 500)
      }
</script>
    
    <script>
      window.rand = function(min, max) {
        return (fxrand() * (max - min + 1) + min)^0;
      };
      const matrix = fxrand() < 0.075;
      const toTop = fxrand() < 0.18;

      window.$fxhashFeatures = {
        'To Right': fxrand() < 0.18,
        'To Top': toTop,
        'To Down': toTop ? false : fxrand() < 0.18,
        'Palette': fxrand() < 0.5 ? 'Original' : rand(1,7),
        'Amount': rand(4000, 8000),
        'Psy Matrix': matrix,
        'Sign': matrix ? 0.8 : fxrand() < 0.2,
      }
    </script>
    <style>
      #sketch {
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <canvas id="sketch"></canvas>
    <script src="./sketch.js" type="text/javascript"></script>
  </body>
</html>
