<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" >
    <meta name="viewport" content="width=device-width, initial-scale=1.0" >
    <title>BREATHING / Droste</title>

    <script id="fxhash-snippet">
      let alphabet = "123456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ"
      var fxhash = new URLSearchParams(window.location.search).get('fxhash')
      let b58dec = str=>[...str].reduce((p,c)=>p*alphabet.length+alphabet.indexOf(c)|0, 0)
      let fxhashTrunc = fxhash.slice(2)
      let regex = new RegExp(".{" + ((fxhashTrunc.length/4)|0) + "}", 'g')
      let hashes = fxhashTrunc.match(regex).map(h => b58dec(h))
      let sfc32 = (a, b, c, d) => {
        return () => {
          a |= 0; b |= 0; c |= 0; d |= 0
          var t = (a + b | 0) + d | 0
          d = d + 1 | 0
          a = b ^ b >>> 9
          b = c + (c << 3) | 0
          c = c << 21 | c >>> 11
          c = c + t | 0
          return (t >>> 0) / 4294967296
        }
      }
      var fxrand = sfc32(...hashes)
      // used to get features during token mint
      window.addEventListener("message", (event) => {
        if (event.data === "fxhash_getFeatures") {
          parent.postMessage({
            id: "fxhash_getFeatures",
            data: window.$fxhashFeatures
          }, "*")
        }
      })
      var isFxpreview = new URLSearchParams(window.location.search).get('preview') === "1"
      function fxpreview() {
        window.dispatchEvent(new Event("fxhash-preview"))
        setTimeout(() => fxpreview(), 500)
      }
</script>
    
    <script src="./lib/three.min.js"></script>

    <style>
      * {
        margin: 0;
        padding: 0;
      }

      body {
        height: 100vh;
        width: 100vw;
        background: #000;
      }

      canvas {
        max-width: min(600px, 90vmin);
        max-height: min(600px, 90vmin);
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translatey(-50%) translatex(-50%);
        animation: example 0.7s cubic-bezier(0.5, 1, 0.89, 1);
      }

      @keyframes example {
        0% {
          transform: translatey(-50%) translatex(-50%) rotatez(-5deg);
        }
        50% {
          transform: translatey(-50%) translatex(-50%) rotatez(2deg);
        }
        100% {
          transform: translatey(-50%) translatex(-50%) rotatez(0deg);
        }
      }
    </style>
  </head>
  <body>
    <script src="index.js"></script>
  </body>
</html>
