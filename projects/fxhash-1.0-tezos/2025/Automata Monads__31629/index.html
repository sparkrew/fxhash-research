

<!DOCTYPE html>
<html lang="en">
<head>
    <title>Automata Monads</title>
    <script src="./fxhash.min.js"></script>
    <style>
        body {
            margin: 0;
            background-color: #000;
            color: #fff;
            font-family: Helvetica, Arial, sans-serif;
            overflow: hidden; /* disable scrolling / rubberband effect on mobile */
            height:100vh;
        }

        canvas {
            display: block;
            position: absolute;
            outline:0;
        }

        * {
            /* disable touch highlights of HTML elements, especially on mobile! */
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

    </style>

    <meta charset="utf-8">
    <meta name="Automata Monads" content="width=device-width, user-scalable=no, initial-scale=1">
    <meta itemprop="Automata Monads" content="Generative art">

</head>
<body>
    <canvas id="glcanvas" width="100vw" height="100vh" tabindex="1"></canvas>

    <script type="text/javascript" src="js/patch.js" async></script>

    <script type="text/javascript">


        var rand_1 = $fx.rand();
        var rand_2 = $fx.rand();
        var rand_3 = $fx.rand();
        var rand_4 = $fx.rand();
        var rand_5 = $fx.rand();
        var rand_6 = $fx.rand();
        var rand_7 = $fx.rand();
        var rand_8 = $fx.rand();

        function showError(errId, errMsg)
        {

        }

        function patchInitialized(patch)
        {

        }

        function patchFinishedLoading(patch)
        {

        }

        document.addEventListener("CABLES.jsLoaded", function (event)
        {
            CABLES.patch = new CABLES.Patch({
                patch: CABLES.exportedPatch,
                "prefixAssetPath": "",
                "assetPath": "assets/",
                "jsPath": "js/",
                "glCanvasId": "glcanvas",
                "glCanvasResizeToWindow": true,
                "onError": showError,
                "onPatchLoaded": patchInitialized,
                "onFinishedLoading": patchFinishedLoading,
                "canvas": {"alpha":true, "premultipliedAlpha":true } // make canvas transparent
            });


            CABLES.patch.setVariable('rand_1', rand_1);
            CABLES.patch.setVariable('rand_2', rand_2);
            CABLES.patch.setVariable('rand_3', rand_3);
            CABLES.patch.setVariable('rand_4', rand_4);
            CABLES.patch.setVariable('rand_5', rand_5);
            CABLES.patch.setVariable('rand_6', rand_6);
            CABLES.patch.setVariable('rand_7', rand_7);
            CABLES.patch.setVariable('rand_8', rand_8);
        });

        // Disable rubberband effect on mobile devices
        document.getElementById('glcanvas').addEventListener('touchmove', (e)=>{ e.preventDefault(); }, false);
    </script>
</body>
</html>
