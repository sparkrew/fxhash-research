    <script id="fxhash-snippet">
      let alphabet = "123456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ"
      var fxhash = new URLSearchParams(window.location.search).get('fxhash')
      let b58dec = (str) => str.split('').reduce((p,c,i) => p + alphabet.indexOf(c) * (Math.pow(alphabet.length, str.length-i-1)), 0)
      let fxhashTrunc = fxhash.slice(2)
      let regex = new RegExp(".{" + ((fxhashTrunc.length/4)|0) + "}", 'g')
      let hashes = fxhashTrunc.match(regex).map(h => b58dec(h))
      let sfc32 = (a, b, c, d) => {
        return () => {
          a |= 0; b |= 0; c |= 0; d |= 0
          var t = (a + b | 0) + d | 0
          d = d + 1 | 0
          a = b ^ b >>> 9
          b = c + (c << 3) | 0
          c = c << 21 | c >>> 11
          c = c + t | 0
          return (t >>> 0) / 4294967296
        }
      }
      var fxrand = sfc32(...hashes)
      // used to get features during token mint
      window.addEventListener("message", (event) => {
        if (event.data === "fxhash_getFeatures") {
          parent.postMessage({
            id: "fxhash_getFeatures",
            data: window.$fxhashFeatures
          }, "*")
        }
      })
</script>

<canvas id="canvas"></canvas>
<script>
  'use strict';

  function rand() {
    return fxrand();
  }

  function lerp(a, b) {
    const t = rand();
    return a * t + b * (1 - t);
  }


  const iColorLevelVariation = lerp(0.1, 1); // value=0, min=0, max=3.14, step=0.01
  const iColorVariation = lerp(0, 1); // value=0, min=0, max=3.14, step=0.01
  const iColorOffset = lerp(0, Math.PI * 2); // value=0, min=0, max=7, step=0.01
  const iSpeed = lerp(1, 3.5); // value=1, min=0.5, max=2.5, step=0.01
  const iPow = lerp(0.25, 0.85); // value=0.75, min=0.25, max=.8, step=0.01
  const iMax = Math.round(lerp(5, 7.75)); // value=7, min=5, max=7, step=1
  const iMin = Math.round(lerp(2, Math.min(6, iMax - 2))); // value=2, min=1, max=6, step=1

  const gradX = lerp(-1, 1);
  const gradY = lerp(-1, 1);
  const color = lerp(.5, 1.5);

  const shapes = [rand() * rand() * 4 | 0, rand() * rand() * 4 | 0, rand() * rand() * 4 | 0];

  const shapesDiscription = [emoji(shapes[0]), emoji(shapes[1]), emoji(shapes[2])];

  const capture = navigator.webdriver;

  const features = {
    minSubDivision: iMin,
    maxSubDivision: iMax,
    subDivFactor: iPow.toFixed(2),
    shapes: shapesDiscription.sort().join('')
  };

  window.$fxhashFeatures = features;
  console.log(features);

  function emoji(shape) {
    switch (shape) {
      case 0:
        return '⚪';
      case 1:
        return '⬜';
      case 2:
        return '🔺';
      // case 3:
      //   return '⏳';
      default:
        return '🔷';
    }
  }

  function shapeFunc(shape) {
    switch (shape) {
      case 0:
        return 'dist = length(p);';
      case 1:
        return 'dist = max(q.x,q.y);';
      case 2:
        return 'dist = max(p.x - p.y + 0.5, max(-p.x, p.y));';
      // case 3:
      //   return 'dist = q.x - q.y + .5;';
      default:
        return 'dist = q.x + q.y;';
    }
  }

  function webglProgram(canvas, fragmentShader) {
    const gl = canvas.getContext('webgl', { preserveDrawingBuffer: true, antialias: false });
    const pid = gl.createProgram();
    shader(`
    attribute vec2 vertex;

    void main() {
        gl_Position = vec4(vertex, 0.0, 1.0);
    }
`, gl.VERTEX_SHADER);

    shader(fragmentShader, gl.FRAGMENT_SHADER);
    gl.linkProgram(pid);
    gl.useProgram(pid);
    gl.depthFunc(gl.ALWAYS);
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.enable(gl.BLEND);
    const vertex = gl.getAttribLocation(pid, 'vertex');

    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, 3, -1, -1, 3, -1]), gl.STATIC_DRAW);
    gl.vertexAttribPointer(vertex, 2, gl.FLOAT, false, 0, 0);
    gl.enableVertexAttribArray(vertex);

    function shader(src, a) {
      let s = gl.createShader(a);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      gl.attachShader(pid, s);
    }

    const uniformsLocations = {};

    function uniformLocation(name) {
      if (!uniformsLocations[name]) {
        uniformsLocations[name] = gl.getUniformLocation(pid, name);
      }
      return uniformsLocations[name];
    }

    function uf3(name, a, b, c) {
      gl.uniform3f(uniformLocation(name), a, b, c);
    }

    function uf2(name, a, b) {
      gl.uniform2f(uniformLocation(name), a, b);
    }

    function uf1(name, a) {
      gl.uniform1f(uniformLocation(name), a);
    }

    let w, h;

    function resize() {
      const bb = canvas.getBoundingClientRect();
      if ((bb.width | 0) === w && (bb.height | 0) === h) {
        return;
      }
      w = canvas.width = (bb.width | 0);
      h = canvas.height = (bb.height | 0);
      gl.viewport(0, 0, w, h);
    }

    function draw() {
      resize();
      uf2('iResolution', w, h);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }

    return { uf1, uf2, uf3, resize, draw };
  }

  const canvas = document.querySelector('canvas');
  const fragmentShader = `
precision highp float;

// Forked from "Metaballs" by reinder
// https://oneshader.net/shader/ab59fb7967


uniform float iTime;
uniform vec2  iResolution;

const float iColorVariation = ${iColorVariation.toFixed(4)}; // value=0, min=0, max=3.14, step=0.01
const float iColorOffset = ${iColorOffset.toFixed(4)}; // value=0, min=0, max=7, step=0.01
const float iSpeed = ${iSpeed.toFixed(4)}; // value=1, min=0.5, max=2.5, step=0.01
const float iPow = ${iPow.toFixed(4)}; // value=0.75, min=0.25, max=.8, step=0.01
const float iMin = ${iMin.toFixed(4)}; // value=2, min=1, max=6, step=1
const float iMax = ${iMax.toFixed(4)}; // value=7, min=5, max=7, step=1

const vec2 grad = vec2(${gradX.toFixed(4)}, ${gradY.toFixed(4)});

#define MAX_DEPTH 9
#define AA 2

//
// Hash functions by Dave Hoskins:
//
// https://www.shadertoy.com/view/4djSRW
//

float hash12(vec2 p) {
	vec3 p3  = fract(vec3(p.xyx) * .1031);
    p3 += dot(p3, p3.yzx + 33.33);
    return fract((p3.x + p3.y) * p3.z);
}

float hash13(vec3 p3) {
	p3  = fract(p3 * .1031);
    p3 += dot(p3, p3.zyx + 31.32);
    return fract((p3.x + p3.y) * p3.z);
}


vec2 hash22(vec2 p) {
	vec3 p3 = fract(vec3(p.xyx) * vec3(.1031, .1030, .0973));
    p3 += dot(p3, p3.yzx+33.33);
    return fract((p3.xx+p3.yz)*p3.zy);

}

float noise(vec3 x) {
    vec3 p = floor(x);
    vec3 f = smoothstep(0., 1., fract(x));

    return mix( mix( mix( hash13(p + vec3(0,0,0)), hash13(p + vec3(1,0,0)), f.x),
                     mix( hash13(p + vec3(0,1,0)), hash13(p + vec3(1,1,0)), f.x), f.y),
                mix( mix( hash13(p + vec3(0,0,1)), hash13(p + vec3(1,0,1)), f.x),
                     mix( hash13(p + vec3(0,1,1)), hash13(p + vec3(1,1,1)), f.x), f.y), f.z);
}

//
// rotation matrices
//

mat2 rot2D(float a) {
	return mat2(cos(a), sin(a), -sin(a), cos(a));
}

vec4 cell(vec2 uv, float d) {
    float size = exp2(d) * .5;
    vec2  cell = ceil(uv * size);

    vec2  h = hash22(cell);
    float n = noise(vec3(cell, iSpeed * .05 * iTime * (h.x + .1) + h.y));

    vec2 p = uv * size - cell + .5;

    if (h.y > .5)
    p = p.yx;
    p *= sign(hash22(-cell) - .5);

      vec2 q = abs(p);
    float
    ${shapeFunc(shapes[0])}

    if (h.x > .33)
    ${shapeFunc(shapes[1])}

    if (h.x > .67)
    ${shapeFunc(shapes[2])}

    return vec4(h.x, n, dist, size);
}

vec3 color(float d, float gradient) {
    return .5 + .5 * sin(d/float(MAX_DEPTH) * ${iColorLevelVariation.toFixed(4)} * 6.28318530718 + vec3(0,${color.toFixed(4)},2.*${color.toFixed(4)}) + ${iColorOffset.toFixed(4)} + gradient);
}

void main() {
    float pix = 1.1 /  min(iResolution.x, iResolution.y);
	vec2 p = (gl_FragCoord.xy * 2. - iResolution.xy);
    vec3 tot = color(-1., dot(p * pix, grad)) * .25;

	for (int m=0; m<AA; m++) {
		for (int n=0; n<AA; n++) {
            vec2 q = p + 2. * vec2(m,n)/float(AA) - 1.;
            q *= pix;

            vec3 col = vec3(0.1);

            float tn = .75, tnprev = 0.;
            if (max(abs(q.x), abs(q.y)) >= 1.) {

            } else {
            	for (int d=1; d<MAX_DEPTH; d++) {
            	    vec4 data = cell(q, float(d));

                    tn += pow(data.y, iPow);

                    if ( (tn <= float(d) && float(d) >= iMin) || float(d) >= iMax) {
                        float m = smoothstep(float(d) - 0.975, float(d) - 1., tnprev);
                        vec4  mdata = mix(data, cell(q, float(d) - 1.), m * m);
                        vec3  shape = color(float(d) - m + mdata.x * iColorVariation, dot(q, grad));
                        // shape *= .9 + .1 * smoothstep(.5, .4, abs(fract(mdata.z / mdata.x * 50.) - .5) );
                        col = mix(col, shape, step(mdata.z, 0.5 - 0.0025 * mdata.w));
                        break;
                    }
                    tnprev = tn;
            	}
            }
            tot += col;
		}
	}
	tot *= (1./(float(AA*AA)));

    tot = smoothstep(vec3(-0.25), vec3(1.1), tot);

    tot += hash12(gl_FragCoord.xy) * 0.05;

	gl_FragColor = vec4(tot, 1.);
}
  `;


  const program = webglProgram(canvas, fragmentShader);

  let startTime = -1;
  let time = 0, frame = 0;

  function draw(t) {
    requestAnimationFrame((t) => draw(t));
    const currentTime = performance.now();
    if (startTime < 0) {
      startTime = currentTime;
    }

    time = capture ? 1 : (currentTime - startTime) / 1e3;

    program.uf1('iTime', time);
    program.uf1('iFrame', frame);
    program.uf1('iZCorrection', Math.max(1, canvas.height / canvas.width));

    program.draw();

    frame++;
  };
  draw(0);
</script>
