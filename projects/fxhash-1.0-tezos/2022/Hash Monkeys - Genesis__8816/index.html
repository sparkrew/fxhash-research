    <title>FXHASH project</title>
    <script id="fxhash-snippet">
      let alphabet = "123456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ"
      var fxhash = new URLSearchParams(window.location.search).get('fxhash')
      let b58dec = str=>[...str].reduce((p,c)=>p*alphabet.length+alphabet.indexOf(c)|0, 0)
      let fxhashTrunc = fxhash.slice(2)
      let regex = new RegExp(".{" + ((fxhashTrunc.length/4)|0) + "}", 'g')
      let hashes = fxhashTrunc.match(regex).map(h => b58dec(h))
      let sfc32 = (a, b, c, d) => {
        return () => {
          a |= 0; b |= 0; c |= 0; d |= 0
          var t = (a + b | 0) + d | 0
          d = d + 1 | 0
          a = b ^ b >>> 9
          b = c + (c << 3) | 0
          c = c << 21 | c >>> 11
          c = c + t | 0
          return (t >>> 0) / 4294967296
        }
      }
      var fxrand = sfc32(...hashes)
      // used to get features during token mint
      window.addEventListener("message", (event) => {
        if (event.data === "fxhash_getFeatures") {
          parent.postMessage({
            id: "fxhash_getFeatures",
            data: window.$fxhashFeatures
          }, "*")
        }
      })
      var isFxpreview = new URLSearchParams(window.location.search).get('preview') === "1"
      function fxpreview() {
        window.dispatchEvent(new Event("fxhash-preview"))
        setTimeout(() => fxpreview(), 500)
      }
</script>

		<script id="fshader" type="text/plain">
			#extension GL_OES_standard_derivatives : enable
			
			precision highp float;
			varying vec2 iUv;
			uniform float iTime, iAspect;
			uniform vec2 iRes;
			uniform vec4 iMouse;
			
			#define AA 1
			#define PI 3.141592
			#define TAU 6.283185
			#define S smoothstep
			#define T iTime
			
			float x2(float x) {return x*x;}
			float x3(float x) {return x*x*x;}
			float x4(float x) {return x*x*x*x;}
			
			// ====================================================================
			// =========== Effect starts here =====================================
			
			uniform vec4 
				iType, 
				iSpiral1, 
				iSpiral2, 
				iCol,	// iCol.z=BW or Color, iCol.w=Color separator 
				iCol2;
			uniform vec4 iBgCol1, iBgCol2;
			
			float sabs(float x,float k) {
				float a = (.5/k)*x*x+k*.5;
				float b = abs(x);
				return b<k ? a : b;
			}
			vec2 sabs(vec2 x,float k) { return vec2(sabs(x.x, k), sabs(x.y,k)); }
			vec3 sabs(vec3 x,float k) { return vec3(sabs(x.x, k), sabs(x.y,k), sabs(x.z,k)); }


			mat2 Rot(float a) {
				float s = sin(a);
				float c = cos(a);
				return mat2(c, -s, s, c);
			}

			float AvgChance(float x) {
				return x*x*x*.5+.5;
			}

			float map01(float a, float b, float t) {
				return (t-a)/(b-a);
			}
			
			float Length(vec2 p, float power) {
				p = pow(abs(p), vec2(power));
				
				return pow(p.x+p.y, 1./power);
			}

			float Length(vec3 p, float power) {
				p = pow(abs(p), vec3(power));
				
				return pow(p.x+p.y+p.z, 1./power);
			}
			
			vec3 Spiral(vec2 p) {
				float d;
				
				if(iSpiral2.z<.5) {
					p = abs(p);
					if(iSpiral2.z<.2) {
						p *= Rot(PI*.25);
						p = abs(p);
					}
				}
				
				// distortion
				float freq = mix(5., 40., x2(iSpiral2.x));
				float amt = x3(iSpiral2.y);
				p += sin(p*freq+T)*.3*amt * x4(.5-cos(T*.2)*.5);
				
				if(iCol.w<.2) {
					p *= Rot(T*mix(-2., 4., AvgChance(iSpiral1.z)));
					p.y *= mix(.75, 1.25, AvgChance(iCol.z));
					d = Length(p, mix(1., 3., AvgChance(iSpiral1.w)));
				} else if(iCol.w<.4) {
					p.y *= mix(.75, 1.25, AvgChance(iCol.z));
					p *= Rot(T*mix(-2., 4., AvgChance(iSpiral1.z)));
					d = Length(p, mix(1., 3., AvgChance(iSpiral1.w)));
				} else {
					p *= Rot(T*mix(-2., 4., AvgChance(iSpiral1.z)));
					d = length(p);
				}
				
				d = pow(d, iSpiral1.y);
				
				float a = atan(p.x, p.y);
				float x = a/TAU+.5;
				float rep = 15.*mix(.4, 1., iSpiral1.x*iSpiral1.x);
				
				float y = fract(d*rep+x)-.5;
		
				float r = .25;
				d = abs(y)-r;
				float m = S(fwidth(d*rep)*.5,.0,d);
				
				vec3 col = mix(vec3(0), vec3(1), m); //BW
				
				if(iCol.z>.5) {
					col = mix(iBgCol1, iBgCol2, m).rgb/255.;
					float w = fwidth(d);				
					col *= S(0., w*5.,abs(d)-w*3.);
				}
				
				return col;
			}
			
			vec3 Render(vec2 uv) {
				vec2 p = uv;
				
				vec2 offs = vec2(0);
				
				if(iCol.z<.5&&iCol.w<.5) {
					offs =-p*mix(.01,.1,x3(iSpiral2.w));
					offs *= x4(x4(.5-cos(T*.1)*.5));
				}
				
				vec3 col = vec3(Spiral(p-offs).r, Spiral(p).g, Spiral(p+offs).b);
				
				return col;
			}

			void main() {
				vec3 col = vec3(0);
				
				vec2 uv = (iUv-.5)*vec2(iAspect,1);
				for(int x=0;x<AA; x++) {
					for(int y=0;y<AA; y++) {
						vec2 offs = vec2(x, y)/float(AA);
						col += Render(uv+offs/iRes);
					}
				}
				col /= float(AA*AA);

				col *= 1.-dot(uv,uv);
				//col = iBgCol2.rgb;
				
				gl_FragColor = vec4(col, 1);
			}

		 </script>
