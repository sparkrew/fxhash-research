<!DOCTYPE html>
<html>
  <head>
    <script id="fxhash-snippet">
      let alphabet = "123456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ"
      var fxhash = new URLSearchParams(window.location.search).get('fxhash')
      let b58dec = (str) => str.split('').reduce((p,c,i) => p + alphabet.indexOf(c) * (Math.pow(alphabet.length, str.length-i-1)), 0)
      let fxhashTrunc = fxhash.slice(2)
      let regex = new RegExp(".{" + ((fxhashTrunc.length/4)|0) + "}", 'g')
      let hashes = fxhashTrunc.match(regex).map(h => b58dec(h))
      let sfc32 = (a, b, c, d) => {
        return () => {
          a |= 0; b |= 0; c |= 0; d |= 0
          var t = (a + b | 0) + d | 0
          d = d + 1 | 0
          a = b ^ b >>> 9
          b = c + (c << 3) | 0
          c = c << 21 | c >>> 11
          c = c + t | 0
          return (t >>> 0) / 4294967296
        }
      }
      var fxrand = sfc32(...hashes)
      // used to get features during token mint
      window.addEventListener("message", (event) => {
        if (event.data === "fxhash_getFeatures") {
          parent.postMessage({
            id: "fxhash_getFeatures",
            data: window.$fxhashFeatures
          }, "*")
        }
      })
</script>

  </head>

      c=document.querySelector('#c')
      x=c.getContext('2d')
      S=Math.sin
      C=Math.cos
      t=playing=0
      window.onclick=()=>{if(!playing)mp3.play()}
      rsz=window.onresize=()=>{
        setTimeout(()=>{
          if(document.body.clientWidth > document.body.clientHeight*1.77777778){
            c.style.height = '100vh'
            setTimeout(()=>c.style.width = c.clientHeight*1.77777778+'px',0)
          }else{
            c.style.width = '100vw'
            setTimeout(()=>c.style.height = c.clientWidth/1.77777778 + 'px',0)
          }
          c.width=1920
          c.height=c.width/1.777777778
        },0)
      }
      rsz()
      Draw=()=>{
        if(!t){
          mp3 = new Audio()
          mp3.loop=true
          mp3.onplaying=()=>{playing=true}
          mp3.oncanplay=()=>{go=true;if(!playing)mp3.play()}
          mp3.src='ded6713f182822e0a0f978ab8cd71965.MP3'
          Rn=fxrand
          bgimg = new Image()
          go=false
          bgimg.onload=()=>{go=true}
          bgimg.src='26xeQS.jpg'
        }
          if(go){
            x.lineJoin=x.lineCap='round'
            x.globalAlpha=.2
            x.drawImage(bgimg,0,-c.height/10,c.width,c.height+c.height/10)
            x.globalAlpha=1
            x.fillStyle='#0000',x.fillRect(0,0,w=1920,w)
          }else{
            x.fillStyle='#0004',x.fillRect(0,0,w=1920,w)
          }
          for(s=30,h=540,k=200,i=w;i--;){X=((f=i%s)-s/2)*1.5;(i+1)%s||(x.stroke(),x.lineWidth /= 4,x.strokeStyle='#fff',x.stroke(),x.beginPath());Z=2+(i/s|0)-(t*20)%1,Y=S(f+S(Z/3+t*8)+S(X/5+t*2)*3)/2+2
          x.globalAlpha=.05+.6*k/(Z**1.25)/6
          x.strokeStyle=`hsla(${Y*300+t*99},99%,${300+S(t)*250}%,.5`
          x.lineWidth = 3+2599/Z/Z
          x.lineTo(960+X/Z*w,k+Y/Z*w)
          }
        t+=1/60
        requestAnimationFrame(Draw)
      }
      Draw()
    </script>
