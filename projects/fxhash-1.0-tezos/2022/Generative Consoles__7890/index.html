<!DOCTYPE html>
<html lang="en-us">

  <head>
    <meta charset="utf-8">
    <title>GenerativeConsole</title>
    <style>
      html {
        box-sizing: border-box;
      }
      *, *:before, *:after {
        box-sizing: inherit;
      }
      body {
        margin: 0;
        background: #444;
      }
      #gameContainer {
        width: 100vw;
        height: 100vh;
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      /* try to handle mobile dialog */
      canvas + * {
        z-index: 2;
      }
      .logo {
          display: block;
          width: max-width: 100vw;
          height: max-height: 70vh;
      }

      .progress {
          margin: 1.5em;
          border: 1px solid white;
          width: 50vw;
          display: none;
      }
      .progress .full {
          margin: 2px;
          background: white;
          height: 1em;
          transform-origin: top left;
      }

      #loader {
        position: absolute;
        left: 0;
        top: 0;
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .spinner,
      .spinner:after {
        border-radius: 50%;
        width: 5em;
        height: 5em;
      }
      .spinner {
        margin: 10px;
        font-size: 10px;
        position: relative;
        text-indent: -9999em;
        border-top: 1.1em solid rgba(255, 255, 255, 0.2);
        border-right: 1.1em solid rgba(255, 255, 255, 0.2);
        border-bottom: 1.1em solid rgba(255, 255, 255, 0.2);
        border-left: 1.1em solid #ffffff;
        transform: translateZ(0);
        animation: spinner-spin 1.1s infinite linear;
      }
      @keyframes spinner-spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

    </style>
    <script id="fxhash-snippet">
      let alphabet = "123456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ"
      var fxhash = new URLSearchParams(window.location.search).get('fxhash')
      let b58dec = str=>[...str].reduce((p,c)=>p*alphabet.length+alphabet.indexOf(c)|0, 0)
      let fxhashTrunc = fxhash.slice(2)
      let regex = new RegExp(".{" + ((fxhashTrunc.length/4)|0) + "}", 'g')
      let hashes = fxhashTrunc.match(regex).map(h => b58dec(h))
      let sfc32 = (a, b, c, d) => {
        return () => {
          a |= 0; b |= 0; c |= 0; d |= 0
          var t = (a + b | 0) + d | 0
          d = d + 1 | 0
          a = b ^ b >>> 9
          b = c + (c << 3) | 0
          c = c << 21 | c >>> 11
          c = c + t | 0
          return (t >>> 0) / 4294967296
        }
      }
      var fxrand = sfc32(...hashes)
      // used to get features during token mint
      window.addEventListener("message", (event) => {
        if (event.data === "fxhash_getFeatures") {
          parent.postMessage({
            id: "fxhash_getFeatures",
            data: window.$fxhashFeatures
          }, "*")
        }
      })
      var isFxpreview = new URLSearchParams(window.location.search).get('preview') === "1"
      function fxpreview() {
        window.dispatchEvent(new Event("fxhash-preview"))
        setTimeout(() => fxpreview(), 500)
      }
</script>


  </head>

  <body>
    <div id="gameContainer"></div>
    <div id="loader">
      <img class="logo" src="logo.png">
      <div class="spinner"></div>
      <div class="progress"><div class="full"></div></div>
    </div>
  </body>

  <script src="Build/UnityLoader.js"></script>
  <script>
  var myinstance = UnityLoader.instantiate("gameContainer", "Build/GenerativeConsoles.json", {onProgress: UnityProgress});
  function UnityProgress(myinstance, progress) {
    if (!myinstance.Module) {
      return;
    }
    const loader = document.querySelector("#loader");
    if (!myinstance.progress) {
      const progress = document.querySelector("#loader .progress");
      progress.style.display = "block";
      myinstance.progress = progress.querySelector(".full");
      loader.querySelector(".spinner").style.display = "none";
    }
    myinstance.progress.style.transform = `scaleX(${progress})`;
    if (progress === 1 && !myinstance.removeTimeout) {
      myinstance.removeTimeout = setTimeout(function() {
          loader.style.display = "none";
          SetAll();
      }, 1000);
    }
  }
  </script>
  <script>
     var TipoConsole;
     var CorConsole;
     var MusicaConsole;
     var BackgroundConsole;
     var InteracaoConsole;
     var CorBackgroundConsole;
    
     function GetTipo(tipo) {
      TipoConsole = tipo;
      if (tipo <= 0.5) return "64-Bits"
      if (tipo <= 0.7) return "16-Bits"
      if (tipo <= 1.0) return "8-Bits"
     }

     function GetCor(cor) {
      CorConsole = cor;
      if (cor <= 0.7) return "There are better colors. 😔"
      if (cor <= 1.0) return "What a cool color! Rare! 🤩"
     }

     function GetMusica(musica) {
      MusicaConsole = musica;
      if (musica <= 0.2) return "01 🎶"
      if (musica <= 0.4) return "02 🎶"
      if (musica <= 0.6) return "03 🎶"
      if (musica <= 0.8) return "04 🎶"
      if (musica <= 1.0) return "05 🎶"
     }

     function GetBackground(background) {
      BackgroundConsole = background;
      if (background <= 0.5) return "Easy"
      if (background <= 0.7) return "Normal"
      if (background <= 1.0) return "Hard"
     }

     function GetInteracao(interacao) {
      InteracaoConsole = interacao;
      if (interacao <= 0.5) return "Is broken. 😔"
      if (interacao <= 1.0) return "It's working! Perfect!🤩"
     }

     BGCOLOR(fxrand())

     function BGCOLOR(corbg)
     {
      CorBackgroundConsole = corbg;
     }

      window.$fxhashFeatures = {
      "CONSOLE TYPE 🎮" : GetTipo(fxrand()),
      "CONSOLE COLOR 🎨" : GetCor(fxrand()),
      "MUSIC 🎶" : GetMusica(fxrand()),
      "INTERACTION 🖱️" : GetInteracao(fxrand()),
      "BACKGROUND 🏞" : GetBackground(fxrand())
      }

         function SetAll() {
         myinstance.SendMessage('Consoles', 'SetType', TipoConsole);
         myinstance.SendMessage('Consoles', 'SetColor', CorConsole);
         myinstance.SendMessage('Consoles', 'SetAudioEnv', MusicaConsole);
         myinstance.SendMessage('Consoles', 'SetBackGround', BackgroundConsole);
         myinstance.SendMessage('Consoles', 'ColorBack', CorBackgroundConsole);
         myinstance.SendMessage('Consoles', 'Interaction', InteracaoConsole);
         fxpreview();
         }  

    </script>

</html>
