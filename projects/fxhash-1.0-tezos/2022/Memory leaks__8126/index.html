<!DOCTYPE html>

    <script id="fxhash-snippet">
      let alphabet = "123456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ"
      var fxhash = new URLSearchParams(window.location.search).get('fxhash')
      let b58dec = str=>[...str].reduce((p,c)=>p*alphabet.length+alphabet.indexOf(c)|0, 0)
      let fxhashTrunc = fxhash.slice(2)
      let regex = new RegExp(".{" + ((fxhashTrunc.length/4)|0) + "}", 'g')
      let hashes = fxhashTrunc.match(regex).map(h => b58dec(h))
      let sfc32 = (a, b, c, d) => {
        return () => {
          a |= 0; b |= 0; c |= 0; d |= 0
          var t = (a + b | 0) + d | 0
          d = d + 1 | 0
          a = b ^ b >>> 9
          b = c + (c << 3) | 0
          c = c << 21 | c >>> 11
          c = c + t | 0
          return (t >>> 0) / 4294967296
        }
      }
      var fxrand = sfc32(...hashes)
      // used to get features during token mint
      window.addEventListener("message", (event) => {
        if (event.data === "fxhash_getFeatures") {
          parent.postMessage({
            id: "fxhash_getFeatures",
            data: window.$fxhashFeatures
          }, "*")
        }
      })
      var isFxpreview = new URLSearchParams(window.location.search).get('preview') === "1"
      function fxpreview() {
        window.dispatchEvent(new Event("fxhash-preview"))
        setTimeout(() => fxpreview(), 500)
      }
</script>
    <script type="text/javascript" src="./three.js"></script>

<body>

<div id="Stats-output">
</div>

<div id="WebGL-output">
</div>

<script type="text/javascript">
    function init() {
	
        var clock = new THREE.Clock();
		window.addEventListener('resize', onWindowResize, false);

        var scene = new THREE.Scene();
        var limits = 100;
		const aspect = window.innerWidth / window.innerHeight;
		const size = window.innerHeight;

        // create a camera
		const camera = new THREE.OrthographicCamera( (size * aspect) / -10, (size * aspect) / 10, size / 10, size / -10, -20, 100);

        // create color palettes a render and set the size
        var webGLRenderer = new THREE.WebGLRenderer();
		
        let palette1 = [0x282828, 0xc95f73, 0x28143c, 0x4e6873, 0x4c0c1c, 0xe2c695, 0x000000, 0xba4e20, 0xffffff];
        let palette2 = [0xcccccc, 0xd09f40, 0xd1cec7, 0xd09f40, 0x1a2439, 0xd1cec7, 0x9a3a3b, 0xedb7b5, 0xd1cec7];
        let palette3 = [0xeeeeee, 0x69b7de, 0xc93452, 0xc6e3f3, 0xffcc00, 0xc6e3f3, 0x274581, 0xdeb13e, 0xc35929];
		let palette4 = [0x0A1708, 0xCECECE, 0x6F6F6F, 0x232A44, 0xA497AB, 0x6B1038, 0xC9AE3E, 0x8B0F11, 0xFFFFFF];
		let palette5 = [0x3A0101, 0xC88175, 0xB9A095, 0xffffff, 0xA6B6B1, 0x663333, 0x283E45, 0x6C4E32, 0xB6A8A9];
		let palette6 = [0xA34848, 0xE1B13C, 0xAEA29C, 0xffffff, 0xD67A21, 0x6F311C, 0x29100A, 0xD67A21, 0xCA9833];
		let palette7 = [0x58764A, 0xD9E487, 0xC7C1CD, 0xF5EDA5, 0xF9E8EE, 0xC7C1CD, 0xF9E8EE, 0xF1E98C, 0xD9E487];
		let palette8 = [0x07012D, 0x670335, 0x3F2F22, 0xD57A22, 0xE0B13C, 0x6F331E, 0x99541D, 0x670335, 0xCA9833];
		let palette9 = [0x370C07, 0x4E1116, 0x792018, 0x3A3328, 0xffffff, 0x80562F, 0x3A3328, 0xAF864B, 0xAAA2A1];
		let palette10 = [0x7DA2A0, 0x81AEAB, 0xF04130, 0xffffff, 0xF4E8C2, 0x81AEAB, 0xF04130, 0xF04130, 0xF4E8C2];
		let palette11 = [0x0D0C31, 0xBAB0A4, 0x9F8E7C, 0xE2A736, 0x004069, 0xBAB0A4, 0xBC611B, 0x978E85, 0xE2A736];
		let palette12 = [0x231100, 0x99BBC7, 0x0E4B5C, 0xAD6F01, 0xffffff, 0x043321, 0xAD6F01, 0x99BBC7, 0x0E4B5C];
		let palette13 = [0x900500, 0x810000, 0xFF0000, 0xFF4A4A, 0xffffff, 0xAB0000, 0x440000, 0x7D0000, 0xE90000];

        let palName = [palette1, palette2, palette3, palette4, palette5, palette6, palette7, palette8, palette9, palette10, palette11, palette12, palette13];
        var pal = getRandomInt(13);
        var chosenPal = palName[pal];
		
        webGLRenderer.setClearColor(new THREE.Color(chosenPal[0]));
        webGLRenderer.setSize(window.innerWidth, window.innerHeight);
        webGLRenderer.shadowMapEnabled = false;

        var posx = 0;
        var posy = 0;

        for (var j = 0; j < 240; j++) {
            var plane = createMesh(new THREE.PlaneGeometry(18, 18, 1, 1));           
            var sign = getRandomInt(2);
            if (sign == 1) {
                sign = 1;
            } else {
                sign = -1;
            }
            posx = sign * getRandomInt(limits/2);
            sign = getRandomInt(2);
            if (sign == 1) {
                sign = 1;
            } else {
                sign = -1;
            }
            posy = sign * getRandomInt(limits/2);

            plane.position.x = posx;
            plane.position.y = posy;
            plane.position.z = j / 100;
            scene.add(plane);
        }

        // position and point the camera to the center of the scene
        camera.position.x = 0;
        camera.position.y = 0;
        camera.position.z = 10;		
        camera.lookAt(new THREE.Vector3(50, 50, 0));
		
		var orbitControls = new THREE.OrbitControls(camera);
        orbitControls.autoRotate = false;

        // add the output of the renderer to the html element
        document.getElementById("WebGL-output").appendChild(webGLRenderer.domElement);

        render();

        function createMesh(geom) {           			
			var texturefile = getRandomInt(30);
			if (texturefile == 0){
				var filename = "hand_l.jpg";
                // assign material
                var colorElem = getRandomInt(8) + 1;
                var planeMaterialcolor = new THREE.Color(chosenPal[colorElem]);
                var texture = THREE.ImageUtils.loadTexture("./" + filename);
			    var handfootMat = new THREE.MeshBasicMaterial();
			    handfootMat.color = planeMaterialcolor;			
                handfootMat.alphaMap = texture;
                handfootMat.opacity = 1.0;
			    handfootMat.transparent = true; 
                handfootMat.visible = false; 

                var plane = THREE.SceneUtils.createMultiMaterialObject(geom, [handfootMat]);
			}
			if (texturefile == 1){
				var filename = "hand_r.jpg";
                // assign material
                var colorElem = getRandomInt(8) + 1;
                var planeMaterialcolor = new THREE.Color(chosenPal[colorElem]);
                var texture = THREE.ImageUtils.loadTexture("./" + filename);
			    var handfootMat = new THREE.MeshBasicMaterial();
			    handfootMat.color = planeMaterialcolor;			
                handfootMat.alphaMap = texture;
                handfootMat.opacity = 1.0;
			    handfootMat.transparent = true; 
                handfootMat.visible = false; 

                var plane = THREE.SceneUtils.createMultiMaterialObject(geom, [handfootMat]);                
			}
			if (texturefile == 2){
				var filename = "foot_l.jpg";
                // assign material
                var colorElem = getRandomInt(8) + 1;
                var planeMaterialcolor = new THREE.Color(chosenPal[colorElem]);
                var texture = THREE.ImageUtils.loadTexture("./" + filename);
			    var handfootMat = new THREE.MeshBasicMaterial();
			    handfootMat.color = planeMaterialcolor;			
                handfootMat.alphaMap = texture;
                handfootMat.opacity = 1.0;
			    handfootMat.transparent = true; 
                handfootMat.visible = false; 

                var plane = THREE.SceneUtils.createMultiMaterialObject(geom, [handfootMat]); 
			}
			if (texturefile == 3){
				var filename = "foot_r.jpg";
                // assign material
                var colorElem = getRandomInt(8) + 1;
                var planeMaterialcolor = new THREE.Color(chosenPal[colorElem]);
                var texture = THREE.ImageUtils.loadTexture("./" + filename);
			    var handfootMat = new THREE.MeshBasicMaterial();
			    handfootMat.color = planeMaterialcolor;			
                handfootMat.alphaMap = texture;
                handfootMat.opacity = 1.0;
			    handfootMat.transparent = true; 
                handfootMat.visible = false; 

                var plane = THREE.SceneUtils.createMultiMaterialObject(geom, [handfootMat]); 
			}
 			if (texturefile > 3 && texturefile <= 26){
				var filename = "lines.png";
                // assign material
                var colorElem = getRandomInt(8) + 1;
                var planeMaterialcolor = new THREE.Color(chosenPal[colorElem]);
                var texture = THREE.ImageUtils.loadTexture("./" + filename);
			    var patternMat = new THREE.MeshBasicMaterial();
			    patternMat.color = planeMaterialcolor;			
                patternMat.alphaMap = texture;
                patternMat.opacity = 0.6;
			    patternMat.transparent = true;            

                var plane = THREE.SceneUtils.createMultiMaterialObject(geom, [patternMat]); 
			}
			if (texturefile > 26){
				var filename = "spiral.png";
                // assign material
                var colorElem = getRandomInt(8) + 1;
                var planeMaterialcolor = new THREE.Color(chosenPal[colorElem]);
                var texture = THREE.ImageUtils.loadTexture("./" + filename);
			    var patternMat = new THREE.MeshBasicMaterial();
			    patternMat.color = planeMaterialcolor;			
                patternMat.alphaMap = texture;
                patternMat.opacity = 0.5;
			    patternMat.transparent = true;            

                var plane = THREE.SceneUtils.createMultiMaterialObject(geom, [patternMat]);
			}

            return plane;
        }

        function render() {
            var delta = clock.getDelta();
			orbitControls.update(delta);

            scene.traverse(function (e) {
                if (e instanceof THREE.Mesh) {
                    if (e.material.opacity < 0.9) {
                        var rot = getRandomInt(3);
                        if (rot == 0) {
                            e.rotation.z += 0.01;
                        }
                        if (rot == 1) {
                            e.rotation.z += 0.02;
                        }
                        if (rot == 2) {
                            e.rotation.z += 0.04;
                        }
                    }  
                    else {
                        var showhide = getRandomInt(200);
                        if (showhide == 1) {
                            if(e.material.visible == false) {
                                e.material.visible = true;
                            }
                            else {
                                e.material.visible = false;
                            }
                        }
                    }          
                }
            });
            
            webGLRenderer.clear();
            
            // render using requestAnimationFrame
            requestAnimationFrame(render);
            webGLRenderer.render(scene, camera);
        }
        
        function getRandomInt(max) {
            return Math.floor(fxrand() * max);
        }

		function onWindowResize() {
			const newAspect = window.innerWidth / window.innerHeight;
			camera.left = (size * newAspect) / -10;
			camera.right = (size * newAspect) / 10;

			camera.updateProjectionMatrix();

			webGLRenderer.setSize(window.innerWidth, window.innerHeight);
		}  
    }
    window.onload = init;
</script>
</body>
</html>
