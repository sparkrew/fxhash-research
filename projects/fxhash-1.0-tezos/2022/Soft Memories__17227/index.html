<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, shrink-to-fit=0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
  <title>Quentin Hocdé ART</title>

  <style>
      
        html {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        body {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: row;
            margin: 0;
            font-family:Verdana, Geneva, Tahoma, sans-serif
        }

        canvas {
            margin: auto;
            display: block;
        }

        canvas.has-cursor-hidden {
            cursor: none;
        }

        .c-export-menu {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: white;
            color: black;
            border-radius: 15px;
            opacity: 0;
            transform: translate3d(0,60px,0);
            transition: opacity 0.3s ease-in, transform 0.3s ease-in;
            border: 4px solid black;
            pointer-events: none;
            width: 300px;
        }

        .c-export-menu.is-active {
            opacity: 1;
            transform: translate3d(0,0,0);
            transition-timing-function: ease-out;
            pointer-events: all;
        }

        .c-export-menu_title {
            padding: 15px 20px;
            margin: 0;
            text-transform: uppercase;
            font-weight: 400;
            font-size: 12px;
            letter-spacing: 3px;
            border-bottom: 4px solid black;
            background-color: black;
            color: white;
        }

        .c-export-menu_infos {
            margin: 20px 20px 0 20px;
            font-size: 12px;
            opacity: 0.3;
        }

        .c-export-menu_input {
            padding: 0 20px;
            font-size: 12px;
            margin: 10px 0;
        }

        .c-export-menu_input::after {
            content: 'px';
            display: inline-block;
        }

        .c-export-menu_input input {
            background-color: transparent;
            padding: 5px;
            color: black;
            /* border: 0; */
            border: 1px solid rgba(0,0,0,0.3);
            outline: 0;
            margin-top: 10px;
            display: inline-block;
            width: 240px;
            width: 30%;
        }

        .c-export-menu_input label {
            display: inline-block;
            text-transform: uppercase;
            font-size: 10px;
            font-weight: 600;
            width: 60px;
        }

        .c-button {
            background-color: white;
            border: 2px solid black;
            border-radius: 10px;
            color: black;
            padding: 10px 30px;
            display: block;
            margin: 30px 20px 10px 20px;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-size: 11px;
            width: calc(100% - 40px);
            cursor: pointer;
            transition: background-color 0.3s ease-in-out, color 0.3s ease-in-out;
        }

        .c-button:hover {
            color: white;
            background-color: black;
        }

        .c-link {
            background: none;
            border: 0;
            margin: 0 20px 20px 20px;
            color: black;
            text-decoration: underline;
            cursor: pointer;
            outline: 0;
        }

        .c-export-menu_close {
            position: absolute;
            top: 8px;
            right: 8px;
            background: none;
            border: 0;
            width: 30px;
            height: 30px;
            cursor: pointer;
            outline: 0;
        }

        .c-export-menu_close::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 2px;
            transform: translate3d(-50%, -50%, 0) rotate(45deg);
            background-color: white;
            transition: transform 0.3s ease-in-out;
        }

        .c-export-menu_close::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 2px;
            transform: translate3d(-50%, -50%, 0) rotate(-45deg);
            background-color: white;
            transition: transform 0.3s ease-in-out;
        }

        .c-export-menu_close:hover::after,
        .c-export-menu_close:hover::before {
            transform: translate3d(-50%, -50%, 0) rotate(0deg);
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;

        }
