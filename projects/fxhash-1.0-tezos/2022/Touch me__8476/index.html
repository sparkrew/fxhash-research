<!DOCTYPE html>

<html>

<head>
    <title>Touch me by Marco Aureggi</title>
	<script id="fxhash-snippet">
      let alphabet = "123456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ"
      var fxhash = new URLSearchParams(window.location.search).get('fxhash')
      let b58dec = str=>[...str].reduce((p,c)=>p*alphabet.length+alphabet.indexOf(c)|0, 0)
      let fxhashTrunc = fxhash.slice(2)
      let regex = new RegExp(".{" + ((fxhashTrunc.length/4)|0) + "}", 'g')
      let hashes = fxhashTrunc.match(regex).map(h => b58dec(h))
      let sfc32 = (a, b, c, d) => {
        return () => {
          a |= 0; b |= 0; c |= 0; d |= 0
          var t = (a + b | 0) + d | 0
          d = d + 1 | 0
          a = b ^ b >>> 9
          b = c + (c << 3) | 0
          c = c << 21 | c >>> 11
          c = c + t | 0
          return (t >>> 0) / 4294967296
        }
      }
      var fxrand = sfc32(...hashes)
      // used to get features during token mint
      window.addEventListener("message", (event) => {
        if (event.data === "fxhash_getFeatures") {
          parent.postMessage({
            id: "fxhash_getFeatures",
            data: window.$fxhashFeatures
          }, "*")
        }
      })
      var isFxpreview = new URLSearchParams(window.location.search).get('preview') === "1"
      function fxpreview() {
        window.dispatchEvent(new Event("fxhash-preview"))
        setTimeout(() => fxpreview(), 500)
      }
</script>
    <script type="text/javascript" src="./three.js"></script>
    <script type="text/javascript" src="./TrackballControls.js"></script>
     <style>
        body {
            /* set margin to 0 and overflow to hidden, to go fullscreen */
            margin: 0;
            overflow: hidden;
        }
		canvas {
            display:block;
        }
    </style>
</head>
<body>

<div id="Stats-output">
</div>

<div id="WebGL-output">
</div>

<script type="text/javascript">

    function init() {
	
		var clock = new THREE.Clock();
		window.addEventListener('resize', onWindowResize, false);
                
        var transformed = false;
        var scratch = false;

        // create a scene, that will hold all our elements such as objects, cameras and lights.
        var scene = new THREE.Scene();

        // create a camera, which defines where we're looking at.
        var camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);

        // create a render and set the size
        var webGLRenderer = new THREE.WebGLRenderer();
        webGLRenderer.setClearColor(new THREE.Color(0x000000));
        webGLRenderer.setSize(window.innerWidth, window.innerHeight);
        //webGLRenderer.shadowMapEnabled = true;
        webGLRenderer.antialias = true;

        // position and point the camera to the center of the scene
        camera.position.x = -45;
        camera.position.y = 55;
        camera.position.z = 50;
        camera.lookAt(new THREE.Vector3(10, 0, 0));

        //Audio
        var audio = document.createElement('audio');
        var source = document.createElement('source');
        source.src = './glitch.ogg';
        audio.appendChild(source);
        audio.loop=false;
  
        //Controls
        var trackballControls = new THREE.TrackballControls(camera);

        trackballControls.rotateSpeed = 1;
        trackballControls.noZoom=false;
        trackballControls.noPan=false;
        trackballControls.staticMoving = false;
        trackballControls.dynamicDampingFactor = 0.3;
        trackballControls.addEventListener( 'start', scrachenable );

        // Lights
        spotlight = new THREE.SpotLight(0x0dfe6e9, .3);
        spotlight.castShadow = true;
        spotlight.position.set(100, 100, 20);
        scene.add(spotlight);
        
        const NewSpotlight = new THREE.SpotLight(0x0dfe6e9, .2);
        NewSpotlight.castShadow = true;
        NewSpotlight.position.set(-50, -100, 50);
        scene.add(NewSpotlight);

        // add the output of the renderer to the html element
        document.getElementById("WebGL-output").appendChild(webGLRenderer.domElement);

        // call the render function
        var step = 0;

        var knot;
        var tubularSegments = 2;
		var radialSegments = getRandomInt(30) + 36;
		var tube = 7.4;
		var p = getRandomInt(10) + 1;
		var q = getRandomInt(12) + 5;
		var heightScale = 3.5;
		var radius = 13;
		
		//console.log("radialSegments = ", radialSegments, " | p = ", p, " | q = ", q);

        var geom = new THREE.TorusKnotGeometry(radius, tube, radialSegments, tubularSegments, p, q, heightScale);			
        const material = new THREE.MeshPhongMaterial({
            shininess: 100,
		    wireframe: false,
		    specular: 0x636e72, 
		    flatShading: true,
            color: 0xff0000
        });
        
        knot = new THREE.Mesh(geom, material);
        knot.castShadow = true;

		scene.add(knot);
		
		render();

        function render() {
		
		    var delta = clock.getDelta();
            trackballControls.update(delta);

            if (scratch) {
                glitch();
            }

            knot.rotation.y = step += 0.002;

            // render using requestAnimationFrame
            requestAnimationFrame(render);
            webGLRenderer.render(scene, camera);
        }

        function scrachenable() {
            scratch = true;
        }

        function glitch() {
            var probability = getRandomInt(300);
            if (probability > 295) {
                p++;
                scene.remove(knot);
                geom = new THREE.TorusKnotGeometry(radius, tube, radialSegments, tubularSegments, p, q, heightScale);
                knot = new THREE.Mesh(geom, material);
                knot.castShadow = true;	
                scene.add(knot);
                audio.play();
                transformed = true;
            }

            if (probability < 20 && transformed) {
                p--;
                scene.remove(knot);
                geom = new THREE.TorusKnotGeometry(radius, tube, radialSegments, tubularSegments, p, q, heightScale);
                knot = new THREE.Mesh(geom, material);
                knot.castShadow = true;	
                scene.add(knot);
                audio.play();
                transformed = false;
            }
        }

        function getRandomInt(max) {
            return Math.floor(fxrand() * max);
        }

        function onWindowResize() {
        w = window.innerWidth;
        h = window.innerHeight;

        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        webGLRenderer.setSize(w, h);
        }  

    }
    window.onload = init;
</script>
</body>
</html>
