<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title></title>
    <script id="fxhash-snippet">
      let alphabet = "123456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ"
      var fxhash = new URLSearchParams(window.location.search).get('fxhash')
      let b58dec = str=>[...str].reduce((p,c)=>p*alphabet.length+alphabet.indexOf(c)|0, 0)
      let fxhashTrunc = fxhash.slice(2)
      let regex = new RegExp(".{" + ((fxhashTrunc.length/4)|0) + "}", 'g')
      let hashes = fxhashTrunc.match(regex).map(h => b58dec(h))
      let sfc32 = (a, b, c, d) => {
        return () => {
          a |= 0; b |= 0; c |= 0; d |= 0
          var t = (a + b | 0) + d | 0
          d = d + 1 | 0
          a = b ^ b >>> 9
          b = c + (c << 3) | 0
          c = c << 21 | c >>> 11
          c = c + t | 0
          return (t >>> 0) / 4294967296
        }
      }
      var fxrand = sfc32(...hashes)
      // used to get features during token mint
      window.addEventListener("message", (event) => {
        if (event.data === "fxhash_getFeatures") {
          parent.postMessage({
            id: "fxhash_getFeatures",
            data: window.$fxhashFeatures
          }, "*")
        }
      })
      var isFxpreview = new URLSearchParams(window.location.search).get('preview') === "1"
      function fxpreview() {
        window.dispatchEvent(new Event("fxhash-preview"))
        setTimeout(() => fxpreview(), 500)
      }
</script>
    <style>
        html {
            height: 100%;
        }

        main {
            height: 100%;
        }

        body {
            height: 100%;
            background: #02020e;
            min-height: 100vh;
            overflow: hidden;
        }

        .canvas-wrap {
            height: 100%;
            width: 100%;
            z-index: 3;
        }

        .canvas-wrap .shadow-left {
            position: absolute;
            width: 80px;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
            background-image: linear-gradient(to left, rgba(9, 1, 24, 0) 0%, #090118 100%);
        }

        .canvas-wrap .shadow-right {
            position: absolute;
            width: 80px;
            height: 100%;
            top: 0;
            right: 0;
            z-index: 1;
            background-image: linear-gradient(to right, rgba(9, 1, 24, 0) 0%, #090118 100%);
        }

        .canvas-wrap .shadow-top {
            position: absolute;
            width: 100%;
            height: 80px;
            top: 0;
            left: 0;
            z-index: 1;
            background-image: linear-gradient(to top, rgba(9, 1, 24, 0) 0%, #090118 100%);
        }

        .canvas-wrap .shadow-bottom {
            position: absolute;
            width: 100%;
            height: 80px;
            bottom: 0;
            left: 0;
            z-index: 1;
            background-image: linear-gradient(to bottom, rgba(9, 1, 24, 0) 0%, #090118 100%);
        }

        .canvas-wrap:before {
            content: "";
            position: absolute;
            width: 80px;
            height: 100%;
            top: 0;
            right: 0;
            z-index: 1;
            background-image: linear-gradient(to right, rgba(9, 1, 24, 0) 0%, #090118 100%);
        }

        .canvas-wrap img {
            display: block;
            width: 100%;
            height: 100%;
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            z-index: 1;
            opacity: 0;
            transition: opacity 1s ease 0.3s;
        }

        .canvas-wrap img.loaded {
            opacity: 1;
        }
    </style>
</head>

<body>
    <script src="js/p5.min.js"></script>
    <main id="main" data-page-id="home">
        <div class="canvas-wrap">
            <canvas id="canvas"></canvas>
            <div class="shadow-left"></div>
            <div class="shadow-right"></div>
            <div class="shadow-bottom"></div>
            <div class="shadow-top"></div>
        </div>
    </main>

    <script src="./js/index.js"></script>
</body>

</html>
