<html>
      <head>
            <script id="fxhash-snippet">
      let alphabet = "123456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ"
      var fxhash = new URLSearchParams(window.location.search).get('fxhash')
      let b58dec = str=>[...str].reduce((p,c)=>p*alphabet.length+alphabet.indexOf(c)|0, 0)
      let fxhashTrunc = fxhash.slice(2)
      let regex = new RegExp(".{" + ((fxhashTrunc.length/4)|0) + "}", 'g')
      let hashes = fxhashTrunc.match(regex).map(h => b58dec(h))
      let sfc32 = (a, b, c, d) => {
        return () => {
          a |= 0; b |= 0; c |= 0; d |= 0
          var t = (a + b | 0) + d | 0
          d = d + 1 | 0
          a = b ^ b >>> 9
          b = c + (c << 3) | 0
          c = c << 21 | c >>> 11
          c = c + t | 0
          return (t >>> 0) / 4294967296
        }
      }
      var fxrand = sfc32(...hashes)
      // used to get features during token mint
      window.addEventListener("message", (event) => {
        if (event.data === "fxhash_getFeatures") {
          parent.postMessage({
            id: "fxhash_getFeatures",
            data: window.$fxhashFeatures
          }, "*")
        }
      })
      var isFxpreview = new URLSearchParams(window.location.search).get('preview') === "1"
      function fxpreview() {
        window.dispatchEvent(new Event("fxhash-preview"))
        setTimeout(() => fxpreview(), 500)
      }
</script>

<script src="./p5.min.js"></script>
<style>
      canvas {
          position: fixed;
          left: 0; top: 0;
          right: 0; bottom: 0;
          object-fit: contain;
          max-width: 100vw;
          max-height: 100vh;
          margin: auto;
          overflow: auto; 
      }

<script>
let pallet=[[[355,100,62], [15,99,80], [38,99,62], [64,80,30], [198,80,52], [302,77,49]],
            [[45,44,35], [19,81,76], [357,100,50], [259,62,22], [221,88,22], [0,88,27]],
            
            [[32,100,59], [1,80,70], [328,92,33], [246,62,39], [207,100,18], [357,100,24]],
            [[22,73,20], [41,76,63], [11,71,52], [358,82,34], [69,68,39], [316,74,38]],
            [[211,79,29], [210,100,40], [210,100,54], [165,88,44], [43,94,53], [36,86,51]],
            [[15,82,71], [13,100,83], [185,87,38], [182,46,40], [28,100,55], [175,50,35]],
            [[225,45,50], [239,99,88], [213,98,56], [224,95,61], [225,82,46], [225,94,32]],
            [[323,84,37], [349,99,60], [11,100,100], [21,100,79], [193,83,36], [215,96,45]]]
      function getPallet(value) {
            if (value < .16) return 0
            else if (value < .33) return 1
            else if (value < .5) return 2
            else if (value < .66) return 3
            else if (value < .83) return 4
            else return 5
            }
      function getPattern(value) {
            if (value < .12) return 1
            else if (value < .24) return 2
            else if (value < .36) return 3
            else if (value < .48) return 4
            else if (value < .6) return 5
            else if (value < .72) return 6
            else if (value < .84) return 7
            else  return 8
            

            }
      function getcolumnCount(value) {
            if      (value < .25) return 5
            else if (value < .5) return 7
            else if (value < .75) return 9
            else return 11
            }            
      window.$fxhashFeatures = {
            "_pattern": getPattern(fxrand()),
            "_columnCount": getcolumnCount(fxrand()),
            "Pallet": getPallet(fxrand())
      }
let canv, pg
let terrain=[], cols,rows,scl=20, w, h, pallet_ind, flying = 0, _yOff=.01, _flying=.01

function setup() {
      ww=800
      wh=800
      canv = createCanvas(ww, wh, WEBGL)
      pg = createGraphics(100, 100)
      colorMode(HSB)
      frameRate(60)
      _pattern=window.$fxhashFeatures._pattern
      _columnCount=window.$fxhashFeatures._columnCount
      _pallet=window.$fxhashFeatures._pallet
      pallet_ind=window.$fxhashFeatures.Pallet
      let w = 500
      let h = 500
      cols=w/scl
      rows=h/scl
      for(let x=0; x<cols; x++)
            terrain[x] = []

}
function mouseMoved() {
      _yOff=.5-map(mouseY,0,ww,0.1,0.5)
      _flying=map(mouseX,0,ww,0.01,0.1)
}
function draw(){
      translate(0, -ww/4, -300)
      flying -= 0.005+_flying
      background(0)
      pointLight(0,20,100, 0,ww,ww)
      let yoff=flying
      for(let y=0; y<rows; y++){
            let xoff=0
            for(let x=0; x<cols; x++){
                  terrain[x][y] = map(noise(xoff, yoff), 0, 1, -100, 100)
                  xoff += 0.1+_yOff
            }
            yoff += 0.1+_yOff
      }
      stroke(0)
      noStroke()
      noFill()
      rotateX(1*PI/3)
      rotateZ(1*PI/4)
      ambientLight(60)
      smooth();
      for (let y=0; y<rows-1; y++){
            beginShape(TRIANGLE_STRIP)
            for (let x=0; x<cols-1; x++){
                  shininess(10)
                  pointLight(220, 80, 70, 0, -50, 0)
                  //console.log(pallet_ind)
                  fill(220, 80, map(terrain[y][x], -100, 100, 20,90-(y)*scl)) //dark green
                  if (x == 0 || x == cols-2){
                        fill(220, 80, map(terrain[y][x], -100, 100, 30,70)) //dark green
                        vertex(x*scl, y*scl, -100)
                        vertex(x*scl, (y+1)*scl, -100)
                  }
                  else if (y == 0 || y == rows-2){
                        fill(220, 80, map(terrain[y][x], -100, 100, 20,70)) //dark green
                        vertex((x)*scl, (y+1)*scl, -100)
                        vertex((x)*scl, (y)*scl, terrain[y][x])
                  }
                  else{
                        vertex(x*scl, y*scl, terrain[y][x])
                        vertex(x*scl, (y+1)*scl, terrain[y+1][x])
                  }
            }
            endShape()
      }
      //box(ww/4, ww/4)
      strokeWeight(0.1)
      let cnt=0
      for (let y=0; y<rows-1; y++){
            for (let x=0; x<cols-1; x++){
                  if (x % 2 == 0 && y % 3 == 0 && x>5 && y>5 && x<cols-5 && y<rows-5){
                        push()
                        cnt++
                        ambientLight(20)
                        shininess(.100)
                        translate(x*scl , y*scl , terrain[y][x] + 10)
                        pointLight(pallet[_pattern-1][cnt%5][0], pallet[_pattern-1][cnt%5][1], pallet[_pattern-1][cnt%5][2], x*scl - 300 , y*scl - 750, terrain[y][x])
                        fill(pallet[_pattern-1][cnt%5][0], pallet[_pattern-1][cnt%5][1], pallet[_pattern-1][cnt%5][2])
                        stroke(pallet[_pattern-1][cnt%5][0], pallet[_pattern-1][cnt%5][1], pallet[_pattern-1][cnt%5][2]-20)
                        rotateZ(flying * 2)
                        if (cnt % 2 == 0)
                              sphere(20)
                        else if (cnt % 3 == 0)
                              box(30)
                        else 
                              {rotateX(PI/2);cone(20, 30);
                              translate(0,30,0)

                              }
                        pop()
                  }
            }
      }
      translate(ww/4+30, ww/4+30, -105)
      box(rows*scl, cols*scl, 50)
      translate(0, 0, -250)
      ambientLight(0)
      fill(220,100,30)
      box(rows*scl+1, 1+cols*scl, 500)

}


</script>
