<!DOCTYPE html>
<html lang="en">

<head>
    <title>Turbulent</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1">
    <meta itemprop="name" content="Turbulent">
	<script id="fxhash-snippet">
      let alphabet = "123456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ"
      var fxhash = new URLSearchParams(window.location.search).get('fxhash')
      let b58dec = str=>[...str].reduce((p,c)=>p*alphabet.length+alphabet.indexOf(c)|0, 0)
      let fxhashTrunc = fxhash.slice(2)
      let regex = new RegExp(".{" + ((fxhashTrunc.length/4)|0) + "}", 'g')
      let hashes = fxhashTrunc.match(regex).map(h => b58dec(h))
      let sfc32 = (a, b, c, d) => {
        return () => {
          a |= 0; b |= 0; c |= 0; d |= 0
          var t = (a + b | 0) + d | 0
          d = d + 1 | 0
          a = b ^ b >>> 9
          b = c + (c << 3) | 0
          c = c << 21 | c >>> 11
          c = c + t | 0
          return (t >>> 0) / 4294967296
        }
      }
      var fxrand = sfc32(...hashes)
      // used to get features during token mint
      window.addEventListener("message", (event) => {
        if (event.data === "fxhash_getFeatures") {
          parent.postMessage({
            id: "fxhash_getFeatures",
            data: window.$fxhashFeatures
          }, "*")
        }
      })
      var isFxpreview = new URLSearchParams(window.location.search).get('preview') === "1"
      function fxpreview() {
        window.dispatchEvent(new Event("fxhash-preview"))
        setTimeout(() => fxpreview(), 500)
      }
</script>
    <style>
        body {
            margin: 0;
            background-color: #000;
            color: #fff;
            font-family: Helvetica, Arial, sans-serif;
            overflow: hidden; /* disable scrolling / rubberband effect on mobile */
        }

        canvas {
            display: block;
            position: absolute;
            outline:0;
        }

        * {
            /* disable on touch highlights of html elements, especially on mobile! */
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        footer {
            position: absolute;
            bottom: 0;
            left: 0;
            box-sizing: border-box;
            width: 100vw;
            padding: 20px;
            text-align: right;
            font-size: 18px;
            color: var(--highlight-color);
        }

        footer a,
        footer a:hover,
        footer a:active {
            color: var(--highlight-color);
        }
    </style>

</head>

<body>
    <canvas id="glcanvas" width="100vw" height="100vh" tabindex="1"></canvas>
    <script type="text/javascript" src="patch.js" async></script>
    <script>
		var var0 = [0,4,6,8,15,16][Math.floor(fxrand() * [0,4,6,8,15,16].length)]
		// console.log("var0 " + var0)
		var var1 = [0,90,180,270][Math.floor(fxrand() * [0,90,180,270].length)]
		// console.log("var1 " + var1)
		var var2 = round(0.2 + (fxrand() * 0.8))
		// console.log("var2 " + var2)
		var var3 = round(1 + (fxrand() * 3))
		// console.log("var3 " + var3)
		var var4 = round(50 + (fxrand() * 50))
		// console.log("var4 " + var4)
		var var5 = [3,4,5,6,7,8,32][Math.floor(fxrand() * [3,4,5,6,7,8,32].length)]
		// console.log("var5 " + var5)		
		var var6 = round(0.5 + (fxrand() * 1.5))
		// console.log("var6 " + var6)
		var var7 = round(fxrand() * 10000)
		// console.log("var7 " + var7)		
		var var8 = round(fxrand() * 10000)
		// console.log("var8 " + var8)		
		var var9 = 1
		// console.log("var9 " + var9)					
		var var10 = Math.round(fxrand())
		// console.log("var10 " + var10)			
		var var11 = Math.round(fxrand())
		// console.log("var11 " + var11)
		var var12 = Math.round(fxrand())
		// console.log("var12 " + var12)			
		var var13 = 0
		// console.log("var13 " + var13)
		
		function round(num) {
			return Math.round((num + Number.EPSILON) * 10) / 10;
		}
		
		window.$fxhashFeatures = {
			"EDGE MODE": var0,
			"GEOMETRY SHAPE": var5,
			"NOISE STRENGTH": var2,
			"NOISE SCALE": var3,
			"NOISE LAYERS": var9 + var10 + var11 + var12,
			"NOISE X + Y": round(var7 + var8),
		}
		
        document.getElementById('glcanvas').addEventListener('touchmove', (e)=>{ e.preventDefault(); }, false);
        document.addEventListener('CABLES.jsLoaded', function (event) {
            CABLES.patch = new CABLES.Patch({
                patch: CABLES.exportedPatch,
                "prefixAssetPath": "",
                "glCanvasId": "glcanvas",
                "glCanvasResizeToWindow": true,
            });
			CABLES.patch.setVariable("var0",var0)
			CABLES.patch.setVariable("var1",var1)
			CABLES.patch.setVariable("var2",var2)
			CABLES.patch.setVariable("var3",var3)
			CABLES.patch.setVariable("var4",var4)
			CABLES.patch.setVariable("var5",var5)
			CABLES.patch.setVariable("var6",var6)
			CABLES.patch.setVariable("var7",var7)
			CABLES.patch.setVariable("var8",var8)
			CABLES.patch.setVariable("var9",var9)
			CABLES.patch.setVariable("var10",var10)
			CABLES.patch.setVariable("var11",var11)
			CABLES.patch.setVariable("var12",var12)
			CABLES.patch.setVariable("var13",var13)
        });
    </script>
</body>

</html>
