<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>GLSL</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        html,body,canvas {
            width: 100%;
            height: 100%;
            background: black;
        }
    </style>

    <script id="fxhash-snippet">
      let alphabet = "123456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ"
      var fxhash = new URLSearchParams(window.location.search).get('fxhash')
      let b58dec = str=>[...str].reduce((p,c)=>p*alphabet.length+alphabet.indexOf(c)|0, 0)
      let fxhashTrunc = fxhash.slice(2)
      let regex = new RegExp(".{" + ((fxhashTrunc.length/4)|0) + "}", 'g')
      let hashes = fxhashTrunc.match(regex).map(h => b58dec(h))
      let sfc32 = (a, b, c, d) => {
        return () => {
          a |= 0; b |= 0; c |= 0; d |= 0
          var t = (a + b | 0) + d | 0
          d = d + 1 | 0
          a = b ^ b >>> 9
          b = c + (c << 3) | 0
          c = c << 21 | c >>> 11
          c = c + t | 0
          return (t >>> 0) / 4294967296
        }
      }
      var fxrand = sfc32(...hashes)
      // used to get features during token mint
      window.addEventListener("message", (event) => {
        if (event.data === "fxhash_getFeatures") {
          parent.postMessage({
            id: "fxhash_getFeatures",
            data: window.$fxhashFeatures
          }, "*")
        }
      })
      var isFxpreview = new URLSearchParams(window.location.search).get('preview') === "1"
      function fxpreview() {
        window.dispatchEvent(new Event("fxhash-preview"))
        setTimeout(() => fxpreview(), 500)
      }
</script>
</head>
<body>
    <canvas id="shader"></canvas>
    <script>
    
    function registerFeatures(features) {
      (window).$fxhashFeatures = features;
    }

    const alpha = fxrand();
    const beta = fxrand();
    const gamma = fxrand();

    function setupCanvas(canvas) {
      // Get the device pixel ratio, falling back to 1.
      var dpr = window.devicePixelRatio || 1;
      // Get the size of the canvas in CSS pixels.
      var rect = canvas.getBoundingClientRect();
      // Give the canvas pixel dimensions of their CSS
      // size * the device pixel ratio.
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      var ctx = canvas.getContext('webgl');
      // Scale all drawing operations by the dpr, so you
      // don't have to worry about the difference.
      // ctx.scale(dpr, dpr);
      return ctx;
    }

fetch("shader.glsl")
    .then((res) => res.text())
    .then((fragCode) => {

      registerFeatures({ alpha, beta, gamma })

        const canvas = document.querySelector("#shader");
        const gl = setupCanvas(canvas);

        const verts = [
            -1,  1,
            1,  1,
            1, -1,
            -1, -1,
        ];

        const indices = [0, 1, 3, 1, 2, 3];
        const vbuf = gl.createBuffer();

        gl.bindBuffer(gl.ARRAY_BUFFER, vbuf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(verts), gl.STATIC_DRAW);
        gl.bindBuffer(gl.ARRAY_BUFFER, null);

        const ibuf = gl.createBuffer();

        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibuf);
        gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(indices), gl.STATIC_DRAW);
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, null);

        const vertCode =
        'attribute vec2 v_pos;' +
        'varying vec2 a_pos;' +
            
        'void main(void) {' +
            'a_pos = v_pos;' +
            'gl_Position = vec4(v_pos, 0.0, 1.0);' +
        '}';

        const vertShader = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vertShader, vertCode);
        gl.compileShader(vertShader);

        const fragShader = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fragShader, fragCode); 
        gl.compileShader(fragShader);

        const msg = gl.getShaderInfoLog(fragShader);

        if (msg) console.error(msg);

        const prog = gl.createProgram();

        gl.attachShader(prog, vertShader);
        gl.attachShader(prog, fragShader);
        gl.linkProgram(prog);
        gl.useProgram(prog);
        gl.bindBuffer(gl.ARRAY_BUFFER, vbuf);
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibuf);
        const coord = gl.getAttribLocation(prog, "v_pos");
        gl.vertexAttribPointer(coord, 2, gl.FLOAT, false, 0, 0); 
        gl.enableVertexAttribArray(coord);

        gl.clearColor(0, 0, 0, 1);
        gl.viewport(0, 0, canvas.width, canvas.height );
        gl.enable(gl.DEPTH_TEST);

        const alphaLoc = gl.getUniformLocation(prog, "iAlpha");
        const betaLoc = gl.getUniformLocation(prog, "iBeta");
        const gammaLoc = gl.getUniformLocation(prog, "iGamma");
        const timeLoc = gl.getUniformLocation(prog, "iTime");
        const mouseLoc = gl.getUniformLocation(prog, "iMouse");
        const resolutionLoc = gl.getUniformLocation(prog, "iResolution");
        let mouseX = 0;
        let mouseY = 0;

        canvas.addEventListener("mousemove", (e) => {
            mouseX = e.clientX / canvas.width;
            mouseY = 1.0 - e.clientY / canvas.height;
        })

        const frame = (t) => {
            gl.uniform1f(alphaLoc, alpha);
            gl.uniform1f(betaLoc, beta);
            gl.uniform1f(gammaLoc, gamma);
          
            gl.uniform1f(timeLoc, t / 1000);
            gl.uniform2f(mouseLoc, mouseX, mouseY);
            gl.uniform2f(resolutionLoc, canvas.width, canvas.height);
            gl.clear(gl.COLOR_BUFFER_BIT);
            gl.drawElements(gl.TRIANGLES, indices.length, gl.UNSIGNED_SHORT, 0);
            requestAnimationFrame(frame);
        };

        frame();

    })
    .catch(console.error);

    </script>
</body>
</html>
