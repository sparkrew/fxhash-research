    <script id="fxhash-snippet">
      let alphabet = "123456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ"
      var fxhash = new URLSearchParams(window.location.search).get('fxhash')
      let b58dec = str=>[...str].reduce((p,c)=>p*alphabet.length+alphabet.indexOf(c)|0, 0)
      let fxhashTrunc = fxhash.slice(2)
      let regex = new RegExp(".{" + ((fxhashTrunc.length/4)|0) + "}", 'g')
      let hashes = fxhashTrunc.match(regex).map(h => b58dec(h))
      let sfc32 = (a, b, c, d) => {
        return () => {
          a |= 0; b |= 0; c |= 0; d |= 0
          var t = (a + b | 0) + d | 0
          d = d + 1 | 0
          a = b ^ b >>> 9
          b = c + (c << 3) | 0
          c = c << 21 | c >>> 11
          c = c + t | 0
          return (t >>> 0) / 4294967296
        }
      }
      var fxrand = sfc32(...hashes)
      // used to get features during token mint
      window.addEventListener("message", (event) => {
        if (event.data === "fxhash_getFeatures") {
          parent.postMessage({
            id: "fxhash_getFeatures",
            data: window.$fxhashFeatures
          }, "*")
        }
      })
      var isFxpreview = new URLSearchParams(window.location.search).get('preview') === "1"
      function fxpreview() {
        window.dispatchEvent(new Event("fxhash-preview"))
        setTimeout(() => fxpreview(), 500)
      }
</script>

// an empty array
var selected3 = [];

// 7 because you said you wanted
while (selected.length < 4) {

}
selected.push(null, null);
// 7 because you said you wanted
while (selected2.length < 7) {

}
selected2.push(null, null, null);

//sets up the synth and background

    v7 = new Tone.Volume(-15); //snare 15
  pL = new Tone.Panner(-0.4).toDestination();
  pR = new Tone.Panner(0.4).toDestination();
   pL2 = new Tone.Panner(-0.2).toDestination();
  pR2 = new Tone.Panner(0.2).toDestination();
       pL3 = new Tone.Panner(-0.1).toDestination();
  pR3 = new Tone.Panner(0.1).toDestination();

  synth = new Tone.FMSynth({
    "harmonicity": 1,

});

});

    },

perc2.chain(v4, pL2);

    //snare

lowPass = new Tone.Filter({

		});

			volume: -10,

			envelope: {
				attack: 0.001,
				decay: 0.13,

snare.chain(lowPass, v7, pL3);

 //kick
gate = new Tone.Gate(-20, 0.2);
comp = new Tone.Compressor(-20, 3);
 kick = new Tone.MembraneSynth( {

//this is the loop
function song(time) {
  if (counter  === 1) {
    var random1 = Math.floor(Math.random() * selected.length);
    synth.triggerAttackRelease(selected[random1], "2n", time, -15);
       kick.triggerAttackRelease("e1", "4n", time, -5);
