    <script id="fxhash-snippet">
    //---- do not edit the following code (you can indent as you wish)
    let search = new URLSearchParams(window.location.search)
    let alphabet = "123456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ"
    let b58dec = str=>[...str].reduce((p,c)=>p*alphabet.length+alphabet.indexOf(c)|0, 0)
    // make fxrand from hash
    var fxhash = search.get('fxhash') || "oo" + Array(49).fill(0).map(_=>alphabet[(Math.random()*alphabet.length)|0]).join('')
    let fxhashTrunc = fxhash.slice(2)
    let regex = new RegExp(".{" + ((fxhash.length/4)|0) + "}", 'g')
    let hashes = fxhashTrunc.match(regex).map(h => b58dec(h))
    let sfc32 = (a, b, c, d) => {
      return () => {
        a |= 0; b |= 0; c |= 0; d |= 0
        var t = (a + b | 0) + d | 0
        d = d + 1 | 0
        a = b ^ b >>> 9
        b = c + (c << 3) | 0
        c = c << 21 | c >>> 11
        c = c + t | 0
        return (t >>> 0) / 4294967296
      }
    }
    var fxrand = sfc32(...hashes)
    // make fxrandminter from minter address
    var fxminter = search.get('fxminter') || "tz1" + Array(33).fill(0).map(_=>alphabet[(Math.random()*alphabet.length)|0]).join('')
    let fxminterTrunc = fxminter.slice(3)
    regex = new RegExp(".{" + ((fxminterTrunc.length/4)|0) + "}", 'g')
    hashes = fxminterTrunc.match(regex).map(h => b58dec(h))
    var fxrandminter = sfc32(...hashes)
    // true if preview mode active, false otherwise
    // you can append preview=1 to the URL to simulate preview active
    var isFxpreview = search.get('preview') === "1"
    // call this method to trigger the preview
    function fxpreview() {
      window.dispatchEvent(new Event("fxhash-preview"))
      setTimeout(() => fxpreview(), 500)
    }
    // get the byte params from the URL
    const searchParams = search.get("fxparams")
    let initialInputBytes = searchParams?.replace("0x", "")
    const throttle = (func, delay) => {
      let isThrottled = false

      return function (...args) {
        if (!isThrottled) {
          func.apply(this, args)
          isThrottled = true
          
          setTimeout(() => {
            isThrottled = false
          }, delay)
        }
      }
    }

    const stringToHex = (s) => {
      let rtn = ""
      for (let i = 0; i < s.length; i++) {
        rtn += s.charCodeAt(i).toString(16).padStart(4, "0")
      }
      return rtn
    }

    const completeHexColor = (hexCode) => {
      let hex = hexCode.replace("#", "")
      if (hex.length === 6) {
        hex = `${hex}ff`
      }
      if (hex.length === 3) {
        hex = `${hex[0]}${hex[0]}${hex[1]}${hex[1]}${hex[2]}${hex[2]}ff`
      }
      return hex
    }

    // the parameter processor, used to parse fxparams
    const processors = {
      number: {
        serialize: (input) => {
          const view = new DataView(new ArrayBuffer(8))
          view.setFloat64(0, input)
          return view.getBigUint64(0).toString(16).padStart(16, "0")
        },
        deserialize: (input) => {
          const view = new DataView(new ArrayBuffer(8))
          for (let i = 0; i < 8; i++) {
            view.setUint8(i, parseInt(input.substring(i * 2, i * 2 + 2), 16))
          }
          return view.getFloat64(0)
        },
        bytesLength: () => 8,
        constrain: (value, definition) => {
          let min = Number.MIN_SAFE_INTEGER
          if (typeof definition.options?.min !== "undefined")
            min = Number(definition.options.min)
          let max = Number.MAX_SAFE_INTEGER
          if (typeof definition.options?.max !== "undefined")
            max = Number(definition.options.max)
          max = Math.min(max, Number.MAX_SAFE_INTEGER)
          min = Math.max(min, Number.MIN_SAFE_INTEGER)
          const v = Math.min(Math.max(value, min), max)
          if (definition?.options?.step) {
            const t = 1.0 / definition?.options?.step
            return Math.round(v * t) / t
          }
          return v
        },
        random: (definition) => {
          let min = Number.MIN_SAFE_INTEGER
          if (typeof definition.options?.min !== "undefined")
            min = Number(definition.options.min)
          let max = Number.MAX_SAFE_INTEGER
          if (typeof definition.options?.max !== "undefined")
            max = Number(definition.options.max)
          max = Math.min(max, Number.MAX_SAFE_INTEGER)
          min = Math.max(min, Number.MIN_SAFE_INTEGER)
          const v = Math.random() * (max - min) + min
          if (definition?.options?.step) {
            const t = 1.0 / definition?.options?.step
            return Math.round(v * t) / t
          }
          return v
        },
      },
      bigint: {
        serialize: (input) => {
          const view = new DataView(new ArrayBuffer(8))
          view.setBigInt64(0, BigInt(input))
          return view.getBigUint64(0).toString(16).padStart(16, "0")
        },
        deserialize: (input) => {
          const view = new DataView(new ArrayBuffer(8))
          for (let i = 0; i < 8; i++) {
            view.setUint8(i, parseInt(input.substring(i * 2, i * 2 + 2), 16))
          }
          return view.getBigInt64(0)
        },
        bytesLength: () => 8,
        random: (definition) => {
          const MIN_SAFE_INT64 = -9223372036854775808n
          const MAX_SAFE_INT64 = 9223372036854775807n
          let min = MIN_SAFE_INT64
          let max = MAX_SAFE_INT64
          if (typeof definition.options?.min !== "undefined")
            min = BigInt(definition.options.min)
          if (typeof definition.options?.max !== "undefined")
            max = BigInt(definition.options.max)
          const range = max - min
          const bits = range.toString(2).length
          let random
          do {
            random = BigInt(
              "0b" +
                Array.from(
                  crypto.getRandomValues(new Uint8Array(Math.ceil(bits / 8)))
                )
                  .map((b) => b.toString(2).padStart(8, "0"))
                  .join("")
            )
          } while (random > range)
          return random + min
        },
      },
      boolean: {
        serialize: (input) =>
          (typeof input === "boolean" && input) ||
          (typeof input === "string" && input === "true")
            ? "01"
            : "00",
        // if value is "00" -> 0 -> false, otherwise we consider it's 1
        deserialize: (input) => {
          return input === "00" ? false : true
        },
        bytesLength: () => 1,
        random: () => Math.random() < 0.5,
      },
      color: {
        serialize: (input) => {
          return completeHexColor(input)
        },
        deserialize: (input) => input,
        bytesLength: () => 4,
        transform: (input) => {
          const r = parseInt(input.slice(0, 2), 16)
          const g = parseInt(input.slice(2, 4), 16)
          const b = parseInt(input.slice(4, 6), 16)
          const a = parseInt(input.slice(6, 8), 16)
          return {
            hex: {
              rgb: "#" + input.slice(0, 6),
              rgba: "#" + input,
            },
            obj: {
              rgb: { r, g, b },
              rgba: { r, g, b, a },
            },
            arr: {
              rgb: [r, g, b],
              rgba: [r, g, b, a],
            },
          }
        },
        constrain: (value, definition) => {
          const hex = value.replace("#", "")
          return hex.slice(0, 8).padEnd(8, "f")
        },
        random: () =>
          `${[...Array(8)]
            .map(() => Math.floor(Math.random() * 16).toString(16))
            .join("")}`,
      },
      string: {
        serialize: (input, def) => {
          let max = 64
          if (typeof def.options?.maxLength !== "undefined")
            max = Number(def.options.maxLength)
          let hex = stringToHex(input.substring(0, max))
          hex = hex.padEnd(max * 4, "0")
          return hex
        },
        deserialize: (input) => {
          const hx = input.match(/.{1,4}/g) || []
          let rtn = ""
          for (let i = 0; i < hx.length; i++) {
            const int = parseInt(hx[i], 16)
            if (int === 0) break
            rtn += String.fromCharCode(int)
          }
          return rtn
        },
        bytesLength: (options) => {
          if (typeof options?.maxLength !== "undefined")
            return Number(options.maxLength) * 2
          return 64 * 2
        },
        constrain: (value, definition) => {
          let min = 0
          if (typeof definition.options?.minLength !== "undefined")
            min = definition.options.minLength
          let max = 64
          if (typeof definition.options?.maxLength !== "undefined")
            max = definition.options.maxLength
          let v = value.slice(0, max)
          if (v.length < min) {
            return v.padEnd(min)
          }
          return v
        },
        random: (definition) => {
          let min = 0
          if (typeof definition.options?.minLength !== "undefined")
            min = definition.options.minLength
          let max = 64
          if (typeof definition.options?.maxLength !== "undefined")
            max = definition.options.maxLength
          const length = Math.round(Math.random() * (max - min) + min)
          return [...Array(length)]
            .map((i) => (~~(Math.random() * 36)).toString(36))
            .join("")
        },
      },
      select: {
        serialize: (input, def) => {
          // find the index of the input in the array of options
          return Math.min(255, def.options?.options?.indexOf(input) || 0)
            .toString(16)
            .padStart(2, "0")
        },
        deserialize: (input, definition) => {
          return (
            definition.options.options[parseInt(input, 16)] ||
            definition.default
          )
        },
        bytesLength: () => 1,
        constrain: (value, definition) => {
          if (definition.options.options.includes(value)) {
            return value
          }
          return definition.options.options[0]
        },
        random: (definition) => {
          const index = Math.round(
            Math.random() * (definition?.options?.options?.length - 1) + 0
          )
          return definition?.options?.options[index]
        },
      },
    }

    // Utility function to get parameter value, default value, or a random value
    const getParamValue = (param, def, processor) => {
      if (typeof param !== "undefined") return param
      if (typeof def.default !== "undefined") return def.default
      return processor.random(def)
    }

    // params are injected into the piece using the binary representation of the
    // numbers, to keep precision
    const serializeParams = (params, definition) => {
      // Initialization of the hex string for parameters
      let hexString = ""
      // If definition is not provided, return an empty hex string
      if (!definition) return hexString
      // Iterating over the definitions
      for (const def of definition) {
        const { id, type } = def
        // Get the processor for the given type
        const processor = processors[type]
        // Get the param value, fall back to default or a random value
        const paramValue = getParamValue(params[id], def, processor)
        // Serialize the param value
        const serializedParam = processor.serialize(paramValue, def)
        // Concatenate serialized params
        hexString += serializedParam
      }
      return hexString
    }

    // takes the parameters as bytes and outputs an object with the
    // deserialized parameters, identified by their id in an object
    const deserializeParams = (bytes, definition) => {
      const params = {}
      for (const def of definition) {
        const processor = processors[def.type]
        // if we don't have any parameters defined in the URL, set the
        // default value and move on
        if (!bytes) {
          let v
          if (typeof def.default === "undefined") v = processor.random(def)
          else v = def.default
          params[def.id] = processor.constrain?.(v, def) || v
          continue
        }
        // extract the length from the bytes & shift the initial bytes string
        const valueBytes = bytes.substring(
          0,
          processor.bytesLength(def?.options) * 2
        )
        bytes = bytes.substring(processor.bytesLength(def?.options) * 2)
        // deserialize the bytes into the params
        const value = processor.deserialize(valueBytes, def)
        params[def.id] = processor.constrain?.(value, def) || value
      }
      return params
    }

    const processParam = (paramId, value, definitions, transformer) => {
      const definition = definitions.find((d) => d.id === paramId)
      const processor = processors[definition.type]
      return processor[transformer]?.(value, definition) || value
    }

    const processParams = (values, definitions, transformer) => {
      const paramValues = {}
      for (const definition of definitions) {
        const processor = processors[definition.type]
        const value = values[definition.id]
        // deserialize the bytes into the params
        paramValues[definition.id] =
          processor[transformer]?.(value, definition) || value
      }
      return paramValues
    }

    window.$fx = {
      _version: "3.1.0",
      _processors: processors,
      // where params def & features will be stored
      _params: undefined,
      _features: undefined,
      // where the parameter values are stored
      _paramValues: {},
      _listeners: {},
      _receiveUpdateParams: async function (newRawValues, onDefault) {
        const handlers = await this.propagateEvent(
          "params:update",
          newRawValues
        )
        handlers.forEach(([optInDefault, onDone]) => {
          if (!(typeof optInDefault == "boolean" && !optInDefault)) {
            this._updateParams(newRawValues)
            onDefault?.()
          }
          onDone?.(optInDefault, newRawValues)
        })
        if (handlers.length === 0) {
          this._updateParams(newRawValues)
          onDefault?.()
        }
      },
      _updateParams: function (newRawValues) {
        const constrained = processParams(
          { ...this._rawValues, ...newRawValues },
          this._params,
          "constrain"
        )
        Object.keys(constrained).forEach((paramId) => {
          this._rawValues[paramId] = constrained[paramId]
        })
        this._paramValues = processParams(
          this._rawValues,
          this._params,
          "transform"
        )
        this._updateInputBytes()
      },
      _updateInputBytes: function () {
        const bytes = serializeParams(this._rawValues, this._params)
        this.inputBytes = bytes
      },
      hash: fxhash,
      rand: fxrand,

      minter: fxminter,
      randminter: fxrandminter,

      iteration: search.get("fxiteration") || 1,
      
      context: search.get("fxcontext") || "standalone",
      preview: fxpreview,
      isPreview: isFxpreview,
      params: function(definition) {
        this._params = definition
        this._rawValues = deserializeParams(initialInputBytes, definition)
        this._paramValues = processParams(
          this._rawValues,
          definition,
          "transform"
        )
        this._updateInputBytes()
      },
      features: function(features) {
        this._features = features
      },
      getFeature: function(id) {
        return this._features[id]
      },
      getFeatures: function() {
        return this._features
      },
      getParam: function(id) {
        return this._paramValues[id]
      },
      getParams: function() {
        return this._paramValues
      },
      getRawParam: function(id) {
        return this._rawValues[id]
      },
      getRawParams: function() {
        return this._rawValues
      },
      getDefinitions: function() {
        return this._params
      },
      stringifyParams: function(params) {
        return JSON.stringify(
          params || this._rawValues,
          (key, value) => {
            if (typeof value === "bigint") return value.toString()
            return value
          }, 
          2,
        )
      },
      on: function (name, callback, onDone) {
        if (!this._listeners[name]) {
          this._listeners[name] = []
        }
        this._listeners[name].push([callback, onDone])
        return () => {
          const index = this._listeners[name].findIndex(
            ([c]) => c === callback
          )
          if (index > -1) {
            this._listeners[name].splice(index, 1)
          }
        }
      },
      propagateEvent: async function (name, data) {
        const results = []
        if (this._listeners?.[name]) {
          for (const [callback, onDone] of this._listeners[name]) {
            const result = callback(data)
            results.push([
              result instanceof Promise ? (await result) : result,
              onDone
            ])
          }
        }
        return results
      },
    }
    window.addEventListener("message", (event) => {
      if (event.data === "fxhash_getInfo") {
        parent.postMessage({
          id: "fxhash_getInfo",
          data: { 
            version: window.$fx._version,
            hash: window.$fx.hash,
            features: window.$fx.getFeatures(),
            params: {
              definitions: window.$fx.getDefinitions(),
              values: window.$fx.getRawParams(),
            },
            minter: window.$fx.minter,
            iteration: window.$fx.iteration,
          },
        }, "*")
      }
      if (event.data?.id === "fxhash_params:update") {
        const { params } = event.data.data
        if (params) window.$fx._receiveUpdateParams(params)
      }
    })
    // END NEW

</script>

    <script>
        window.listen = function ({data, getGenerateFunctionsForEmbed}) {

            const search = new URLSearchParams(window.location.search)
            const enableLiveParams = search.get("enableLiveParams");

            const definition = [
                {
                    id: "seed",
                    name: "Seed",
                    type: "select",
                    default: "minter",
                    ...(enableLiveParams) ? {update: "sync",} : {},
                    options: {

                            "minter",

                            "hash",
                        ],
                    }
                },
                {
                    id: "compositionType",
                    name: "Composition type",
                    type: "select",
                    default: "random",
                    ...(enableLiveParams) ? {update: "sync",} : {},
                    options: {

                },
                {
                    id: "background",
                    name: "Background type",
                    type: "select",
                    default: "random",
                    ...(enableLiveParams) ? {update: "sync",} : {},
                    options: {
                        options: ["random", "Horizon 1", "Horizon 2", "Wall 1", "Wall 2"],
                    }
                },
                {
                    id: "colorScheme",
                    name: "Color scheme",
                    type: "select",
                    default: "random",
                    ...(enableLiveParams) ? {update: "sync",} : {},
                    options: {
                        options: [
                            "random",
                            "Clean desert",
                            "Crystal sea",
                            "Purple dawn",
                            "Night pasture",
                            "Rapeseed field",
                            "Blood orange",
                            "Lavender ice cream",
                            "Royal velvet",
                            "Rose and gray",
                        ],
                    }
                },
                {
                    id: "objectDim",
                    name: "Object dimension",
                    type: "select",
                    default: "random",
                    ...(enableLiveParams) ? {update: "sync",} : {},
                    options: {
                        options: ["random", "Thin", "Medium", "Thick"],
                    }
                },
                {
                    id: "licencePlateText",
                    name: "Licence plate",
                    type: "string",
                    default: "random",
                    ...(enableLiveParams) ? {update: "sync",} : {},
                    options: {
                        minLength: 0,
                        maxLength: 8,
                    },
                }
            ];

            $fx.params(definition);

            const params = {
                ...$fx.getParams ? $fx.getParams() : {}
            }

            let project = {};

            function updateData(p = {}) {

                const search = new URLSearchParams(window.location.search)

                const {
                    randomFunction,
                    hash,
                    params,
                    disableFirstAnimation = (window.isFxpreview || search.get('preview') === "1"),
                    disableFirstRunAnimation = (window.isFxpreview || search.get('preview') === "1")
                } = p;

                const {generateCompositions, generateRenderProps} = getGenerateFunctionsForEmbed({randomFunction})

                const fxparams = search.get('fxparams');
                if (fxparams || Object.keys(params).length) {
                    console.log("[APP]", "$fx.params:", params, fxparams, definition)
                }

                const {analytics, compositions} = generateCompositions({generateType: data.attributes["data-generatetype"], ...params, hash});
                const renderProps = generateRenderProps({generateType: data.attributes["data-generatetype"], ...params, hash});

                data.randomFunction = randomFunction;
                data.hash = hash;
                data.params = Object.keys(params).length ? params : null

                data.compositions = compositions;
                data.renderProps = renderProps;
                data.analytics = analytics;

                data.disableFirstAnimation = disableFirstAnimation
                data.disableFirstRunAnimation = disableFirstRunAnimation

                $fx.features({
                    ...analytics
                })

                console.log("[APP]", "$fx.features:", $fx.getFeatures())

                data.onComplete = async (p = {})=>{

                    const needToShowControls = project.needToShowControls;
                    project = p;

                    if (window.isFxpreview || search.get('preview') === "1"){
                        if (typeof fxpreview === "function"){
                            await new Promise((resolve) => setTimeout(resolve, 1000))
                            fxpreview()
                            await new Promise((resolve) => setTimeout(resolve, 1000))
                        } else {
                            throw "[APP] Missing fxpreview function"
                        }
                    } else {
                        if (needToShowControls && project.showControls) {
                            project.showControls();
                        }
                        const {canvasTextRenderer} = p;
                        if (canvasTextRenderer && window.ascii) {
                            canvasTextRenderer();
                        }
                    }
                }

            }

            async function update(p = {}) {

                const {initial, showControls, ...rest} = p;

                if (!initial) {

                    try {

                        let alphabet = "123456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ"
                        let b58dec = str => [...str].reduce((p, c) => p * alphabet.length + alphabet.indexOf(c) | 0, 0)
                        let fxhashTrunc = fxhash.slice(2)
                        let regex = new RegExp(".{" + ((fxhash.length / 4) | 0) + "}", 'g')
                        let hashes = fxhashTrunc.match(regex).map(h => b58dec(h))
                        let sfc32 = (a, b, c, d) => {
                            return () => {
                                a |= 0;
                                b |= 0;
                                c |= 0;
                                d |= 0
                                var t = (a + b | 0) + d | 0
                                d = d + 1 | 0
                                a = b ^ b >>> 9
                                b = c + (c << 3) | 0
                                c = c << 21 | c >>> 11
                                c = c + t | 0
                                return (t >>> 0) / 4294967296
                            }
                        }
                        fxrand = sfc32(...hashes)
                        let fxminterTrunc = fxminter.slice(3)
                        regex = new RegExp(".{" + ((fxminterTrunc.length / 4) | 0) + "}", 'g')
                        hashes = fxminterTrunc.match(regex).map(h => b58dec(h))
                        fxrandminter = sfc32(...hashes)

                        $fx.rand = fxrand;
                        $fx.randminter = fxrandminter;

                        console.log("[APP]", "Live params, the seed has been reseted")

                    } catch (e) {
                        console.log(e)
                    }

                }

                let randomFunction = (typeof $fx.rand === "function") ? $fx.rand : null;
                let hash = $fx.hash;

                if (params.seed === "minter" || params.seed && params.seed.startsWith("minter")) {
                    if ($fx.minter) {
                        console.log("[APP]", "$fx.minter:", $fx.minter)
                        randomFunction = (typeof $fx.randminter === "function") ? $fx.randminter : null;
                        hash = $fx.minter;
                    }
                } else {
                    if ($fx.hash) {
                        console.log("[APP]", "$fx.hash:", $fx.hash)
                    }
                }

                if (randomFunction && hash) {

                    console.log("[APP]", "Updating data...", /*$fx.getParams(),*/ params);

                    updateData({randomFunction, hash, params, ...rest});

                    if (project.updateExternalSettings && !initial) {

                        if (showControls) {
                            project.needToShowControls = true;
                        }

                        console.log("[APP]", "Applying live params...")

                        await project.updateExternalSettings({
                            params: data.params,
                            randomFunction: data.randomFunction,
                            hash: data.hash,
                            disableFirstAnimation: data.disableFirstAnimation,
                            disableFirstRunAnimation: data.disableFirstRunAnimation,
                        })

                    }

                } else {
                    throw "[APP] Missing random function"
                }
            }

            if (enableLiveParams) {

                $fx.on(
                    "params:update",
                    (newValues) => {
                        if (newValues) {
                            Object.keys(newValues).forEach((key) => {
                                params[key] = newValues[key];
                            })
                        }
                        return true;
                    },
                    () => update({
                        disableFirstAnimation: true,
                        disableFirstRunAnimation: true,
                        showControls: true
                    }),
                )

            }

            update({initial: true});

        }
    </script>

</head>
