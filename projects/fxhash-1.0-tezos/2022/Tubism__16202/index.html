<!DOCTYPE html>
<html>
  <head>
    <title>FXHASH project</title>
    <script id="fxhash-snippet">
      let alphabet = "123456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ"
      var fxhash = new URLSearchParams(window.location.search).get('fxhash')
      let b58dec = str=>[...str].reduce((p,c)=>p*alphabet.length+alphabet.indexOf(c)|0, 0)
      let fxhashTrunc = fxhash.slice(2)
      let regex = new RegExp(".{" + ((fxhashTrunc.length/4)|0) + "}", 'g')
      let hashes = fxhashTrunc.match(regex).map(h => b58dec(h))
      let sfc32 = (a, b, c, d) => {
        return () => {
          a |= 0; b |= 0; c |= 0; d |= 0
          var t = (a + b | 0) + d | 0
          d = d + 1 | 0
          a = b ^ b >>> 9
          b = c + (c << 3) | 0
          c = c << 21 | c >>> 11
          c = c + t | 0
          return (t >>> 0) / 4294967296
        }
      }
      var fxrand = sfc32(...hashes)
      // used to get features during token mint
      window.addEventListener("message", (event) => {
        if (event.data === "fxhash_getFeatures") {
          parent.postMessage({
            id: "fxhash_getFeatures",
            data: window.$fxhashFeatures
          }, "*")
        }
      })
      var isFxpreview = new URLSearchParams(window.location.search).get('preview') === "1"
      function fxpreview() {
        window.dispatchEvent(new Event("fxhash-preview"))
        setTimeout(() => fxpreview(), 500)
      }
</script>

    
  </head>

  <body onload="render()">
    <script>
      // Generative Art License
      // ======================
      // Copyright (C) 2022 Vivek Nagarajan (rep.movsd@gmail.com)
      // The following code is derived from https://dwitter.net/d/25399 of which I am the author
      function render()
      {
        x=document.querySelector("#c").getContext("2d")
        Z=fxrand()/2,W=H=2048,C=Math.cos,S=Math.sin,t=0,K=fxrand
        x.fillRect(0,0,W,H)

        RR = ((.1+fxrand()*4)*100|0)/100;
        ZZ = k => k * (C(t*RR)+1)/2

        C1=K()*.9+.3
        C2=K()*.9+.3
        C3=K()*.9+.3

        PS=[
          ()=>[C1, C2, C3],
          (t)=>[ZZ(C1), C2, C3],
          (t)=>[C1, ZZ(C2), C3],
          (t)=>[C1, C2, ZZ(C3)],

          (t)=>[ZZ(C1), ZZ(C2), C3],
          (t)=>[C1, ZZ(C2), ZZ(C3)],
          (t)=>[ZZ(C1), C2, ZZ(C3)],

          ()=>[1.2,.4,.4],
          ()=>[.1,.8,.1],
          ()=>[.3,.5,2],
          ()=>[1,1.2,0],
          ()=>[0,1,1],
          ()=>[1,0,1],
          ()=>[1,1,1]
        ];

        D=K()*25+25|0
        P = PS[PP=K()*PS.length|0]

        window.$fxhashFeatures = {D, PP, RR}

        const loop = () =>
        {
          if(f(t))
            requestAnimationFrame(loop);
          else
            fxpreview();
        }

        const R = (k) =>
        {
          let [r,g,b] = [k=.6+J*.4,k,k].map((e,i)=>e*P(t)[i]*255|0)
          return `rgb(${r},${g},${b})`
        }

        const f = () =>
        {
          for(i=0;i<100;++i,t+=1/60)
          {
            X=W/2+C(T=t/5)*S(Q=t*Z)*W*.4,Y=H/2+S(T)*C(Q/3)*H*.4
            for(A=0;A<7;A+=.01)
              J=C(A),x.fillStyle=R(J),
              x.fillRect(J*D+X,Y+S(A)*D,8,8)
          }
          return t < 360
        }
        loop();
      }
    </script>
    <canvas id="c" width="2048" height="2048" style="position: absolute; top: 0; left: 0; width: 100%;"></canvas>
  </body>
</html>
