<!DOCTYPE html>
<html>
  <head>
    <title>Genesis</title>
    <script id="fxhash-snippet">
      let alphabet = "123456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ"
      var fxhash = new URLSearchParams(window.location.search).get('fxhash')
      let b58dec = (str) => str.split('').reduce((p,c,i) => p + alphabet.indexOf(c) * (Math.pow(alphabet.length, str.length-i-1)), 0)
      let fxhashTrunc = fxhash.slice(2)
      let regex = new RegExp(".{" + ((fxhashTrunc.length/4)|0) + "}", 'g')
      let hashes = fxhashTrunc.match(regex).map(h => b58dec(h))
      let sfc32 = (a, b, c, d) => {
        return () => {
          a |= 0; b |= 0; c |= 0; d |= 0
          var t = (a + b | 0) + d | 0
          d = d + 1 | 0
          a = b ^ b >>> 9
          b = c + (c << 3) | 0
          c = c << 21 | c >>> 11
          c = c + t | 0
          return (t >>> 0) / 4294967296
        }
      }
      var fxrand = sfc32(...hashes)
      // used to get features during token mint
      window.addEventListener("message", (event) => {
        if (event.data === "fxhash_getFeatures") {
          parent.postMessage({
            id: "fxhash_getFeatures",
            data: window.$fxhashFeatures
          }, "*")
        }
      })
</script>

    <link rel="stylesheet" href="./style.css">

    
  </head>
  <body style="background-color: black;">

    <canvas id="glcanvas" width="100vw" height="100vh" tabindex="1"></canvas>

    <libs></libs>
    <script type="text/javascript" src="./js/patch.js" async></script>
    <corelibs></corelibs>

    <script>
      const rand = fxrand()

      // Features
      function getRGB(value) {
        if (value >= 0.8 && value < 0.95) return "on"
        else return "off"
      }

      function getDither(value) {
        if (value < 0.9) return "on"
        else return "off"
      }

      function getMono(value) {
        if (value >= 0.95) return "on"
        else return "off"
      }

      // disable rubberband effect on mobile devices
      document.getElementById('glcanvas').addEventListener('touchmove', (e)=>{ e.preventDefault(); }, false);


      function patchInitialized(patch) {
        // You can now access the patch object (patch), register variable watchers and so on
      }

      function patchFinishedLoading(patch) {
        // The patch is ready now, all assets have been loaded
      }

      window.$fxhashFeatures = {
        "RGB": getRGB(rand),
        "Dither": getDither(rand),
        "Monochrome": getMono(rand)
      }

      document.addEventListener('CABLES.jsLoaded', function (event) {
        CABLES.patch = new CABLES.Patch({
          patch: CABLES.exportedPatch,
          prefixAssetPath: '',
          glCanvasId: 'glcanvas',
          glCanvasResizeToWindow: true,
          onPatchLoaded: patchInitialized,
          onFinishedLoading: patchFinishedLoading,
        });
        CABLES.patch.setVariable("fxhash",rand)
      });
    </script>


  </body>

</html>
