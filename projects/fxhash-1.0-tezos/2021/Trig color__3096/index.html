<!doctype html><html><head><title>bub</title><link rel="stylesheet" href="style.css"><meta charset="utf-8"><meta charset="utf-8"><script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/addons/p5.sound.min.js"></script><script id="fxhash-snippet">
      let alphabet = "123456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ"
      var fxhash = new URLSearchParams(window.location.search).get('fxhash')
      let b58dec = (str) => str.split('').reduce((p,c,i) => p + alphabet.indexOf(c) * (Math.pow(alphabet.length, str.length-i-1)), 0)
      let fxhashTrunc = fxhash.slice(2)
      let regex = new RegExp(".{" + ((fxhashTrunc.length/4)|0) + "}", 'g')
      let hashes = fxhashTrunc.match(regex).map(h => b58dec(h))
      let sfc32 = (a, b, c, d) => {
        return () => {
          a |= 0; b |= 0; c |= 0; d |= 0
          var t = (a + b | 0) + d | 0
          d = d + 1 | 0
          a = b ^ b >>> 9
          b = c + (c << 3) | 0
          c = c << 21 | c >>> 11
          c = c + t | 0
          return (t >>> 0) / 4294967296
        }
      }
      var fxrand = sfc32(...hashes)
      // used to get features during token mint
      window.addEventListener("message", (event) => {
        if (event.data === "fxhash_getFeatures") {
          parent.postMessage({
            id: "fxhash_getFeatures",
            data: window.$fxhashFeatures
          }, "*")
        }
      })
</script><script></script><link rel="stylesheet" href="./style.css"></head><body style="display: flex; align-items: center; justify-content: center;"><script>let symmetry = 6;

let angle = 360 / symmetry;
function mathRandom( min, max) {
  
 min = Math.ceil(min);
  max = Math.floor(max);
  return Math.floor(fxrand() * (max - min)) + min;
}
function setup() {
  createCanvas(800, 800);
  //angleMode(DEGREES);
  background(000);
  frameRate(2)
   levels= 1;
  crescente=true;
}


function trig(x, y, a, l) {
  let x2 = x + cos(PI/3) * a;
  let y2 = y + sin(PI/3) * a;

  let x3 = x + cos(2 * PI/3) * a;
  let y3 = y + sin(2 * PI/3) * a;

  fill(mathRandom(0,255), mathRandom(0, 255), mathRandom(0, 255));
  triangle(x, y, x2, y2, x3, y3);

  fill(mathRandom(0,255), mathRandom(0, 255), mathRandom(0, 255));
  triangle((x + x2)/2, (y + y2)/2, (x + x3)/2, (y + y3)/2, x, y3);

  if (l > 1) {
    trig(x, y, a/2, l - 1);
    trig((x + x2)/2, (y + y2)/2, a/2, l - 1);
    trig((x + x3)/2, (y + y3)/2, a/2, l - 1);
  }
}

          levels=levels+1
        }else{
          levels=levels-1
        }
        if(levels==6){
          crescente=false
        }

          crescente=true
