<!DOCTYPE html>
<html>
  <head>
    <title>simple</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="./fxhash.min.js"></script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    
    <div class="ui">
      <div class="button-container fade-out">
        <button id="start" class="svg-button" style="background: none; border: none; cursor: pointer; padding: 0; width: 100%; max-width: 100px;">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 40" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
            <!-- Button outline -->
            <rect class="button-element" x="3" y="3" width="94" height="34" rx="17" 
                  fill="none" stroke="#4A4A4A" stroke-width="3" />
            
            <!-- Squiggly line with more oscillations -->
            <path class="button-element" d="M20 20 Q25 10 30 20 T40 20 T50 20 T60 20 T70 20 T80 20" 
                  fill="none" stroke="#4A4A4A" stroke-width="3" />
          </svg>
        </button>
    
        <button id="stop" class="svg-button" style="background: none; border: none; cursor: pointer; padding: 0; width: 100%; max-width: 100px;">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 40" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
            <!-- Button outline -->
            <rect class="button-element" x="3" y="3" width="94" height="34" rx="17" 
                  fill="none" stroke="#4A4A4A" stroke-width="3" />
            
            <!-- Straight line -->
            <line class="button-element" x1="20" y1="20" x2="80" y2="20" 
                  stroke="#4A4A4A" stroke-width="3" />
          </svg>
        </button>
      </div>
    </div>
    
    <canvas class="webgl"></canvas>
    <script src="./index.js"></script>
  </body>
</html>
