		<script id="fxhash-snippet">
      let alphabet = "123456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ"
      var fxhash = new URLSearchParams(window.location.search).get('fxhash')
      let b58dec = str=>[...str].reduce((p,c)=>p*alphabet.length+alphabet.indexOf(c)|0, 0)
      let fxhashTrunc = fxhash.slice(2)
      let regex = new RegExp(".{" + ((fxhashTrunc.length/4)|0) + "}", 'g')
      let hashes = fxhashTrunc.match(regex).map(h => b58dec(h))
      let sfc32 = (a, b, c, d) => {
        return () => {
          a |= 0; b |= 0; c |= 0; d |= 0
          var t = (a + b | 0) + d | 0
          d = d + 1 | 0
          a = b ^ b >>> 9
          b = c + (c << 3) | 0
          c = c << 21 | c >>> 11
          c = c + t | 0
          return (t >>> 0) / 4294967296
        }
      }
      var fxrand = sfc32(...hashes)
      // used to get features during token mint
      window.addEventListener("message", (event) => {
        if (event.data === "fxhash_getFeatures") {
          parent.postMessage({
            id: "fxhash_getFeatures",
            data: window.$fxhashFeatures
          }, "*")
        }
      })
      var isFxpreview = new URLSearchParams(window.location.search).get('preview') === "1"
      function fxpreview() {
        window.dispatchEvent(new Event("fxhash-preview"))
        setTimeout(() => fxpreview(), 500)
      }
</script>

		<script id="fxhash-features">
			function getBlockSize(value) {
				if (value < 0.7) {
					return 0.11;
				}
				return 0.15;
			}

			function getMaterial(value) {
				if (value < 0.5) {
					return 0;
				}
				if (value < 0.9) {
					return 1;
				}
				return 2;
			}

			const seed = fxrand();
			window.$fxhashFeatures = {
				blockSize: getBlockSize(seed),
				material: getMaterial(seed),
			};
		</script>

		<script id="fxhash-preview">
			document.addEventListener('POLYViewerReady', fxpreview);
		</script>

		<script id="load-scene-scene_01" type="module">
			import {loadSceneAndMountAsync_scene_01} from './polygonjs/js/scene_01/loadSceneAndMountAsync.js';

			const container = document.getElementById('polygonjs-progress-bar-container');
			const barElement = document.getElementById('polygonjs-progress-bar');
			const poster = document.getElementById('polygonjs-loading-poster');
			const updateProgressBar = function updateProgressBarTop(progress) {
				if (!(barElement && container && poster)) {
					console.log('progress bar elements missing', barElement, container, poster);
					return;
				}
				if (progress < 1) {
					const percent = Math.round(progress * 100) + '%';
					barElement.style.width = percent;
				} else {
					// when we reach 1, we can remove the progress bar and fade out the poster
					if (container.parentElement) {
						container.parentElement.removeChild(container);
					}
					if (poster) {
						poster.classList.add('fade-out');
						setTimeout(() => {
							if (poster.parentElement) {
								poster.parentElement.removeChild(poster);
							}
						}, 1200);
					}
				}
			};

			function onProgress(progress) {
				if (window.POLY && window.POLY.onLoadingProgress_scene_01) {
					window.POLY.onLoadingProgress_scene_01(progress);
				}
				updateProgressBar(progress);
			}

			document.addEventListener('DOMContentLoaded', async () => {
				const domElement = document.getElementById('polygonjs-app-scene_01');
				if (!domElement) {
					console.error("element 'polygonjs-app-scene_01' not found");
					return;
				}
				const loadedData = await loadSceneAndMountAsync_scene_01({
					autoPlay: true,
					onProgress,
					domElement,
					moduleImportSuffix: '.js',
				});
				if (window.POLY && window.POLY.onSceneReady_scene_01) {
					window.POLY.onSceneReady_scene_01(loadedData);
				}
			});
		</script>
