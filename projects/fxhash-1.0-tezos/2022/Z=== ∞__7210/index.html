<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="author" content="jimpunk.com">
<script id="fxhash-snippet">
      let alphabet = "123456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ"
      var fxhash = new URLSearchParams(window.location.search).get('fxhash')
      let b58dec = str=>[...str].reduce((p,c)=>p*alphabet.length+alphabet.indexOf(c)|0, 0)
      let fxhashTrunc = fxhash.slice(2)
      let regex = new RegExp(".{" + ((fxhashTrunc.length/4)|0) + "}", 'g')
      let hashes = fxhashTrunc.match(regex).map(h => b58dec(h))
      let sfc32 = (a, b, c, d) => {
        return () => {
          a |= 0; b |= 0; c |= 0; d |= 0
          var t = (a + b | 0) + d | 0
          d = d + 1 | 0
          a = b ^ b >>> 9
          b = c + (c << 3) | 0
          c = c << 21 | c >>> 11
          c = c + t | 0
          return (t >>> 0) / 4294967296
        }
      }
      var fxrand = sfc32(...hashes)
      // used to get features during token mint
      window.addEventListener("message", (event) => {
        if (event.data === "fxhash_getFeatures") {
          parent.postMessage({
            id: "fxhash_getFeatures",
            data: window.$fxhashFeatures
          }, "*")
        }
      })
      var isFxpreview = new URLSearchParams(window.location.search).get('preview') === "1"
      function fxpreview() {
        window.dispatchEvent(new Event("fxhash-preview"))
        setTimeout(() => fxpreview(), 500)
      }
</script>
<style>
@font-face {
  font-family: 'zx_spectrum';
  src: url('./zx_spectrum-7.ttf') format('truetype');
}
body { 
  background-color: #ffffff;
  padding:0 ;
  margin: 0 ;
  width:100vw;
  height:100vh;
  overflow:hidden;
}
#XXXXXXX {
	display:block;
	width: 100%;
	height: 100%;
	margin:auto;
	top:0;
	bottom:0;
	right:0;
	left:0;
	overflow:auto;
	position:fixed;
	object-fit:contain;
	font-family:zx_spectrum !important;
}
</style>

</head>

<body  >
<canvas id="XXXXXXX"  width="900" height="900" ></canvas>
<script type="text/javascript">
    let f = new FontFace('zx_spectrum', 'url(./zx_spectrum-7.ttf)');

	var canvas = document.getElementById('XXXXXXX');	
	var ctx = canvas.getContext('2d');
    
	function getRandomColor(){
    var letters = '0123456789ABCDEF';
    var color = '#';
    for (var i = 0; i < 6; i++) {
        color += letters[Math.floor(fxrand() * 16)];
    }
    return color;
	}
		
	var zx = ["`","%","-",")","/","?","{","}","³","љ","+","¢","´","*",">",":","(",".",";","<","_","=","›","]","—","^","˜","ƒ","|","‡","…","[","ˆ","‰","”","“","¦","•","–","¬","¤","µ","§","¨","°","г","Ф","д","м","х","э","«","ї","ђ","¶","¸","¹","·","º","»","¿","Ý","Ð","ñ","Ѓ","ø","ö","Љ","Д","џ","Ц","Ø","×","Ж","Х","њ","Ш","Ч","Щ","Ю","ћ","л","$","жҐ","о","Ґ","с","т","ф","ю","ц","!","ч","ш","щ","#","ѓ","ґ","−","−","−","−","−"];

	var x1 = 1;
	var y1 = 650;
	var x2 = 200;
	var y2 = 390;
	var x3 = 450;
	var y3 = 510;
	var x4 = 600;
	var y4 = 390;
	var x5 = 899;
	var y5 = 650;
	var x6 = 450;
	var y6 = 680;

	var size1 = Math.floor(fxrand() *  70) + 730;
	var size2 = Math.floor(fxrand() *  60) + 220;
	var size3 = Math.floor(fxrand() *  55) + 230;
	var size4 = Math.floor(fxrand() *  60) + 220;
	var size5 = Math.floor(fxrand() *  70) + 730;
	var size6 = Math.floor(fxrand() *  45) + 180;
	
	var font = ["zx_spectrum"];
	var randomColor1 = getRandomColor();
	var randomColor2 = getRandomColor();
	var zxcolor = randomColor1;
	var bgcolor = randomColor2;

	var zx_1 = zx[Math.floor(fxrand() * 100 >> 0)];
	var zx_2 = zx[Math.floor(fxrand() * 100 >> 0)];
	var zx_3 = zx[Math.floor(fxrand() * 100 >> 0)];
	var zx_4 = zx[Math.floor(fxrand() * 100 >> 0)];
	var zx_5 = zx[Math.floor(fxrand() * 100 >> 0)];
	var zx_6 = zx[Math.floor(fxrand() * 100 >> 0)];
		
	ctx.beginPath();
	ctx.rect(0, 0, 900, 900);
	ctx.fillStyle = bgcolor;
	ctx.fill();
	
	f.load().then(function() {
	ctx.fillStyle = zxcolor;
	ctx.font=size1+"px '"+font+"'";ctx.textAlign="left";ctx.fillText(zx_1, x1, y1);
	ctx.font=size2+"px '"+font+"'";ctx.fillText(zx_2, x2, y2);
	ctx.font=size3+"px '"+font+"'";ctx.textAlign="center";ctx.fillText(zx_3, x3, y3);
	ctx.font=size4+"px '"+font+"'";ctx.fillText(zx_4, x4, y4);
	ctx.font=size5+"px '"+font+"'";ctx.textAlign="right";ctx.fillText(zx_5, x5, y5);
	ctx.font=size6+"px '"+font+"'";ctx.textAlign="center";ctx.fillText(zx_6, x6, y6);
	});

	window.$fxhashFeatures = {
	"." : zx_1,
	".." : zx_2,
	"..." : zx_3,
	"...." : zx_4,
	"....." : zx_5,
	"......" : zx_6,
	"=" : zx_1+zx_2+zx_3+zx_4+zx_5+zx_6,
	"bgcolor" : bgcolor,
	"color" : zxcolor,
	};
</script>

</body>
