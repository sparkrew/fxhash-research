    <script id="fxhash-snippet">
      let alphabet = "123456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ"
      var fxhash = new URLSearchParams(window.location.search).get('fxhash')
      let b58dec = str=>[...str].reduce((p,c)=>p*alphabet.length+alphabet.indexOf(c)|0, 0)
      let fxhashTrunc = fxhash.slice(2)
      let regex = new RegExp(".{" + ((fxhashTrunc.length/4)|0) + "}", 'g')
      let hashes = fxhashTrunc.match(regex).map(h => b58dec(h))
      let sfc32 = (a, b, c, d) => {
        return () => {
          a |= 0; b |= 0; c |= 0; d |= 0
          var t = (a + b | 0) + d | 0
          d = d + 1 | 0
          a = b ^ b >>> 9
          b = c + (c << 3) | 0
          c = c << 21 | c >>> 11
          c = c + t | 0
          return (t >>> 0) / 4294967296
        }
      }
      var fxrand = sfc32(...hashes)
      // used to get features during token mint
      window.addEventListener("message", (event) => {
        if (event.data === "fxhash_getFeatures") {
          parent.postMessage({
            id: "fxhash_getFeatures",
            data: window.$fxhashFeatures
          }, "*")
        }
      })
      var isFxpreview = new URLSearchParams(window.location.search).get('preview') === "1"
      function fxpreview() {
        window.dispatchEvent(new Event("fxhash-preview"))
        setTimeout(() => fxpreview(), 500)
      }
</script>

	 <script id="fshader" type="text/plain">
	 //precision mediump float;
	 precision highp float;
	 varying vec2 iUv;
	 uniform float iTime, iAspect;
	 
	 // "Vlinders" by Martijn Steinrucken aka The Art of Code - 2021

#define PI 3.141592653589793238
#define TAU 6.283185307179586
#define S01(x, offset, frequency) (sin((x+offset)*frequency*TAU)*.5+.5)
#define SF(x, offset, frequency) sin((x+offset)*frequency*TAU)
#define saturate(x) clamp(x,0.,1.)
#define S smoothstep

uniform vec2 iRes;
uniform vec4 
	iAnt1,  // antenna info (length, bend, curl, smooth)
    iAnt2,  // antenna info (numsegs, segsharp, ..free)
	iBody,  // body info (seg freq/phase, seg amp, dots, width)
    iCol1,  // primary color
    iCol2,  // secondary color
	iDetail,
	iGlobal,
    iN1, iN2, iN3,
	iPattern, 
	iShape, // x=wing rotation, yz drive lots of random shape vars w= if<.2 white dots on body
    iSpecial,// very special traits x=(eyes+starburst) y=(ocelli on hind wing) z=eyespot w=ragged wings
    iSuper; // super special traits x=transparent wings, y=laser eyes z=laser eye color

vec2 hash2( vec2 p ) { p=vec2(dot(p,vec2(127.1,311.7)),dot(p,vec2(269.5,183.3))); return fract(sin(p)*18.5453); }

mat2 Rot(float a) {
    float s=sin(a),c=cos(a);
    return mat2(c,-s,s,c);
}

vec4 hash4(float seed) {
	vec2 n1 = hash2(vec2(seed, sin(seed*123432.2345)));
    vec2 n2 = hash2(n1);
    
    return vec4(n1, n2);
}

// return distance, and cell id
vec2 voronoi( in vec2 x )
{
    vec2 n = floor( x );
    vec2 f = fract( x );

	vec3 m = vec3( 8.0 );
    for( float j=-1.; j<=1.; j++ )		// iterate cell neighbors
    for( float i=-1.; i<=1.; i++ )
    {
        vec2  g = vec2( i, j );			// vector holding offset to current cell
        vec2  o = hash2( n + g );		// unique random offset per cell
      	o.y*=.1;
        vec2  r = g - f + o;			// current pixel pos in local coords
	   
		float d = dot( r, r );			// squared dist from center of local coord system
        
        if( d<m.x )						// if dist is smallest...
            m = vec3( d, o );			// .. save new smallest dist and offset
    }

    return vec2( sqrt(m.x), m.y+m.z );
}

float SpiralDist(float a, float w) {
    return 0.5*(a*sqrt(a*a+w) + w*log(sqrt(a*a+w)+a));
}

vec2 SpiralUv(vec2 p, float start, float r, float width) { 
    if(abs(r)<1e-3) r = 1e-3; // prevent straightline errors
    
    p.x -= start;
    
    float radius = abs(r);
    width = min(width, radius);
    
    float s = sign(r);
    float w = width*.5;
    
    p.y -= r;
    vec2 st = vec2(atan(-p.x, -p.y*-s)+PI, length(p));
    float x = st.x/TAU;
    
    st.y += width*x; // shift concentric rings into spiral
    
    float 
        maxTurns = radius/width,   // total turns from center to straight part
        turns = min(maxTurns, st.y/width); // turns from pixel to straight part
    
    st.y -= radius;
       
    if(p.y*s+radius < st.y  && p.x<=0.) 
        return vec2(p.x+start, p.y+r); 
    
    float 
        a = floor(turns-maxTurns+.5)-x+maxTurns,
        len = SpiralDist(a, width),   // distance of current pixel
        mLen = SpiralDist(maxTurns, width); // maximum distance
      
    st.x = start+(mLen-len)*TAU*width;
    
    if(st.y<w) // only repeat within outer radius
        st.y = mod(st.y+w, width)-w;
    
    st.y *= -s;
    return st;
}

vec3 ArcUv(vec2 p, vec2 A, vec2 P, vec2 B) {
    float e = 1e-3;
    if(abs( A.x*(P.y-B.y)+P.x*(B.y-A.y)+B.x*(A.y-P.y) ) <e)
       P += normalize(vec2(B.y-A.y, A.x-B.x))*e;
    
    float 
        dA = dot(A,A),
        dB = dot(P,P),
        dC = dot(B,B),
        a = A.x*(P.y-B.y)-A.y*(P.x-B.x)+P.x*B.y-B.x*P.y,
        b = dA*(B.y-P.y) + dB*(A.y-B.y) + dC*(P.y-A.y),
        c = dA*(P.x-B.x) + dB*(B.x-A.x) + dC*(A.x-P.x);
    
    vec2 k = vec2(b, c)/(-2.*a);
    vec3 u = vec3(k, length(k-A));
    
    A -= u.xy;
    B -= u.xy;
    P -= u.xy;
    p -= u.xy;
    
    float 
        s = sign( (P.x-B.x)*(A.y-B.y) - (P.y-B.y)*(A.x-B.x) ),
        sA = sign( (A.x-P.x)*A.y - (A.y-P.y)*A.x ),
        sB = sign( (B.x-P.x)*B.y - (B.y-P.y)*B.x ),
        sAB = sign( (A.x-B.x)*A.y - (A.y-B.y)*A.x ),
        h = atan(A.x+B.x, A.y+B.y)-max(sAB*sA, 0.)*max(-sAB*sB, 0.)*PI,
        xp = mod(atan(p.x, p.y)-h, TAU),
        xA = mod(atan(A.x, A.y)-h, TAU),
        xB = mod(atan(B.x, B.y)-h, TAU),
        seg = xB-xA,
        len = seg*u.z,
        x = (xp-xA)/seg,
        y = length(p)-u.z;
    
    return vec3(x, y*s, len*s);
}

vec3 LineUv(vec2 p, vec2 A, vec2 B) {
    vec2 
        AB = B-A, 
        AP = p-A;
        
    float 
        len = length(AB),
        x = dot(AP, AB)/dot(AB,AB),
        y = -dot(AP, vec2(AB.y, -AB.x))/len; 
        
    return vec3(x, y, len);
}

float sfract(float x, float k) {
    return fract(x)*smoothstep(1., 1.-k, fract(x));
}


vec2 Coord(vec2 p, vec2 A, vec2 B) {
    vec2 
        O = (A+B)*.5,
        X = (B-A)*.5,
        Y = vec2(X.y, -X.x);
    
    return O + X*p.x + Y*p.y;
}

vec4 Antenna(vec2 p, vec2 end, float len, float bend, float curl, float numsegs, float segsharp, vec4 baseCol, vec4 accentCol) {
    // inf.xy = bend, curl, numsegs, segsharp
    
    vec4 col = vec4(0);
    
    p = ArcUv(p, vec2(0), Coord(vec2(0), end, vec2(0,bend)), end).rg;
    
    
    float d = length(p.xy-vec2(clamp(p.x,0.,1.), 0));
   // col = mix(col, vec4(1,0,0,1), smoothstep(.005,.0, d)); // center line
    
    // offset so that base of antenna is at origin
    float ramp = S(0., len, p.x);
    p.y+= curl*ramp*ramp;
    
    vec2 st = SpiralUv(p, len, curl, .02);
    
    d = length(st.xy-vec2(clamp(st.x,0.,len+abs(curl)*4.), 0));
    float seg = sfract(st.x*numsegs, segsharp);
    float s = S(.0, .2*fract(iAnt1.w*10.), st.x-len*iAnt1.w); // smooth
    seg = min(seg, s);
    
    float w = .005*seg;
    float segCol = fract(st.x*numsegs);
    segCol = min(segCol, s);
    vec4 color = mix(baseCol, accentCol, S(accentCol.w, 1., segCol));
    color.a = 1.;
    color.rgb *= S(.005,.0, d-w+.002);
    col = mix(col, color, S(.005,.0, d-w));
    
    return col;
}

float curve(float x, vec4 offs, vec4 amp, vec4 pulse) {
    // returns a fourier-synthesied signal followed by a band-filter
	x *= 3. * pulse.w;
    
    vec4 c = vec4(	SF(x, offs.x, 1.),
                  	SF(x, offs.y, 2.),
                 	SF(x, offs.z, 4.),
                 	SF(x, offs.w, 8.));

    float v = dot(c, amp*vec4(1., .5, .25, .125));
    
    pulse.y/=2.;
    
    v *= S(pulse.x-pulse.y-pulse.z, pulse.x-pulse.y, x);
    v *= S(pulse.x+pulse.y+pulse.z, pulse.x+pulse.y, x); 
    return v;
}

vec4 Wing(vec2 st, vec2 uv, float radius, vec2 center, vec4 misc, vec4 offs, vec4 amp, vec4 pattern1, vec4 global, vec4 detail) {    
    vec2 o=vec2(0.);
    
    // use upsidedown parabola 1-((x - center)*4)^2
    float b = mix(center.x, center.y, st.x);	// change the center based on the angle to further control the wings shape
    float a = (st.x-b)*4.;			// *4 so curve crosses 0 at .5 and 1.
    a *= a;
    a = 1.-a;						// flip curve upside down
    float f = max(0., a);			// make curve 0 outside of interval
    
    f = pow(f, mix(.5, 3., misc.x));
    
    float r = 0.;
    float x = st.x*2.;
    
    r = curve(x-b, offs, amp,vec4(global.x, global.y, max(.1, global.z), .333));
    r = (radius + r*.1)*f;
   
    vec2 vor = voronoi(vec2(st.x, st.y*.1)*40.*detail.z);
   
    if(iSpecial.w<.1)
        r += st.y*vor.x*2.*iSpecial.w; // ragged wings
    
    float edge = 10./max(iRes.x, iRes.y);
     
    o.x = smoothstep(r, r-edge, st.y); // alpha cutout
    
    vec3 col = iCol1.rgb;
    
    misc = pow(misc, vec4(10.));
    
    r -= misc.y*curve(x-b, amp, offs, vec4(offs.xw, amp.wz));
    
    float edgeBand =  S(r-edge*3.*misc.w, r, st.y);
    col = mix(col, iCol2.rgb, edgeBand);
    r = st.y-r;
    
    float clockValue = curve(r*.5+.5, pattern1, offs, amp)*global.x;
    
    float distValue = curve(length(st-offs.yx), pattern1.wzyx, amp, global);
    
    col += (clockValue+pow(distValue,3.))*detail.z;
    
    float d= distance(st, fract(st*20.*detail.x*detail.x));
    col += st.y*st.y*S(.1, .0, d)*detail.w*5.*curve(st.x,pattern1, offs, amp);
    
    float v = detail.x*detail.w; // vor amount
    col *= mix(1., st.y*st.y*(1.-vor.x*vor.x)*15., v); // add vor veins
    
    col = min(max(col, 0.), 1.);
    
    // ocelli
    if(iSpecial.y<.1) {
        float y = r/-.1;
        if(y<1.) {
            vec2 gv = vec2(st.x*30., y);
            gv = fract(gv)-.5;
            d = length(gv)+vor.x*.3;
            float eyes = S(.04,.0,d-(5.*iSpecial.y));
            eyes *= S(.0,.02, st.x-.55); // where the eyes start
            eyes *= S(.05,.0, st.x-.8); // where the eyes end
            vec3 eyeCol = mix(vec3(1), iCol2.rgb, step(iCol2.a, .3));
            col = mix(col, eyeCol, eyes);
        }
    }
    
    // eye
    if(iSpecial.z<.08) {
        d = length(uv-vec2(.3, .13))+vor.x*.03;
        float size = (iSpecial.z/.1);
        float eye = S(.01,.0,d-(.3*size*size));

        float m = S(-1., 1., sin(d*100.))*1.;
        float amount = mix(1., 3.*fract(iSpecial.z*20.), m);
        vec3 eyeCol = clamp(pow(col, vec3(amount*amount)), 0., 1.);
        eye *= vor.x*vor.x;
		
		col = mix(col, eyeCol, eye);
    }
    
    float alpha = o.x;
    
    if(iSuper.x<.01) { // transparent wings
        float gaps = vor.x-.3;
        gaps = max(gaps, .1-st.y);
        gaps = S(.0, .04, gaps);
        gaps = max(gaps, S(.01, .0, -r-.05));
        alpha *= gaps;
    }
    
    return vec4(col, alpha);
}

vec4 Body(vec2 uv, vec4 n) {
	
    vec2 st = uv; // ugly as fuck... gotta clean this uv mess up
    float s = sign(uv.x);
    uv.x = abs(uv.x);
    vec2 P = uv;
    
    uv.x+=.01;
    uv.x *= 3.;
    
    vec2 p = vec2(-.0, 0.);
    float size = .08;
    float skew = 2.1;
    
    float bDist = length(vec2(uv.x*(1.+uv.y*skew), uv.y-p.y))-size;
    
    p.y -= .1;
    uv.x *= mix(.7, 1.5, iBody.w);
    
    size += sin(iTime+uv.y*30.)*.005;
    float offs = sin(uv.x*mix(50., 200., iBody.x)+fract(iBody.x*10.)*TAU)*iBody.y; // segment jiggle
    float segs = sfract(uv.y*30.+offs*-.1, .2);// body segments
    size += segs*.005; 
    
    bDist = min(bDist, length(vec2(uv.x*(1.+uv.y*skew), uv.y-p.y))-size);
    float bAlpha = S(.003, 0., bDist);
     
    float headFade = smoothstep(.2, -.4,uv.y); // mask out details at head
    float wave = S01(uv.y, 0., mix(20., 40., n.y));
    wave *= headFade;
    
    vec4 col = mix(vec4(iCol1.r), iCol1, iCol1.a*2.);
    col *= mix(.5, 1., segs); // blend segments
    col.a = bAlpha;

    
    // add dots
    if(iBody.z<.2) {
        vec2 gv = vec2(uv.x*.3, uv.y)*Rot(iShape.w);
        float dotScale = mix(1., 30., iCol2.w);
        gv = fract(gv*dotScale)-.5;
        //gv.x *= .1;
        float d = length(gv);
        vec4 dotCol = mix(iCol2, vec4(1), iCol2.a);
        float dots = smoothstep(.05,.0,d-.1)*col.a*headFade;
        col += dots*sqrt(segs+.1)*dotCol;
        //col = mix(col, dotCol, dots*2.);
    }
    
    col.rgb *= S(.0,.1, .05-bDist); // body shading
    
    // eyes
    p = P-vec2(0.005,.05);
    float d = length(p);
    float r = .01; // eye radius
    if(d<r) {
        float eyes = smoothstep(.01,.0,d-r);
        float h = sqrt(max(0., r*r-d*d))/r;

        eyes *= smoothstep(-.01, .005, P.x);
        float a = atan(p.x, p.y);
        
        if(iSpecial.x>.9) a += iTime*.2;
        
        vec4 eyeCol = vec4(iCol2.rgb, 1);
        
        eyeCol.rgb *= smoothstep(.01,.0,d-.0);
        eyeCol.rgb *= h;
        eyeCol.rgb += sin(a*10.)*sin(h*10.)*.5*iSpecial.x;
        float fade = smoothstep(.0,.004,abs(P.x+P.y*.2)-.013);
        col = mix(col, eyeCol, eyeCol.a*fade);
    }
   
    
    // add antennae
     float 
        len = mix(.1, .8, iAnt1.x+sin(iTime+s)*.02),
        bend = mix(-.1, .1, iAnt1.y),
        curl = S(.8, 1., iAnt1.z)*.1*len*sign(fract(iAnt1.z*100.)-.5),
        numsegs = mix(5., 30., iAnt2.x),
        segsharp = mix(.05, .9, iAnt2.y);
    vec2 end = vec2(.13,.25);
    end += vec2(sin(iTime), cos(iTime*.3))*.01;
    vec4 antenna = Antenna(P-vec2(0,.07), end, len, bend, curl, numsegs,segsharp, iCol1, iCol2);
    
    col = mix(col, antenna, antenna.a);
    
    // add legs
    vec2 knee = vec2(.03, .04);
    vec2 foot = vec2(.06, .06);
    vec2 toe = vec2(.065, .08);
    vec2 mid = vec2(.07, .0);
    
    P.x += P.y*(iAnt1.w-.5)*(iAnt1.w-.5)*2.; // front-back legs taper
    P.y = abs(P.y);
    st = LineUv(P, vec2(0), knee).xy;
    float w = mix(.002, .003, sfract(st.x, .1));
    d = length(st-vec2(clamp(st.x,0.,1.), 0))-w;
    
    st = LineUv(P, knee, foot).xy;
    w = mix(.001, .003, sfract(st.x, .1));
    d = min(d, length(st-vec2(clamp(st.x,0.,1.), 0))-w);
    
    st = LineUv(P, foot, toe).xy;
    w = mix(.001, .003, sfract(st.x, .1));
    d = min(d, length(st-vec2(clamp(st.x,0.,1.), 0))-w);
    
    st = LineUv(P, vec2(0), mid).xy;
    w = mix(.001, .003, sfract(st.x*2., .1));
    d = min(d, length(st-vec2(clamp(st.x,0.,1.), 0))-w);
    
    float legs = smoothstep(.001,.0,d);
    if(iSpecial.w>.05)legs *= .2; // only show really black legs on ragged butterflies
    
    col = mix(vec4(iCol2.rgb*.2,legs), col, col.a);
    return col;
}

float Tonemap(float x, float k) {
    float u = x-(1.-k);
    float val = u*k / (u+k) + (1.-k);
    return x<(1.-k) ? x : val;
}

vec3 Tonemap(vec3 col, float k) {  
    return vec3(
        Tonemap(col.r, k),
        Tonemap(col.g, k),
        Tonemap(col.b, k)
    );
}

void main()
{
	vec2 P = vec2(iUv.x*iAspect*1.2, iUv.y);
    vec2 p = P;
	vec2 uv = iUv;

	vec2 shapeHash = hash2(iShape.yz);
    float it = shapeHash.x;//*10.+.25; // the only seed that will feed the entire thing
    
    //vec4 pattern1 = vec4(1,.3, .4, .5);//hash4(it+.345);			// get a whole bunch of random numbers 
    //vec4 n1 = vec4(1,.3, .4, .5);//hash4(it);
    //vec4 n2 = vec4(1,.3, .4, .5);//hash4(it+.3);
    //vec4 n3 = vec4(1,.3, .4, .5);//hash4(n1.x);
    vec4 global = vec4(1,.3, .4, .5);//hash4(shapeHash.y);
    vec4 detail = vec4(1,.3, .4, .5);//hash4(it*-11.23);
    vec4 nBody = hash4(it*.1425);
    
    vec4 col = vec4(1.);
    vec4 bodyCol = Body(p, nBody);
    
    p.x = abs(p.x);								// mirror wings
    
    float wingFlap = pow(S01(iTime*2., 10., .05), 40.); 
    
    p.x *= mix(1.,20., wingFlap);
    
    float ra = mix(.1, .8, iShape.x); // wing rotation
    
    p.xy *= Rot(ra);
    
    vec2 st = vec2(atan(p.x, p.y)/PI, length(p));
    
    vec4 top = vec4(0.);
    if(st.x<.6)
    	top = Wing(st, p.xy, .5, vec2(.25, .4), iN1, iN2, iN3, iPattern, iGlobal, iDetail);
    vec4 bottom = vec4(0.);
    if(st.x>.4) {
    	st.x +=(1.-iShape.w)*.2;
        bottom = Wing(st, p.xy, .4, vec2(.5, .75), iN2, iN3, iN1, iPattern, iGlobal, iDetail); 
    }
    
    vec4 wings = mix(bottom, top, top.a);
    wings.a = max(bottom.a, top.a); // fix alpha
    wings.a *= smoothstep(.00, .01, abs(P.x)); // blend with body
    
    wings.rgb *= mix(1., .2, wingFlap);							// darken wings when they are back-to-back
    
  	col = mix(bodyCol*bodyCol.a, wings, wings.a);	// composite wings and body
    //col = bodyCol;
    
    // background
    p = uv;
    vec4 bg = iCol1;
    float d = length(p)*3.;
    float a = atan(p.x,p.y);
    float t = iTime;
    
    float starBurst = sin(a*10.+t)*sin(a*3.-t)*sin(a*7.);
    bg.rgb = pow(bg.rgb, vec3(d));
    bg.rgb += starBurst*d*.2*iSpecial.x;
    
    if(max(iCol1.r, max(iCol1.g, iCol1.b))>.5)
    bg *= bg*bg;
    
	t = iTime;
	
	if(iSuper.y>.99) {
		// laser eyes background
		for(float i=0.; i<1.; i+=1./10.) {
			float k = floor(iTime*5.+i)+i*TAU;
			p = vec2(sin(k*3.), cos(k*.7))*.5*Rot(i*TAU);
			float light = .001/length(P-p);
			bg.rgb += light;
		}
	}
    
	// tonemap
    col.rgb = Tonemap(col.rgb, .2);
	
	// add bg
	col = mix(bg, col, col.a);
	
	if(iSuper.y>.99) {
		// laser eyes
		p = vec2(abs(P.x)-.01, P.y-.05);
		d = length(p);
		float n = iSuper.z; // eye color
		vec3 eyeCol = n<.1 ? vec3(.1, .1, 1.) : n<.4 ? vec3(.1,1,.1) : vec3(1,.1,.1); // red=most common, blue=least common
		col.rgb += (1.-wingFlap)*(sin(iTime)*.25+.75)*eyeCol*.04/d;
	}
	
    col.a = 1.;
    gl_FragColor = (col);
}
