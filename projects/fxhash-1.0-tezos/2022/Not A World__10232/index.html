<!doctype html><html><head><title>Not A World</title><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@500&display=swap" rel="stylesheet"><script id="fxhash-snippet">
      let alphabet = "123456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ"
      var fxhash = new URLSearchParams(window.location.search).get('fxhash')
      let b58dec = str=>[...str].reduce((p,c)=>p*alphabet.length+alphabet.indexOf(c)|0, 0)
      let fxhashTrunc = fxhash.slice(2)
      let regex = new RegExp(".{" + ((fxhashTrunc.length/4)|0) + "}", 'g')
      let hashes = fxhashTrunc.match(regex).map(h => b58dec(h))
      let sfc32 = (a, b, c, d) => {
        return () => {
          a |= 0; b |= 0; c |= 0; d |= 0
          var t = (a + b | 0) + d | 0
          d = d + 1 | 0
          a = b ^ b >>> 9
          b = c + (c << 3) | 0
          c = c << 21 | c >>> 11
          c = c + t | 0
          return (t >>> 0) / 4294967296
        }
      }
      var fxrand = sfc32(...hashes)
      // used to get features during token mint
      window.addEventListener("message", (event) => {
        if (event.data === "fxhash_getFeatures") {
          parent.postMessage({
            id: "fxhash_getFeatures",
            data: window.$fxhashFeatures
          }, "*")
        }
      })
      var isFxpreview = new URLSearchParams(window.location.search).get('preview') === "1"
      function fxpreview() {
        window.dispatchEvent(new Event("fxhash-preview"))
        setTimeout(() => fxpreview(), 500)
      }
</script><link rel="stylesheet" href="./style.css"></head><body><script id="vertexShaderSphere" type="x-shader/x-vertex">varying vec3 vPos;

          vPos = position;
          vNormal = normal;

          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }</script><script id="fragmentShaderSphere" type="x-shader/x-fragment">varying vec3 vPos;
      uniform vec3 colorA;
      uniform vec3 colorB;
      uniform vec3 colorC;
      uniform vec3 colorD;

      float remap(float value, float a, float b, float c, float d) {
        return b + (d - b) * (value - a) / (c - a);
      }

      void main() {
          float ratio = (length(vPos) - 3.5) / 0.7;
          vec3 color = vec3(0.0);
    
          color = 
            mix(
              mix(colorA, colorB, 
                clamp((ratio - .1) / (.15 - .1), 0.0, 1.0)),
              mix(colorC, colorD, 
                clamp((ratio - .98) / (1. - .98), 0.0, 1.0)),
              clamp((ratio - .35) / (.4 - .35), 0.0, 1.0)
            );

          gl_FragColor = vec4(color, 1.);
      }</script><script id="vertexShaderPlane" type="x-shader/x-vertex">varying vec2 vUv;

      void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }</script><script id="fragmentShaderPlane" type="x-shader/x-fragment">uniform vec3 color1;

      varying vec2 vUv;
      vec3 color2 = vec3(0.01,0.02,0.2);

      void main(){
        vec2 uv = (vUv - 0.5) * vec2(5.);
        gl_FragColor = vec4( mix( color1, color2, smoothstep(.1,.7, length(uv))), 1. );
      }</script><div id="nameTag"></div><script defer="defer" src="./bundle.js"></script></body></html>
