<!doctype html><html><head><title>FXHASH project</title><meta charset="utf-8"><script id="fxhash-snippet">
      let alphabet = "123456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ"
      var fxhash = new URLSearchParams(window.location.search).get('fxhash')
      let b58dec = str=>[...str].reduce((p,c)=>p*alphabet.length+alphabet.indexOf(c)|0, 0)
      let fxhashTrunc = fxhash.slice(2)
      let regex = new RegExp(".{" + ((fxhashTrunc.length/4)|0) + "}", 'g')
      let hashes = fxhashTrunc.match(regex).map(h => b58dec(h))
      let sfc32 = (a, b, c, d) => {
        return () => {
          a |= 0; b |= 0; c |= 0; d |= 0
          var t = (a + b | 0) + d | 0
          d = d + 1 | 0
          a = b ^ b >>> 9
          b = c + (c << 3) | 0
          c = c << 21 | c >>> 11
          c = c + t | 0
          return (t >>> 0) / 4294967296
        }
      }
      var fxrand = sfc32(...hashes)
      // used to get features during token mint
      window.addEventListener("message", (event) => {
        if (event.data === "fxhash_getFeatures") {
          parent.postMessage({
            id: "fxhash_getFeatures",
            data: window.$fxhashFeatures
          }, "*")
        }
      })
      var isFxpreview = new URLSearchParams(window.location.search).get('preview') === "1"
      function fxpreview() {
        window.dispatchEvent(new Event("fxhash-preview"))
        setTimeout(() => fxpreview(), 500)
      }
</script><title>Perlin Noise</title><link rel="stylesheet" href="./style.css"><script src="p5.min.js"></script><script src="sketch.js"></script></head><body><script>// Features=
      function getBackgroundMode() {
        value = fxrand()

          return "Dark"
        } else if (value < 0.8) {
          return "Neutral"
        } else {
          return "Light"
        }
      }

          return "Keep It Low Key"
        } else if (value < 0.14) {
          return "Down to Earth"
        } else if (value < 0.21) {
          return "Light As a Feather"
        } else if (value < 0.28) {
          return "Cold Hands, Warm Heart"
        } else if (value < 0.35) {
          return "Pure Imagination"
        } else if (value < 0.42) {
          return "Gray Area"
        } else if (value < 0.49) {
          return "Green As Grass"
        } else if (value < 0.56) {
          return "Fresh Start"
        } else if (value < 0.63) {
          return "Airy Fairy"
        } else if (value < 0.7) {
          return "Central Park"
        } else if (value < 0.77) {
          return "In a Fog"
        } else if (value < 0.84) {
          return "Up In the Sky"
        } else if (value < 0.91) {
          return "Pink Elephants"
        } else {
          return "Mix It Up"
        }
      }

      function getNumShapes() {
        value = fxrand()
        return value * 120
      }

      function getSolidity() {
        value = fxrand()
        if (value < 0.4) {
          return "Hollow"
        } else if (value < 0.6) {
          return "Solid Square"
        } else if (value < 0.8) {
          return "Solid Circle"
        } else {
          return "Solid Triangle"
        }
      }

      function getNoiseScale() {
        value = fxrand()
        return value * 800
      }

      function getNoiseStrength() {
        value = fxrand()
        return value * 8000
      }

      var background_mode = getBackgroundMode()
      var palette = getPalette()
      var num_shapes = getNumShapes()
      var solidity = getSolidity()
      var noise_scale = getNoiseScale()
      var noise_strength = getNoiseStrength()

      window.$fxhashFeatures = {
        "Background Mode": background_mode,
        "Palette": palette,
        "Number of Shapes": num_shapes,
        "Solidity": solidity,
        "Noise Scale": noise_scale,
        "Noise Strength": noise_strength,
      }</script><script defer="defer" src="./bundle.js"></script></body></html>
